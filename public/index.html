    let id = null, bx = 0, by = 0, enabled = false;
    const place = () => { base.style.transform = `translate(${bx}px, ${by}px)`; };
    function reset() {
      id = null;
      value.x = 0;
      value.y = 0;
      base.classList.remove('on');
      home.classList.remove('hide');
      knob.style.transform = '';
    }
    return {
      value,
      get active() { return id !== null; },
      setEnabled(on) { enabled = on; if (!on && id !== null) reset(); },
      start(e) {
        if (!enabled || id !== null || e.pointerType === 'mouse') return false;
        if (e.clientX > window.innerWidth * 0.5 || e.clientY < window.innerHeight * 0.3) return false;
        id = e.pointerId;
        bx = e.clientX;
        by = e.clientY;
        place();
        knob.style.transform = '';
        base.classList.add('on');
        home.classList.add('hide');
        return true;
      },
      move(e) {
        if (e.pointerId !== id) return false;
        let dx = e.clientX - bx, dy = e.clientY - by;
        const len = Math.hypot(dx, dy);
        if (len > R) {
          bx += dx * (1 - R / len);
          by += dy * (1 - R / len);
          dx = e.clientX - bx;
          dy = e.clientY - by;
          place();
        }
        knob.style.transform = `translate(${dx}px, ${dy}px)`;
        const m = Math.hypot(dx, dy) / R;
        const k = m < DEAD ? 0 : (m - DEAD) / (1 - DEAD) / m;
        value.x = (dx / R) * k;
        value.y = (-dy / R) * k;
        return true;
      },
      end(e) {
        if (e.pointerId !== id) return false;
        reset();
        return true;
      },
    };
  }

  // 8-2. 키보드: WASD · 방향키로 이동(Shift를 누르면 걷기), 스페이스로 점프
  function createKeys() {
    const down = new Set();
    const MOVE = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
    window.addEventListener('keydown', (e) => {
      if (e.target instanceof HTMLInputElement) return; // 채팅 입력 중엔 움직이지 않음
      if (e.target instanceof HTMLButtonElement && (e.code === 'Space' || e.code === 'Enter')) return;
      if (MOVE.has(e.code)) { down.add(e.code); e.preventDefault(); }
      else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') down.add('Shift');
      else if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) player.requestJump(); }
    });
    window.addEventListener('keyup', (e) => {
      down.delete(e.code);
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') down.delete('Shift');
    });
    window.addEventListener('blur', () => down.clear());
    return {
      read(out) {
        const has = (a, b) => down.has(a) || down.has(b);
        let x = (has('KeyD', 'ArrowRight') ? 1 : 0) - (has('KeyA', 'ArrowLeft') ? 1 : 0);
        let y = (has('KeyW', 'ArrowUp') ? 1 : 0) - (has('KeyS', 'ArrowDown') ? 1 : 0);
        const l = Math.hypot(x, y);
        if (l > 1) { x /= l; y /= l; }
        const k = down.has('Shift') ? 0.5 : 1;
        out.x = x * k;
        out.y = y * k;
        return out;
      },
    };
  }

  // 8-3. 이동 · 점프 · 착지
  function createPlayer(avatar, stick, keys) {
    const K = CONFIG.character;
    const up = new THREE.Vector3().fromArray(K.spawn).normalize();
    const heading = new THREE.Vector3().fromArray(K.facing).projectOnPlane(up).normalize();
    const vel = new THREE.Vector3();
    const camBack = new THREE.Vector3(); // 카메라가 캐릭터의 어느 쪽 뒤에 있는지 (땅과 평행한 방향)
    const sunRef = new THREE.Vector3();  // 해가 떠 있는 쪽의 기준 (땅과 평행한 방향)
    const carried = [up, heading, vel, camBack, sunRef];
    const saved = carried.map(() => new THREE.Vector3());
    const move = new THREE.Vector3(), target = new THREE.Vector3(), axis = new THREE.Vector3(), side = new THREE.Vector3();
    const camFwd = new THREE.Vector3(), camRight = new THREE.Vector3(), normal = new THREE.Vector3();
    const q = new THREE.Quaternion(), basis = new THREE.Matrix4();
    const input = { x: 0, y: 0 };
    const faceTarget = new THREE.Vector3();
    let facing = false; // 대화 상대 쪽으로 몸 돌리기
    let override = null; // 테스트용 입력
    const on = { jump: null, land: null }; // 점프 · 착지 순간 알림 (소리)
    let radius = terrain.radiusAt(up);
    let vy = 0, grounded = true, coyote = 0, jumpBuffer = 0, enabled = false, locked = false, moving = 0, height = 0, blocked = 0;

    // 처음 카메라는 캐릭터 정면 비스듬히 (3단계와 같은 구도). 해도 그 카메라 뒤쪽에서 시작
    const yaw0 = CONFIG.followCam.introYaw;
    side.crossVectors(up, heading);
    camBack.copy(heading).multiplyScalar(-Math.cos(yaw0)).addScaledVector(side, Math.sin(yaw0)).normalize();
    sunRef.copy(camBack);

    function roll(quat) {
      for (const v of carried) v.applyQuaternion(quat);
      up.normalize();
      vel.projectOnPlane(up);
      heading.projectOnPlane(up).normalize();
      camBack.projectOnPlane(up).normalize();
      sunRef.projectOnPlane(up).normalize();
    }

    function update(dt) {
      if (dt <= 0) return;
      // 1) 입력 → 땅 위 방향 (화면 위쪽 = 카메라가 보는 쪽)
      if (override) { input.x = override.x; input.y = override.y; }
      else if (!enabled || locked) { input.x = 0; input.y = 0; } // 대화 중엔 멈춤
      else if (stick.active) { input.x = stick.value.x; input.y = stick.value.y; }
      else keys.read(input);
      const strength = Math.min(1, Math.hypot(input.x, input.y));
      camFwd.copy(camBack).negate();
      camRight.crossVectors(camFwd, up);
      move.set(0, 0, 0).addScaledVector(camRight, input.x).addScaledVector(camFwd, input.y);
      if (strength > 1e-3) move.normalize();

      // 2) 속도: 땅에선 빠르게, 공중에선 천천히 목표를 따라감. 얕은 물속은 느리게
      const wading = terrain.radiusAt(up) < terrain.waterRadius - 0.1;
      target.copy(move).multiplyScalar(strength * K.runSpeed * (wading ? K.waterSlow : 1) * boost.run);
      vel.lerp(target, 1 - Math.exp(-(grounded ? K.accel : K.airAccel) * dt)).projectOnPlane(up);

      // 3) 구면 위로 한 걸음: 위 벡터를 (위 × 속도) 축으로 굴림
      let moved = 0;
      const speed = vel.length();
      if (speed > 1e-4) {
        const step = speed * dt;
        axis.crossVectors(up, vel).normalize();
        q.setFromAxisAngle(axis, step / radius);
        carried.forEach((v, i) => saved[i].copy(v));
        roll(q);
        props.collide(up, radius, vel, roll); // 나무 · 바위에 막히면 옆으로 밀려나며 미끄러짐
        const next = terrain.radiusAt(up);
        if (grounded && next - radius > step * K.maxClimb + 0.02) {
          carried.forEach((v, i) => v.copy(saved[i])); // 너무 가파른 오르막은 못 오름
          vel.multiplyScalar(0.2);
          blocked++;
        } else {
          moved = saved[0].angleTo(up) * radius;
          if (grounded) {
            if (radius - next > K.snapDown) { grounded = false; vy = 0; } // 턱에서 발이 떨어짐
            else radius = next;
          }
        }
      }

      // 4) 점프 · 낙하 (착지 직전 누른 점프 기억, 턱에서 떨어진 직후에도 점프 허용)
      coyote = grounded ? K.coyote : Math.max(0, coyote - dt);
      jumpBuffer = Math.max(0, jumpBuffer - dt);
      if (jumpBuffer > 0 && coyote > 0) {
        grounded = false;
        coyote = 0;
        jumpBuffer = 0;
        vy = K.jumpSpeed * boost.jump;
        if (on.jump) on.jump();
      }
      if (!grounded) {
        vy -= K.gravity * dt;
        radius += vy * dt;
        const floor = terrain.radiusAt(up);
        if (radius <= floor) {
          if (vy < -1) {
            const k = clamp(-vy / K.jumpSpeed, 0.35, 1.2);
            avatar.land(k);
            if (on.land) on.land(k);
          }
          radius = floor;
          vy = 0;
          grounded = true;
        }
      }
      // 최종 높이로 한 번 더: 점프해서 바위를 넘다가 그 높이 아래로 내려오면 옆으로 밀어냄
      props.collide(up, radius, vel, roll);
      if (grounded) radius = terrain.radiusAt(up);

      // 5) 가려는 쪽으로 몸을 돌림
      if (strength > 0.05) {
        if (heading.dot(move) < -0.97) heading.addScaledVector(side.crossVectors(up, heading), 0.25);
        heading.lerp(move, 1 - Math.exp(-K.turnRate * dt)).projectOnPlane(up).normalize();
        facing = false;
      } else if (facing) {
        heading.lerp(faceTarget.projectOnPlane(up).normalize(), 1 - Math.exp(-8 * dt)).projectOnPlane(up).normalize();
      }
      moving = strength > 0.05 ? speed / K.runSpeed : 0;

      // 6) 캐릭터에 반영: 발 딛는 자리 · 방향 · 동작
      const floor = terrain.radiusAt(up, normal);
      height = Math.max(0, radius - floor);
      avatar.anchor.position.copy(up).multiplyScalar(floor);
      side.crossVectors(up, heading);
      avatar.anchor.quaternion.setFromRotationMatrix(basis.makeBasis(side, up, heading));
      avatar.animate(dt, { speed: moved / dt / K.runSpeed, grounded, vy, height, groundNormal: normal });
    }

    return {
      update,
      on,
      up, heading, camBack, sunRef,
      anchor: avatar.anchor,
      get moving() { return moving; },
      get height() { return height; },
      get grounded() { return grounded; },
      setEnabled(on) { enabled = on; stick.setEnabled(on); if (!on) jumpBuffer = 0; },
      requestJump() { if ((enabled && !locked) || override) jumpBuffer = K.jumpBuffer; },
      setLocked(v) { locked = v; if (v) jumpBuffer = 0; },
      get locked() { return locked; },
      face(dir) { faceTarget.copy(dir).projectOnPlane(up).normalize(); facing = true; },
      // 테스트 · 연출용
      setOverride(v) { override = v; },
      teleport(dir, facing) {
        up.copy(dir).normalize();
        heading.copy(facing || heading).projectOnPlane(up);
        if (heading.lengthSq() < 1e-8) heading.set(1, 0, 0).projectOnPlane(up);
        heading.normalize();
        camBack.copy(heading).negate();
        sunRef.copy(camBack);
        vel.set(0, 0, 0);
        vy = 0;
        grounded = true;
        radius = terrain.radiusAt(up);
      },
      debug() { return { radius, floor: terrain.radiusAt(up), vy, grounded, blocked }; },
    };
  }

  // ═══════════════════════════════════════════════
  // 9. CAMERA — 행성 보기(궤도) ↔ 캐릭터 뒤따르기, 두 시점을 부드럽게 오간다
  //    조이스틱이 아닌 손가락 · 마우스 드래그: 둘러보기 / 두 손가락 핀치 · 휠: 확대
  // ═══════════════════════════════════════════════

  // 9-1. 손가락마다 역할 배정: 왼쪽 아래에서 시작한 터치는 조이스틱, 나머지는 카메라
  function createGestures(el, getView, joystick) {
    const cams = new Map();
    let pinchLen = 0;
    const spread = () => {
      const it = cams.values();
      const a = it.next().value;
      const b = it.next().value;
      return Math.hypot(a.x - b.x, a.y - b.y) || 1;
    };
    const touched = () => {
      getView().touched();
      hintEl.classList.add('faded');
    };
    el.addEventListener('pointerdown', (e) => {
      if (el.setPointerCapture) el.setPointerCapture(e.pointerId);
      if (joystick.start(e)) { hintEl.classList.add('faded'); return; }
      cams.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (cams.size === 2) pinchLen = spread();
      touched();
    });
    el.addEventListener('pointermove', (e) => {
      if (joystick.move(e)) return;
      const p = cams.get(e.pointerId);
      if (!p) return;
      const dx = e.clientX - p.x;
      const dy = e.clientY - p.y;
      p.x = e.clientX;
      p.y = e.clientY;
      const v = getView();
      v.touched();
      if (cams.size === 1) v.rotate(dx, dy);
      else if (cams.size === 2 && pinchLen > 0) {
        const len = spread();
        v.zoom(pinchLen / len);
        pinchLen = len;
      }
    });
    const release = (e) => {
      if (joystick.end(e)) return;
      cams.delete(e.pointerId);
      pinchLen = cams.size === 2 ? spread() : 0;
    };
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('lostpointercapture', release);
    el.addEventListener('wheel', (e) => {
      e.preventDefault();
      touched();
      getView().zoom(Math.exp(e.deltaY * 0.0012));
    }, { passive: false });
  }

  // 9-2. 행성 보기: 행성 중심을 도는 궤도
  function createPlanetView() {
    const R = CONFIG.planet.radius;
    const max = CONFIG.orbit.max;
    const s = { theta: 0, phi: 1, dist: 0, tTheta: 0, tPhi: 1, tDist: 0, idle: 0 };
    let zoomMin = CONFIG.orbit.min;
    let userZoomed = false;
    const pose = { position: new THREE.Vector3(), target: new THREE.Vector3(), up: new THREE.Vector3(0, 1, 0) };

    // 화면 비율에 맞춘 거리 (세로 화면일수록 멀어짐)
    //   fitDistance     — 행성 전체가 화면에 들어오는 거리
    //   updateZoomRange — 가장 가까이 당겨도 화면 모서리에 우주가 조금 남는 거리까지만 허용
    function halfAngles() {
      const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      const th = tv * camera.aspect;
      return { narrow: Math.atan(Math.min(tv, th)), diagonal: Math.atan(Math.hypot(tv, th)) };
    }
    function fitDistance() {
      return clamp(((R + 5) / Math.sin(halfAngles().narrow)) * 1.06, zoomMin, max);
    }
    function updateZoomRange() {
      zoomMin = Math.max(CONFIG.orbit.min, (R + 2) / Math.sin(halfAngles().diagonal));
      s.tDist = clamp(s.tDist, zoomMin, max);
    }
    updateZoomRange();
    s.dist = s.tDist = fitDistance();

    return {
      pose,
      rotate(dx, dy) {
        s.tTheta -= dx * 0.006;
        s.tPhi = clamp(s.tPhi - dy * 0.006, 0.18, Math.PI - 0.18);
      },
      zoom(ratio) {
        s.tDist = clamp(s.tDist * ratio, zoomMin, max);
        userZoomed = true;
      },
      touched() { s.idle = 0; },
      update(dt) {
        s.idle += dt;
        if (!REDUCED_MOTION && s.idle > CONFIG.orbit.idleDelay) s.tTheta += CONFIG.orbit.autoRotateSpeed * dt;
        s.theta = damp(s.theta, s.tTheta, 9, dt);
        s.phi = damp(s.phi, s.tPhi, 9, dt);
        s.dist = damp(s.dist, s.tDist, 2.6, dt);
        const sp = Math.sin(s.phi);
        pose.position.set(s.dist * sp * Math.sin(s.theta), s.dist * Math.cos(s.phi), s.dist * sp * Math.cos(s.theta));
      },
      onResize() {
        updateZoomRange();
        if (!userZoomed) s.tDist = fitDistance();
      },
      // 이 방향(행성 중심 기준)이 화면 가운데 오도록 바로 맞춤
      lookAtDir(dir) {
        s.theta = s.tTheta = Math.atan2(dir.x, dir.z);
        s.phi = s.tPhi = clamp(Math.acos(clamp(dir.y, -1, 1)), 0.18, Math.PI - 0.18);
        s.idle = 0;
      },
    };
  }

  // 9-3. 캐릭터 뒤따르기: 가슴 높이를 바라보며 뒤쪽 위에서 따라감
  //   좌우 드래그 = 캐릭터 둘레로 돌기, 위아래 = 내려다보는 각도
  //   옆으로 걸으면 카메라가 천천히 등 뒤로 돌아옴 (직접 돌린 직후, 카메라 쪽으로 걸을 땐 쉼)
  function createFollowView(p) {
    const C = CONFIG.followCam;
    const s = { pitch: C.pitch, dist: C.dist, tPitch: C.pitch, tDist: C.dist, yawLeft: 0, sinceDrag: 99, shown: C.dist };
    const pose = { position: new THREE.Vector3(), target: new THREE.Vector3(), up: new THREE.Vector3(0, 1, 0) };
    const aim = new THREE.Vector3(), behind = new THREE.Vector3(), cross = new THREE.Vector3(), offset = new THREE.Vector3();
    let focus = null; // 대화 상대처럼 함께 보여 줄 지점
    let fresh = true;
    return {
      pose,
      rotate(dx, dy) {
        s.yawLeft -= dx * 0.008;
        s.tPitch = clamp(s.tPitch + dy * 0.006, C.minPitch, C.maxPitch);
        s.sinceDrag = 0;
      },
      zoom(ratio) { s.tDist = clamp(s.tDist * ratio, C.min, C.max); },
      touched() { s.sinceDrag = 0; },
      update(dt) {
        const up = p.up;
        const turn = s.yawLeft * (1 - Math.exp(-14 * dt));
        s.yawLeft -= turn;
        if (turn !== 0) p.camBack.applyAxisAngle(up, turn);
        s.sinceDrag += dt;
        if (p.moving > 0.05 && s.sinceDrag > C.followDelay && -p.heading.dot(p.camBack) > -0.2) {
          behind.copy(p.heading).negate();
          const ang = Math.atan2(cross.crossVectors(p.camBack, behind).dot(up), p.camBack.dot(behind));
          p.camBack.applyAxisAngle(up, ang * (1 - Math.exp(-C.followRate * p.moving * dt)));
        }
        p.camBack.projectOnPlane(up).normalize();
        s.pitch = damp(s.pitch, s.tPitch, 8, dt);
        s.dist = damp(s.dist, s.tDist, 6, dt);
        // 점프할 땐 절반만 따라 올라가서 화면이 덜 흔들림
        aim.copy(p.anchor.position).addScaledVector(up, C.focusHeight + p.height * 0.5);
        if (focus) aim.lerp(focus, 0.5); // 둘 사이 가운데를 바라봄
        if (fresh) { pose.target.copy(aim); fresh = false; } else pose.target.lerp(aim, 1 - Math.exp(-12 * dt));
        // 나무 · 바위 · 산등성이가 캐릭터를 가리면 그 앞까지 당겨 옴 (당길 땐 빠르게, 돌아갈 땐 천천히)
        offset.copy(p.camBack).multiplyScalar(Math.cos(s.pitch)).addScaledVector(up, Math.sin(s.pitch));
        const free = props.rayBlock(pose.target, offset, s.dist);
        const want = free < s.dist ? Math.min(s.dist, Math.max(4.2, free - 0.4)) : s.dist; // 너무 가까이는 안 옴 (가까운 소품은 흩어지듯 사라짐)
        s.shown = damp(s.shown, want, want < s.shown ? 14 : 2.5, dt);
        pose.position.copy(pose.target).addScaledVector(offset, s.shown);
        pose.up.copy(up);
      },
      debug() { return { dist: s.dist, shown: s.shown }; },
      zoomTo(d) { s.tDist = clamp(d, C.min, C.max); },
      get targetDist() { return s.tDist; },
      setFocus(point) { focus = point ? (focus || new THREE.Vector3()).copy(point) : null; },
      turnTo(back) { // 카메라를 이 방향(땅과 평행) 뒤쪽으로 부드럽게 돌림
        s.yawLeft = Math.atan2(cross.crossVectors(p.camBack, back).dot(p.up), p.camBack.dot(back));
        s.sinceDrag = 0;
      },
    };
  }

  // 9-4. 두 시점을 섞어 실제 카메라에 적용 (t: 0 = 행성, 1 = 캐릭터)
  function createCameraRig(far, near) {
    let mode = 'planet';
    let t = 0, from = 0, to = 0, elapsed = 0, duration = 0;
    const dA = new THREE.Vector3(), dB = new THREE.Vector3(), axis = new THREE.Vector3();
    const target = new THREE.Vector3(), up = new THREE.Vector3(), dir = new THREE.Vector3();
    const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

    // 방향은 구면을 따라 돌고 거리는 비율로 줄어듦 → 행성을 뚫지 않고 스르륵 내려앉는다
    function blend(A, B, k) {
      const rA = A.position.length();
      const rB = B.position.length();
      dA.copy(A.position).divideScalar(rA);
      dB.copy(B.position).divideScalar(rB);
      const angle = Math.acos(clamp(dA.dot(dB), -1, 1));
      axis.crossVectors(dA, dB);
      if (axis.lengthSq() < 1e-12) axis.set(0, 0, 1).cross(dA);
      if (axis.lengthSq() < 1e-12) axis.set(1, 0, 0);
      axis.normalize();
      camera.position.copy(dA).applyAxisAngle(axis, angle * k).multiplyScalar(rA * Math.pow(rB / rA, k));
      target.lerpVectors(A.target, B.target, k);
      up.lerpVectors(A.up, B.up, k).normalize();
      dir.copy(camera.position).normalize();
      const floor = terrain.radiusAt(dir) + 0.35; // 땅속으로 파고들지 않게
      if (camera.position.length() < floor) camera.position.copy(dir).multiplyScalar(floor);
      camera.up.copy(up);
      camera.lookAt(target);
    }
    return {
      get mode() { return mode; },
      get t() { return t; },
      active() { return mode === 'character' ? near : far; },
      setMode(next, seconds = 2.2) {
        mode = next;
        from = t;
        to = next === 'character' ? 1 : 0;
        elapsed = 0;
        duration = REDUCED_MOTION ? 0 : seconds;
      },
      update(dt) {
        far.update(dt);
        near.update(dt);
        elapsed += dt;
        const k = duration > 0 ? clamp(elapsed / duration, 0, 1) : 1;
        t = from + (to - from) * ease(k);
        blend(far.pose, near.pose, t);
      },
    };
  }

  // ═══════════════════════════════════════════════
  // 10. SEASON FX — 계절 분위기 · 파티클 · 구역 알림
  //    캐릭터가 선 자리의 계절 비율대로 하늘빛 · 햇빛 · 옅은 안개가 서서히 바뀌고
  //    봄엔 꽃잎, 여름엔 반딧불, 가을엔 낙엽, 겨울엔 눈이 날린다
  // ═══════════════════════════════════════════════
  const MOODS = PLANET.moods ? PLANET.moods : [
    { line: '벚꽃 흩날리는 언덕', sky: [0.52, 0.62, 1.0], sun: 0xffe6ee, sunI: 2.7, amb: 0xa3a6ff, fog: 0xcfd6f2 },
    { line: '반딧불 춤추는 숲과 호수', sky: [0.34, 0.68, 1.0], sun: 0xfff4dc, sunI: 3.0, amb: 0x8fb4ff, fog: 0xa8cff0 },
    { line: '단풍 물든 계단 언덕', sky: [0.62, 0.58, 0.9], sun: 0xffd7a3, sunI: 2.8, amb: 0xb0a0ff, fog: 0xe2cbb4 },
    { line: '눈 내리는 설산과 얼음 연못', sky: [0.56, 0.72, 1.0], sun: 0xf0f5ff, sunI: 2.5, amb: 0xadc6ff, fog: 0xdde9f7 },
  ];

  // 10-1. 파티클: 캐릭터 둘레에서만 살아 있다가 땅에 닿거나 멀어지면 다시 태어남
  function createParticles() {
    const R = CONFIG.planet.radius;
    const RANGE = CONFIG.fx.range;
    const rng = makeRng(CONFIG.seed + 777);
    const KINDS = [
      { season: 0, count: 150, shape: 1, colors: [0xffc6d9, 0xffb3cd, 0xffdbe7], sizes: [0.14, 0.2], fall: [0.4, 0.75], flutter: 0.8, spin: 2.4, source: 'cherry' },
      { season: 1, count: 70, shape: 3, colors: [0xdcff7a, 0xf1ff9e, 0xb8ff6a], sizes: [0.2, 0.28], hover: true, additive: true },
      { season: 2, count: 150, shape: 2, colors: [0xe0572e, 0xf08a33, 0xf5b942, 0xc9412a], sizes: [0.2, 0.3], fall: [0.55, 0.95], flutter: 1.0, spin: 3.0, source: 'maple' },
      { season: 3, count: 360, shape: 0, colors: [0xffffff, 0xeef5ff], sizes: [0.07, 0.13], fall: [0.7, 1.25], flutter: 0.35, spin: 0 },
      { season: -1, rain: true, count: 420, shape: 4, colors: [0xc4dbff, 0xaecbf5, 0xd6e6ff], sizes: [0.75, 1.05], fall: [11, 14], flutter: 0, spin: 0 }, // 비 (날씨)
    ];
    if (PLANET.id !== 'seasons') for (const K of KINDS) if (!K.rain) K.count = 0; // 꽃잎 · 반딧불 · 낙엽 · 눈은 사계절 행성에만
    const uScale = { value: 1 };
    const col = new THREE.Color();
    for (const K of KINDS) {
      const n = K.count;
      K.buf = { pos: new Float32Array(n * 3), col: new Float32Array(n * 3), size: new Float32Array(n), angle: new Float32Array(n), alpha: new Float32Array(n) };
      K.st = { fall: new Float32Array(n), phase: new Float32Array(n), freq: new Float32Array(n), spin: new Float32Array(n), age: new Float32Array(n), life: new Float32Array(n) };
      if (K.hover) { K.st.anchor = new Float32Array(n * 3); K.st.ta = new Float32Array(n * 3); K.st.tb = new Float32Array(n * 3); }
      for (let i = 0; i < n; i++) {
        col.setHex(K.colors[Math.floor(rng() * K.colors.length)], THREE.LinearSRGBColorSpace); // 셰이더 출력값 그대로
        K.buf.col[i * 3] = col.r; K.buf.col[i * 3 + 1] = col.g; K.buf.col[i * 3 + 2] = col.b;
        K.buf.size[i] = mix(K.sizes[0], K.sizes[1], rng());
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(K.buf.pos, 3).setUsage(THREE.DynamicDrawUsage));
      geo.setAttribute('aColor', new THREE.BufferAttribute(K.buf.col, 3));
      geo.setAttribute('aSize', new THREE.BufferAttribute(K.buf.size, 1));
      geo.setAttribute('aAngle', new THREE.BufferAttribute(K.buf.angle, 1).setUsage(THREE.DynamicDrawUsage));
      geo.setAttribute('aAlpha', new THREE.BufferAttribute(K.buf.alpha, 1).setUsage(THREE.DynamicDrawUsage));
      K.material = new THREE.ShaderMaterial({
        uniforms: { uScale, uOpacity: { value: 0 }, uShape: { value: K.shape } },
        vertexShader: shaderSource('fx-vs'),
        fragmentShader: shaderSource('fx-fs'),
        transparent: true,
        depthWrite: false,
        blending: K.additive ? THREE.AdditiveBlending : THREE.NormalBlending,
      });
      K.points = new THREE.Points(geo, K.material);
      K.points.frustumCulled = false;
      K.points.visible = false;
      K.points.renderOrder = 2;
      K.opacity = 0;
      K.primed = false;
      K.sources = [];
      scene.add(K.points);
    }

    const focus = new THREE.Vector3(), wind = new THREE.Vector3(), tmp = new THREE.Vector3(), tA = new THREE.Vector3(), tB = new THREE.Vector3();
    let sourceWait = 0;
    let wNow = { rain: 0, storm: 0 }, rainAngle = 0;
    const ra = new THREE.Vector3(), rb = new THREE.Vector3();
    // 캐릭터 앞쪽(카메라가 보는 쪽)으로 치우친 원판 안의 임의 지점
    function spot(out) {
      tA.set(rng() - 0.5, rng() - 0.5, rng() - 0.5).projectOnPlane(focus).normalize();
      return out.copy(focus).applyAxisAngle(tB.crossVectors(focus, tA).normalize(), (RANGE * 0.9 * Math.sqrt(rng())) / R);
    }
    function respawn(K, i, fresh) {
      const b = K.buf, s = K.st, j = i * 3;
      if (K.hover) {
        spot(tmp);
        tmp.multiplyScalar(terrain.radiusAt(tmp) + mix(0.5, 2.2, rng()));
        s.anchor[j] = tmp.x; s.anchor[j + 1] = tmp.y; s.anchor[j + 2] = tmp.z;
        tB.copy(tmp).normalize();
        tA.set(rng() - 0.5, rng() - 0.5, rng() - 0.5).projectOnPlane(tB).normalize();
        s.ta[j] = tA.x; s.ta[j + 1] = tA.y; s.ta[j + 2] = tA.z;
        tA.crossVectors(tB, tA);
        s.tb[j] = tA.x; s.tb[j + 1] = tA.y; s.tb[j + 2] = tA.z;
        s.life[i] = mix(5, 9, rng());
        s.age[i] = fresh ? rng() * s.life[i] * 0.5 : 0;
      } else {
        if (K.source && K.sources.length && rng() < 0.65) { // 가까운 나무 수관에서 떨어짐
          const cr = K.sources[Math.floor(rng() * K.sources.length)];
          tmp.set(rng() - 0.5, rng() - 0.5, rng() - 0.5).normalize().multiplyScalar(cr.r * 0.75 * Math.cbrt(rng())).add(cr.center);
        } else {
          spot(tmp);
          tmp.multiplyScalar(terrain.radiusAt(tmp) + (fresh ? mix(0.3, 8, rng()) : mix(5.5, 9, rng())));
        }
        b.pos[j] = tmp.x; b.pos[j + 1] = tmp.y; b.pos[j + 2] = tmp.z;
        s.life[i] = mix(9, 15, rng());
        s.age[i] = 0;
      }
      s.fall[i] = K.fall ? mix(K.fall[0], K.fall[1], rng()) : 0;
      s.phase[i] = rng() * Math.PI * 2;
      s.freq[i] = mix(1.2, 2.6, rng());
      s.spin[i] = K.spin * (rng() < 0.5 ? -1 : 1) * mix(0.6, 1.2, rng());
      b.angle[i] = rng() * Math.PI * 2;
      b.alpha[i] = 0;
    }
    function refreshSources(K, center) {
      K.sources.length = 0;
      for (const it of props.debug.placed[K.source] || []) {
        if (it.crown && it.crown.center.distanceToSquared(center) < 256) K.sources.push(it.crown);
      }
    }
    function simulate(K, dt, time, center) {
      const b = K.buf, s = K.st, R2 = RANGE * RANGE;
      for (let i = 0; i < K.count; i++) {
        const j = i * 3;
        s.age[i] += dt;
        let x, y, z;
        if (K.hover) { // 반딧불: 제자리 둘레를 맴돌며 깜빡임
          const t1 = time * s.freq[i] + s.phase[i];
          const ax = s.anchor[j], ay = s.anchor[j + 1], az = s.anchor[j + 2];
          const ar = Math.hypot(ax, ay, az);
          const a1 = 0.7 * Math.sin(t1), a2 = 0.7 * Math.cos(t1 * 0.8 + 1), a3 = 0.3 * Math.sin(t1 * 1.3);
          x = ax + s.ta[j] * a1 + s.tb[j] * a2 + (ax / ar) * a3;
          y = ay + s.ta[j + 1] * a1 + s.tb[j + 1] * a2 + (ay / ar) * a3;
          z = az + s.ta[j + 2] * a1 + s.tb[j + 2] * a2 + (az / ar) * a3;
        } else { // 떨어짐 + 바람 + 좌우로 팔랑임 (모두 그 자리의 접평면 기준)
          x = b.pos[j]; y = b.pos[j + 1]; z = b.pos[j + 2];
          const r = Math.hypot(x, y, z), ux = x / r, uy = y / r, uz = z / r;
          const wd = wind.x * ux + wind.y * uy + wind.z * uz;
          const wx = wind.x - wd * ux, wy = wind.y - wd * uy, wz = wind.z - wd * uz;
          const sx = uy * wz - uz * wy, sy = uz * wx - ux * wz, sz = ux * wy - uy * wx;
          const stormy = K.season === 3 ? wNow.storm : 0; // 눈보라: 더 빠르게, 옆으로 세차게
          const fl = K.flutter * (1 + stormy) * Math.sin(time * s.freq[i] + s.phase[i]);
          const drift = K.rain ? 1.2 + 1.6 * wNow.rain : (0.35 + 0.25 * Math.sin(time * 0.3 + s.phase[i])) * (1 + 3.5 * stormy);
          const f = K.rain ? s.fall[i] : s.fall[i] * (1 + 0.3 * Math.sin(time * s.freq[i] * 1.7 + s.phase[i])) * (1 + 1.3 * stormy);
          x += (-ux * f + wx * drift + sx * fl) * dt;
          y += (-uy * f + wy * drift + sy * fl) * dt;
          z += (-uz * f + wz * drift + sz * fl) * dt;
          if (K.rain) b.angle[i] = rainAngle; else b.angle[i] += s.spin[i] * dt;
        }
        b.pos[j] = x; b.pos[j + 1] = y; b.pos[j + 2] = z;
        const r2 = Math.hypot(x, y, z);
        const h = r2 - terrain.radiusAt(tmp.set(x / r2, y / r2, z / r2));
        const dx = x - center.x, dy = y - center.y, dz = z - center.z;
        const d2 = dx * dx + dy * dy + dz * dz;
        if ((!K.hover && h < 0.03) || d2 > R2 * 1.44 || s.age[i] > s.life[i]) { respawn(K, i, false); continue; }
        // 태어날 때 · 땅 가까이 · 범위 끝 · 수명 끝에서 흐려짐
        let a = Math.min(1, s.age[i] / (K.rain ? 0.08 : 0.6)) * Math.min(1, (s.life[i] - s.age[i]) / 0.8);
        if (!K.hover) a *= Math.min(1, h / 0.4);
        a *= 1 - smoothstep(R2 * 0.6, R2 * 1.4, d2);
        if (K.hover) a *= 0.25 + 0.75 * Math.pow(Math.max(0, Math.sin(time * 2.3 + s.phase[i] * 3)), 2);
        b.alpha[i] = a;
      }
      const g = K.points.geometry.attributes;
      g.position.needsUpdate = true;
      g.aAngle.needsUpdate = true;
      g.aAlpha.needsUpdate = true;
    }

    return {
      kinds: KINDS,
      uScale,
      resize() { uScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))); },
      update(dt, time, weights, k, weather) {
        wNow = weather;
        tA.copy(player.camBack).negate();
        focus.copy(player.up).applyAxisAngle(tB.crossVectors(player.up, tA).normalize(), 3 / R);
        wind.copy(player.sunRef).applyAxisAngle(player.up, 1.2 + 0.6 * Math.sin(time * 0.07));
        const center = player.anchor.position;
        if (weather.rain > 0.01) { // 빗줄기를 화면에서 비가 떨어지는 방향으로 기울임
          ra.copy(center).addScaledVector(player.up, 2.5);
          rb.copy(ra).addScaledVector(player.up, -1).addScaledVector(wind, (1.2 + 1.6 * weather.rain) / 12);
          ra.project(camera);
          rb.project(camera);
          rainAngle = Math.atan2((rb.x - ra.x) * window.innerWidth, -(rb.y - ra.y) * window.innerHeight);
        }
        sourceWait -= dt;
        for (const K of KINDS) {
          const w = K.rain ? weather.rain : weights[K.season];
          K.opacity = damp(K.opacity, K.rain ? w * k : w > 0.12 ? w * k : 0, K.rain ? 2.5 : 1.8, dt);
          K.material.uniforms.uOpacity.value = K.opacity;
          K.points.visible = K.opacity > 0.01;
          if (!K.points.visible) { K.primed = false; continue; }
          if (K.source && (sourceWait <= 0 || !K.primed)) refreshSources(K, center);
          if (!K.primed) { for (let i = 0; i < K.count; i++) respawn(K, i, true); K.primed = true; }
          simulate(K, dt, time, center);
        }
        if (sourceWait <= 0) sourceWait = 0.5;
      },
    };
  }

  // 화면 위쪽에 잠깐 떠오르는 알림 (새 구역 · 보석 소식)
  function showBanner(title, line, toneKey) {
    const banner = $('banner');
    if (!banner.dataset.wired) { // 애니메이션이 끝나면 show를 떼서, 떠 있는 동안만 레이스 판이 비켜 줌
      banner.dataset.wired = '1';
      banner.addEventListener('animationend', (e) => { if (e.target === banner) banner.classList.remove('show'); });
    }
    $('banner-title').textContent = title;
    $('banner-sub').textContent = line;
    banner.style.setProperty('--tone', `var(--${toneKey})`);
    banner.classList.remove('show');
    void banner.offsetWidth; // 애니메이션 다시 시작
    banner.classList.add('show');
  }

  // 10-2. 분위기 · 구역 알림
  function createSeasonFx() {
    const weights = new Float64Array(4);
    const smooth = new Float64Array(4);
    const neutral = { sky: new THREE.Vector3().fromArray(CONFIG.atmosphere.color), sun: new THREE.Color(CONFIG.sun.color), sunI: CONFIG.sun.intensity, amb: new THREE.Color(CONFIG.fill.ambientColor) };
    const moods = MOODS.map((m) => ({ sky: new THREE.Vector3().fromArray(m.sky), sun: new THREE.Color(m.sun), sunI: m.sunI, amb: new THREE.Color(m.amb), fog: new THREE.Color(m.fog) }));
    const sky = new THREE.Vector3(), sun = new THREE.Color(), amb = new THREE.Color();

    // ── 날씨: 계절마다 따로 맑음 ↔ 궂은 날씨가 번갈아 오고, 캐릭터가 선 계절 비율만큼 느껴짐 ──
    const W = CONFIG.weather;
    const wrng = makeRng(CONFIG.seed + 1501);
    const EFFECTS = PLANET.effects ? PLANET.effects : [
      { name: '봄비', rain: 0.55, grey: 0.35, dim: 0.22, fog: 0.012, fogColor: new THREE.Color(0xaab4c8) },
      { name: '소나기', rain: 1.0, grey: 0.7, dim: 0.45, fog: 0.02, fogColor: new THREE.Color(0x7f8b9c) },
      { name: '안개', rain: 0, grey: 0.45, dim: 0.18, fog: 0.055, fogColor: new THREE.Color(0xcfc6ba) },
      { name: '눈보라', rain: 0, grey: 0.5, dim: 0.28, fog: 0.045, fogColor: new THREE.Color(0xe8eef6) },
    ];
    const STORM_SKY = new THREE.Vector3(0.46, 0.5, 0.58);
    const weatherState = [0, 1, 2, 3].map(() => ({ on: false, level: 0, force: null }));
    const weather = { rain: 0, storm: 0, thunder: 0 };
    const wx = new Float64Array(4), wcol = new THREE.Color();
    let flashT = 9, wClock = () => Date.now() / 1000, lastT = null; // 방에선 서버 시각 (setClock)
    const WIN = W.cycle;                                  // 창 하나 = 10분, 궂은 날씨 한 번 (8~12분 간격)
    const SHIFT = [0, 150, 300, 450];                     // 계절끼리 2분 30초씩 어긋나게
    const u01 = (a, b) => hash2(a, b) / 4294967296;       // 모든 기기에서 같은 0~1
    function eventOf(s, n) { // 계절 s의 n번째 창: 궂은 날씨 [시작, 끝) (창 안의 초)
      const o = mix(W.start[0], W.start[1], u01(s * 7 + 1, n));
      return { o, e: o + mix(W.event[0], W.event[1], u01(s * 7 + 2, n)) };
    }
    function levelAt(s, n, t) { // 서서히 짙어졌다 걷힘
      const ev = eventOf(s, n);
      return t < ev.o ? 0 : t < ev.e ? Math.min(1, (t - ev.o) * W.ramp) : Math.max(0, 1 - (t - ev.e) * W.ramp);
    }
    function stepWeather(dt, T) {
      weatherState.forEach((st, s) => {
        if (st.force) { // 시험용 (setWeather): 잠깐 이 기기만
          st.force.left -= dt;
          st.on = st.force.on;
          st.level = clamp(st.level + (st.on ? 1 : -1) * W.ramp * dt, 0, 1);
          if (st.force.left <= 0) st.force = null;
          return;
        }
        const x = T + SHIFT[s], n = Math.floor(x / WIN), t = x - n * WIN, ev = eventOf(s, n);
        st.on = t >= ev.o && t < ev.e;
        st.level = Math.max(levelAt(s, n, t), levelAt(s, n - 1, t + WIN)); // 앞 창에서 걷히는 중일 수도
      });
    }
    function strikesBetween(a, b) { // 소나기 번개: 궂은 날씨마다 정해진 순간 (a, b] → [{ at, delay }]
      const out = [];
      for (let n = Math.floor((a + SHIFT[1]) / WIN) - 1; n <= Math.floor((b + SHIFT[1]) / WIN); n++) {
        const ev = eventOf(1, n), base = n * WIN - SHIFT[1];
        for (let t = ev.o + 2.5, k = 0; t < ev.e - 1; t += mix(3, 6, u01(800 + k, n)), k++) { // 짧은 소나기: 두세 번
          const at = base + t;
          if (at > a && at <= b) out.push({ at, delay: mix(0.4, 1.6, u01(900 + k, n)) });
        }
      }
      return out;
    }
    // 구름: 계절 한가운데 하늘을 천천히 돌다가, 궂은 날엔 커지고 어두워지며 낮게 깔림
    function createClouds() {
      const rc = makeRng(CONFIG.seed + 1601);
      const R = CONFIG.planet.radius, PER = 6, PUFFS = 4;
      const mesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), addNearFade(new THREE.MeshStandardMaterial({ flatShading: true, roughness: 1, metalness: 0, emissive: 0x2a3140 })), 4 * PER * PUFFS);
      mesh.frustumCulled = false;
      mesh.name = 'clouds';
      const fair = [0xffffff, 0xffffff, 0xffffff, 0xffffff].map((h) => new THREE.Color(h));
      const foul = [0xc9d0da, 0x9aa4b4, 0xe2ddd6, 0xe8eef6].map((h) => new THREE.Color(h));
      const clusters = [];
      for (let si = 0; si < 4; si++) {
        const center = new THREE.Vector3().fromArray(SEASONS[si].center).normalize();
        for (let c = 0; c < PER; c++) {
          const t = new THREE.Vector3(rc() - 0.5, rc() - 0.5, rc() - 0.5).projectOnPlane(center).normalize();
          const up = center.clone().applyAxisAngle(new THREE.Vector3().crossVectors(center, t).normalize(), 0.12 + 0.45 * rc());
          const puffs = [];
          for (let k = 0; k < PUFFS; k++) puffs.push({ dx: (rc() - 0.5) * 3.2, dy: (rc() - 0.5) * 0.7, dz: (rc() - 0.5) * 3.2, r: 1.3 + rc() * 1.0 });
          clusters.push({ s: si, center, up, alt: R + 11.5 + rc() * 2, speed: (0.01 + rc() * 0.015) * (rc() < 0.5 ? -1 : 1), puffs });
        }
      }
      const Yv = new THREE.Vector3(0, 1, 0), q = new THREE.Quaternion(), m = new THREE.Matrix4(), pos = new THREE.Vector3(), sc = new THREE.Vector3(), off = new THREE.Vector3(), col = new THREE.Color(), cu = new THREE.Vector3();
      return {
        mesh,
        update(time) {
          let i = 0;
          for (const cl of clusters) {
            const lv = smoothstep(0, 1, weatherState[cl.s].level);
            cu.copy(cl.up).applyAxisAngle(cl.center, cl.speed * time);
            q.setFromUnitVectors(Yv, cu);
            const grow = 0.5 + 0.8 * lv;
            col.copy(fair[cl.s]).lerp(foul[cl.s], lv);
            for (const pf of cl.puffs) {
              off.set(pf.dx * grow, pf.dy, pf.dz * grow).applyQuaternion(q);
              pos.copy(cu).multiplyScalar(cl.alt - lv * 1.5).add(off);
              const r = pf.r * grow;
              mesh.setMatrixAt(i, m.compose(pos, q, sc.set(r * 1.3, r * 0.75, r * 1.3)));
              mesh.setColorAt(i, col);
              i++;
            }
          }
          mesh.instanceMatrix.needsUpdate = true;
          mesh.instanceColor.needsUpdate = true;
        },
      };
    }
    const clouds = createClouds();
    scene.add(clouds.mesh);
    // 계절 칩 옆 날씨 이름 (궂은 날씨일 때만)
    const tagEl = $('weather');
    let tagWait = 0, tagShown = -1;
    function weatherTag(dt) {
      tagWait -= dt;
      if (tagWait > 0) return;
      tagWait = 0.25;
      let b = 0;
      for (let i = 1; i < 4; i++) if (smooth[i] > smooth[b]) b = i;
      const show = rig.t > 0.5 && weatherState[b].level > 0.5;
      tagEl.hidden = !show;
      if (show) tagEl.textContent = EFFECTS[b].name;
      if (show && b !== tagShown && on.weather) on.weather(b); // 기록장: 그 날씨를 만났음
      tagShown = show ? b : -1;
    }
    scene.fog = new THREE.FogExp2(moods[0].fog.getHex(), 0);
    const particles = createParticles();
    particles.resize();
    terrain.weightsAt(player.up, smooth, 9);

    let announced = -1, candidate = -1, dwell = 0, wait = 0;
    const on = { region: null, thunder: null, weather: null }; // 새 구역 · 천둥 알림 (소리), 날씨를 만남 (기록장)
    function announce(i) {
      announced = i;
      if (on.region) on.region(i);
      showBanner(`${SEASONS[i].name} 구역`, MOODS[i].line, SEASONS[i].key);
    }

    onUpdate((dt, time) => {
      // 1) 계절 비율: 넓게 섞고 천천히 따라가서 경계를 지날 때 스르륵 바뀜
      terrain.weightsAt(player.up, weights, 9);
      for (let i = 0; i < 4; i++) smooth[i] = damp(smooth[i], weights[i], 2.5, dt);
      const k = rig.t; // 행성 보기에선 원래 색으로
      // 2) 하늘빛 · 햇빛 · 환경광 · 안개
      sky.set(0, 0, 0); sun.setRGB(0, 0, 0); amb.setRGB(0, 0, 0);
      let sunI = 0, fr = 0, fg = 0, fb = 0;
      for (let i = 0; i < 4; i++) {
        const m = moods[i], w = smooth[i];
        sky.addScaledVector(m.sky, w);
        sun.r += m.sun.r * w; sun.g += m.sun.g * w; sun.b += m.sun.b * w;
        amb.r += m.amb.r * w; amb.g += m.amb.g * w; amb.b += m.amb.b * w;
        fr += m.fog.r * w; fg += m.fog.g * w; fb += m.fog.b * w;
        sunI += m.sunI * w;
      }
      // 날씨 (공유 시각)
      const T = wClock();
      stepWeather(dt, T);
      let rain = 0, grey = 0, dim = 0, fogAdd = 0, wsum = 0;
      wcol.setRGB(0, 0, 0);
      for (let i = 0; i < 4; i++) {
        const w = smooth[i] * smoothstep(0, 1, weatherState[i].level), E = EFFECTS[i];
        wx[i] = w;
        rain += E.rain * w; grey += E.grey * w; dim += E.dim * w; fogAdd += E.fog * w; wsum += w;
        wcol.r += E.fogColor.r * w; wcol.g += E.fogColor.g * w; wcol.b += E.fogColor.b * w;
      }
      weather.rain = rain;
      weather.storm = wx[3];
      weather.thunder = wx[1];
      if (lastT !== null && T > lastT && T - lastT < 5) { // 소나기 한가운데: 정해진 순간에 번개, 조금 뒤 천둥 (모두 같은 때)
        for (const st of strikesBetween(lastT, T)) if (weather.thunder > 0.55 && k > 0.9) { flashT = 0; if (on.thunder) on.thunder(st.delay); }
      }
      lastT = T;
      flashT += dt;
      const flash = flashT > 1 ? 0 : Math.exp(-flashT * 9) + (flashT > 0.18 ? 0.6 * Math.exp(-(flashT - 0.18) * 12) : 0);
      atmoTint.copy(neutral.sky).lerp(sky, k).lerp(STORM_SKY, grey * k);
      sunLight.color.copy(neutral.sun).lerp(sun, k);
      sunLight.intensity = mix(neutral.sunI, sunI, k) * (1 - dim * k) + 5 * flash * k;
      ambientLight.color.copy(neutral.amb).lerp(amb, k);
      ambientLight.intensity = CONFIG.fill.ambientIntensity * (1 - 0.35 * dim * k) + 1.6 * flash * k;
      scene.fog.color.setRGB(fr, fg, fb);
      if (wsum > 0.001) scene.fog.color.lerp(wcol.multiplyScalar(1 / wsum), Math.min(1, wsum * 1.4));
      scene.fog.density = (CONFIG.fx.fog + fogAdd) * k * k;
      // 3) 파티클 · 구름 · 날씨 이름
      particles.update(dt, time, smooth, k, weather);
      clouds.update(T); // 구름 자리도 공유 시각으로
      weatherTag(dt);
      // 4) 구역 알림: 새 계절에 0.7초 머물러야 알림 (경계를 스치듯 지날 땐 조용히)
      if (rig.mode !== 'character' || k < 0.9) return;
      wait -= dt;
      if (wait > 0) return;
      wait = 0.1;
      const now = terrain.seasonAt(player.up);
      if (announced === -1) { announce(now); return; }
      if (now === announced) { candidate = -1; dwell = 0; return; }
      if (now !== candidate) { candidate = now; dwell = 0; }
      dwell += 0.1;
      if (dwell >= 0.7) announce(now);
    });
    return {
      particles, on, weights: smooth, weather, weatherNames: EFFECTS.map((e) => e.name),
      get weatherState() { return weatherState; },
      setWeather(season, v) { weatherState[season].force = { on: v, left: 60 }; }, // 시험용: 이 기기만 60초 동안
      setClock(fn) { wClock = fn; lastT = null; }, // 방에 들어가면 서버 시각으로
      strikesBetween,
      weatherEvents(s, a, b) { // 확인용: 계절 s의 궂은 날씨 [시작, 끝] 목록
        const out = [];
        for (let n = Math.floor((a + SHIFT[s]) / WIN) - 1; n <= Math.floor((b + SHIFT[s]) / WIN); n++) {
          const ev = eventOf(s, n), base = n * WIN - SHIFT[s];
          if (base + ev.e > a && base + ev.o < b) out.push({ start: base + ev.o, end: base + ev.e });
        }
        return out;
      },
      get announced() { return announced; },
    };
  }

  // ═══════════════════════════════════════════════
  // 11. GEMS — 계절 보석 모으기
  //    계절마다 8개씩 빛기둥 아래 떠 있는 보석. 가까이 가면 모이고(높이 뜬 건 점프해서),
  //    모은 기록은 이 브라우저에 저장됨
  // ═══════════════════════════════════════════════
  function createGems() {
    const G = CONFIG.gems;
    const R = CONFIG.planet.radius;
    const KEY = 'season-planet-gems-v1';
    const COLORS = [0xff8fbf, 0x5fe08a, 0xffa24c, 0x8fd4ff];
    const rng = makeRng(CONFIG.seed + 901);
    const spawn = new THREE.Vector3().fromArray(CONFIG.character.spawn).normalize();
    const w4 = new Float64Array(4), nrm = new THREE.Vector3(), dir = new THREE.Vector3();

    // ── 자리 잡기: 계절 한가운데 쪽 · 걸어서 닿는 비탈 · 나무와 바위에서 떨어진 곳 ──
    const on = { collect: null }; // 보석을 모은 순간 알림 (소리)
    const list = [];
    for (let s = 0; s < 4; s++) {
      let n = 0;
      for (let k = 0; k < 8000 && n < G.perSeason; k++) {
        const u = rng() * 2 - 1, a = rng() * Math.PI * 2, rr = Math.sqrt(1 - u * u);
        dir.set(rr * Math.cos(a), u, rr * Math.sin(a));
        if (dir.angleTo(spawn) < 0.18) continue;
        if (terrain.seasonAt(dir) !== s || terrain.weightsAt(dir, w4, 9)[s] < 0.85) continue;
        const ground = terrain.radiusAt(dir, nrm);
        if (nrm.dot(dir) < 0.75 || ground - R > 2.6) continue;
        if (list.some((g) => g.up.distanceTo(dir) * R < G.spacing)) continue;
        if (props.debug.colliders.some((c) => c.up.distanceTo(dir) * R < c.r + 1.3)) continue;
        // 셋 중 하나쯤은 높이 떠 있어서 점프해야 닿음 (위아래로 흔들려도 서서는 안 닿는 높이)
        list.push({ season: s, up: dir.clone(), floor: Math.max(ground, terrain.waterRadius), lift: rng() < 0.3 ? 2.55 : 1.15, phase: rng() * Math.PI * 2, taken: false, pop: 0 });
        n++;
      }
    }
    const count = list.length;

    // ── 보석(스스로 빛나는 팔면체) + 빛기둥 ──
    const colors = COLORS.map((h) => new THREE.Color(h));
    const gemMaterial = new THREE.MeshStandardMaterial({ flatShading: true, roughness: 0.25, metalness: 0.1, emissive: 0xffffff, emissiveIntensity: 0.55 });
    gemMaterial.onBeforeCompile = (shader) => { // 인스턴스 색으로 빛나게
      shader.fragmentShader = shader.fragmentShader.replace('vec3 totalEmissiveRadiance = emissive;',
        '#ifdef USE_COLOR\n\tvec3 totalEmissiveRadiance = emissive * vColor;\n#else\n\tvec3 totalEmissiveRadiance = emissive;\n#endif');
    };
    const gemMesh = new THREE.InstancedMesh(new THREE.OctahedronGeometry(0.34, 0).scale(1, 1.45, 1), gemMaterial, Math.max(1, count));
    const beamMesh = new THREE.InstancedMesh(
      new THREE.CylinderGeometry(0.3, 0.07, 14, 10, 1, true).translate(0, 7, 0),
      new THREE.ShaderMaterial({
        uniforms: { uTime: windTime },
        vertexShader: shaderSource('beam-vs'),
        fragmentShader: shaderSource('beam-fs'),
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
      }),
      Math.max(1, count)
    );
    list.forEach((g, i) => { gemMesh.setColorAt(i, colors[g.season]); beamMesh.setColorAt(i, colors[g.season]); });
    gemMesh.count = beamMesh.count = count;
    gemMesh.frustumCulled = beamMesh.frustumCulled = false;
    beamMesh.renderOrder = 3;
    gemMesh.name = 'gems';
    beamMesh.name = 'gem-beams';
    scene.add(gemMesh, beamMesh);

    const Y = new THREE.Vector3(0, 1, 0), qa = new THREE.Quaternion(), qy = new THREE.Quaternion();
    const mm = new THREE.Matrix4(), pp = new THREE.Vector3(), sc = new THREE.Vector3(), body = new THREE.Vector3(), ZERO = new THREE.Vector3();
    function placeBeam(i) {
      const g = list[i];
      qa.setFromUnitVectors(Y, g.up);
      beamMesh.setMatrixAt(i, mm.compose(pp.copy(g.up).multiplyScalar(g.floor), qa, g.taken ? ZERO : sc.set(1, 1, 1)));
      beamMesh.instanceMatrix.needsUpdate = true;
    }
    function placeGem(i, time) {
      const g = list[i];
      const bob = 0.12 * Math.sin(time * 2 + g.phase);
      qa.setFromUnitVectors(Y, g.up).multiply(qy.setFromAxisAngle(Y, time * 1.4 + g.phase));
      const s = !g.taken ? 1 : g.pop > 0 ? 1 + 2.4 * (0.25 - g.pop) : 0; // 모은 순간 부풀었다 사라짐
      gemMesh.setMatrixAt(i, mm.compose(pp.copy(g.up).multiplyScalar(g.floor + g.lift + bob), qa, sc.set(s, s, s)));
    }

    // ── 모을 때 터지는 반짝이 ──
    const MAXP = 120;
    const bp = new Float32Array(MAXP * 3), bc = new Float32Array(MAXP * 3), bs = new Float32Array(MAXP), ba = new Float32Array(MAXP), bal = new Float32Array(MAXP);
    const bv = new Float32Array(MAXP * 3), bage = new Float32Array(MAXP).fill(9), blife = new Float32Array(MAXP).fill(1);
    let bnext = 0, bursting = 0;
    const bgeo = new THREE.BufferGeometry();
    bgeo.setAttribute('position', new THREE.BufferAttribute(bp, 3).setUsage(THREE.DynamicDrawUsage));
    bgeo.setAttribute('aColor', new THREE.BufferAttribute(bc, 3).setUsage(THREE.DynamicDrawUsage));
    bgeo.setAttribute('aSize', new THREE.BufferAttribute(bs, 1).setUsage(THREE.DynamicDrawUsage));
    bgeo.setAttribute('aAngle', new THREE.BufferAttribute(ba, 1));
    bgeo.setAttribute('aAlpha', new THREE.BufferAttribute(bal, 1).setUsage(THREE.DynamicDrawUsage));
    const sparks = new THREE.Points(bgeo, new THREE.ShaderMaterial({
      uniforms: { uScale: fx.particles.uScale, uOpacity: { value: 1 }, uShape: { value: 3 } },
      vertexShader: shaderSource('fx-vs'),
      fragmentShader: shaderSource('fx-fs'),
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    }));
    sparks.frustumCulled = false;
    sparks.visible = false;
    sparks.renderOrder = 4;
    scene.add(sparks);
    const tc = new THREE.Color();
    function burst(center, up, season) {
      for (let k = 0; k < 30; k++) {
        const i = bnext;
        bnext = (bnext + 1) % MAXP;
        const j = i * 3;
        bp[j] = center.x; bp[j + 1] = center.y; bp[j + 2] = center.z;
        let vx = rng() * 2 - 1, vy = rng() * 2 - 1, vz = rng() * 2 - 1;
        const l = Math.hypot(vx, vy, vz) || 1, sp = 2 + rng() * 2.5;
        bv[j] = (vx / l) * sp + up.x * 1.2; bv[j + 1] = (vy / l) * sp + up.y * 1.2; bv[j + 2] = (vz / l) * sp + up.z * 1.2;
        tc.setHex(k % 3 === 0 ? 0xffffff : COLORS[season], THREE.LinearSRGBColorSpace);
        bc[j] = tc.r; bc[j + 1] = tc.g; bc[j + 2] = tc.b;
        bs[i] = 0.18 + rng() * 0.14;
        bage[i] = 0;
        blife[i] = 0.6 + rng() * 0.4;
      }
      bursting = 1.2;
      bgeo.attributes.aColor.needsUpdate = true;
      bgeo.attributes.aSize.needsUpdate = true;
    }
    function updateBurst(dt) {
      if (bursting <= 0) { sparks.visible = false; return; }
      sparks.visible = true;
      bursting -= dt;
      const drag = Math.exp(-3 * dt);
      for (let i = 0; i < MAXP; i++) {
        if (bage[i] >= blife[i]) { bal[i] = 0; continue; }
        bage[i] += dt;
        const j = i * 3;
        bp[j] += bv[j] * dt; bp[j + 1] += bv[j + 1] * dt; bp[j + 2] += bv[j + 2] * dt;
        bv[j] *= drag; bv[j + 1] *= drag; bv[j + 2] *= drag;
        bal[i] = Math.max(0, 1 - bage[i] / blife[i]);
      }
      bgeo.attributes.position.needsUpdate = true;
      bgeo.attributes.aAlpha.needsUpdate = true;
    }

    // ── 기록 저장 (이 브라우저에만) ──
    let hinted = false, hintTimer = 0;
    function save() {
      try {
        localStorage.setItem(KEY, JSON.stringify({ seed: CONFIG.seed, count, taken: list.flatMap((g, i) => (g.taken ? [i] : [])), hinted }));
      } catch (e) { /* 저장이 막혀 있어도 게임은 그대로 */ }
    }
    try {
      const d = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (d && d.seed === CONFIG.seed && d.count === count && Array.isArray(d.taken)) {
        for (const i of d.taken) if (list[i]) list[i].taken = true;
        hinted = !!d.hinted;
      }
    } catch (e) { /* 저장된 기록이 없거나 읽을 수 없음 → 처음부터 */ }

    // ── HUD: 모은 개수 + 계절별 막대 ──
    const chip = $('gems'), countEl = $('gem-count'), totalEl = $('gem-total'), again = $('gems-again');
    const bars = Array.from(chip.querySelectorAll('.gem-bars i'));
    function tally() {
      const per = [0, 0, 0, 0], tot = [0, 0, 0, 0];
      for (const g of list) { tot[g.season]++; if (g.taken) per[g.season]++; }
      return { per, tot, got: per[0] + per[1] + per[2] + per[3] };
    }
    function refresh(pulse) {
      const t = tally();
      countEl.textContent = t.got;
      totalEl.textContent = count;
      bars.forEach((b, s) => b.style.setProperty('--p', t.tot[s] ? t.per[s] / t.tot[s] : 0));
      const done = count > 0 && t.got === count;
      chip.classList.toggle('done', done);
      again.hidden = !done;
      chip.setAttribute('aria-label', `기록장 열기. 모은 보석 ${t.got}개, 전체 ${count}개`);
      if (pulse) { chip.classList.remove('pulse'); void chip.offsetWidth; chip.classList.add('pulse'); }
      return t;
    }
    function collect(i) {
      const g = list[i];
      g.taken = true;
      g.pop = 0.25;
      burst(pp.copy(g.up).multiplyScalar(g.floor + g.lift), g.up, g.season);
      placeBeam(i);
      const t = refresh(true);
      save();
      if (on.collect) on.collect(g.season, t.got === count ? 'all' : t.per[g.season] === t.tot[g.season] ? 'season' : 'gem');
      if (t.got === count) showBanner('사계절 보석 완성!', '네 계절의 보석을 모두 모았어요', 'autumn');
      else if (t.per[g.season] === t.tot[g.season]) showBanner(`${SEASONS[g.season].name} 보석을 다 모았어요`, `남은 보석 ${count - t.got}개`, SEASONS[g.season].key);
    }
    function reset() {
      for (let i = 0; i < count; i++) { list[i].taken = false; list[i].pop = 0; placeBeam(i); }
      refresh(false);
      save();
      showBanner('다시 모아 볼까요', `빛기둥 아래 보석 ${count}개`, SEASONS[terrain.seasonAt(player.up)].key);
    }
    again.addEventListener('click', reset);
    for (let i = 0; i < count; i++) placeBeam(i);
    refresh(false);

    function update(dt, time) {
      const live = rig.mode === 'character' && rig.t > 0.95;
      body.copy(player.anchor.position).addScaledVector(player.up, 1.1 + player.height); // 몸 가운데
      const reach2 = G.reach * G.reach;
      for (let i = 0; i < count; i++) {
        const g = list[i];
        if (g.taken) { if (g.pop > 0) g.pop = Math.max(0, g.pop - dt); }
        else if (live) {
          pp.copy(g.up).multiplyScalar(g.floor + g.lift + 0.12 * Math.sin(time * 2 + g.phase));
          if (pp.distanceToSquared(body) < reach2) collect(i);
        }
        placeGem(i, time);
      }
      gemMesh.instanceMatrix.needsUpdate = true;
      updateBurst(dt);
      if (!hinted && live) { // 처음 온 사람에게 한 번만 안내
        hintTimer += dt;
        if (hintTimer > 3.4) {
          hinted = true;
          save();
          showBanner('빛기둥을 따라가 보세요', `계절마다 보석 ${G.perSeason}개가 숨어 있어요`, SEASONS[terrain.seasonAt(player.up)].key);
        }
      }
    }
    return {
      list, on, update, collect, reset,
      sparkle(center, up, season) { burst(center, up, season); },
      get collected() { return tally().got; },
      perSeason() { const t = tally(); return { per: t.per, tot: t.tot }; },
      nearestOpen(season, from) { // 그 계절에서 아직 안 모은 보석 중 from에 가장 가까운 것
        let best = null, bd = Infinity;
        for (const g of list) {
          if (g.taken || g.season !== season) continue;
          const d = g.up.angleTo(from);
          if (d < bd) { bd = d; best = g; }
        }
        return best;
      },
    };
  }

  // ═══════════════════════════════════════════════
  // 12. AUDIO — 발소리 · 점프 · 보석 · 계절 배경음 · 잔잔한 음악
  //    음원 파일 없이 WebAudio로 그 자리에서 합성. 브라우저 규칙상 첫 터치(또는 키 입력) 뒤부터 소리가 남
  // ═══════════════════════════════════════════════
  function createAudio() {
    const KEY = 'season-planet-sound-v1';
    const rng = makeRng(CONFIG.seed + 1301);
    const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);
    // 음악: 계절마다 음계 · 빠르기 · 음 밀도 · 화음 뿌리 (마지막 줄은 행성 보기 = 우주)
    const SCALES = [
      [72, 74, 76, 79, 81, 84, 86, 88], // 봄: 다장조 5음
      [67, 69, 71, 74, 76, 79, 81, 83], // 여름: 사장조 5음
      [69, 72, 74, 76, 79, 81, 84, 86], // 가을: 가단조 5음
      [62, 64, 65, 69, 72, 74, 76, 77], // 겨울: 라단조 느낌
      [64, 67, 69, 71, 74, 76, 79, 81], // 우주
    ];
    const TEMPO = [84, 92, 72, 64, 56];
    const DENSITY = [0.55, 0.6, 0.45, 0.38, 0.28];
    const ROOTS = [[48, 45, 41, 43], [43, 40, 36, 38], [45, 41, 36, 43], [38, 34, 41, 36], [40, 36]];

    let enabled = true;
    try { enabled = localStorage.getItem(KEY) !== 'off'; } catch (e) { /* 저장된 설정 없음 → 켜짐 */ }
    let ctx = null, master, analyser, sfxBus, musicBus, ambBus, verbSend, noise, amb, duckLevel = 1;
    const button = $('sound');
    const syncButton = () => button.setAttribute('aria-pressed', String(enabled));
    syncButton();
    const ready = () => !!ctx && ctx.state === 'running' && enabled;

    // ── 소리 길 만들기: 효과음 · 음악 · 배경음 → 잔향 → 압축(찢어지지 않게) → 스피커 ──
    function build() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      try { ctx = new AC(); } catch (e) { ctx = null; return false; }
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.25;
      analyser = ctx.createAnalyser();
      analyser.fftSize = 2048;
      master = ctx.createGain();
      master.gain.value = enabled ? 0.9 : 0;
      master.connect(comp);
      comp.connect(analyser);
      analyser.connect(ctx.destination);
      sfxBus = ctx.createGain(); sfxBus.connect(master);
      musicBus = ctx.createGain(); musicBus.gain.value = 0.75; musicBus.connect(master);
      ambBus = ctx.createGain(); ambBus.connect(master);
      const verb = ctx.createConvolver();
      verb.buffer = impulse(2.4, 3.2);
      const verbOut = ctx.createGain();
      verbOut.gain.value = 0.55;
      verb.connect(verbOut); verbOut.connect(master);
      verbSend = ctx.createGain(); verbSend.connect(verb);
      noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); // 흰 소음 2초: 발소리 · 바람의 재료
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      startAmbience();
      return true;
    }
    function impulse(seconds, decay) { // 잔향: 점점 잦아드는 소음
      const len = Math.floor(ctx.sampleRate * seconds);
      const buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const ch = buf.getChannelData(c);
        for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
      return buf;
    }

    // ── 재료 ──
    function env(g, t, a, d, peak) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    }
    function withSend(g, send) {
      if (!send) return;
      const s = ctx.createGain();
      s.gain.value = send;
      g.connect(s); s.connect(verbSend);
    }
    // 걸러진 소음 한 번 (발소리 · 착지 · 물소리)
    function noiseHit(t, { type = 'lowpass', freq = 800, q = 0.7, a = 0.004, d = 0.1, peak = 0.3, sweepTo = 0, pan = 0, dest = sfxBus }) {
      const src = ctx.createBufferSource();
      src.buffer = noise;
      src.loop = true;
      const f = ctx.createBiquadFilter();
      f.type = type;
      f.frequency.setValueAtTime(freq, t);
      f.Q.value = q;
      if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + a + d);
      const g = ctx.createGain();
      env(g, t, a, d, peak);
      src.connect(f); f.connect(g);
      if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); p.connect(dest); } else g.connect(dest);
      src.start(t, Math.random() * 1.5);
      src.stop(t + a + d + 0.05);
    }
    function tone(t, { freq, type = 'sine', a = 0.005, d = 0.3, peak = 0.1, sweepTo = 0, pan = 0, dest = sfxBus, send = 0 }) {
      const o = ctx.createOscillator();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, t + a + d * 0.6);
      const g = ctx.createGain();
      env(g, t, a, d, peak);
      o.connect(g);
      if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); p.connect(dest); } else g.connect(dest);
      withSend(g, send);
      o.start(t);
      o.stop(t + a + d + 0.05);
    }
    // 오르골 · 종소리 (FM 합성: ratio가 정수면 따뜻하고, 3.5쯤이면 겨울 종처럼 금속성)
    function bell(t, freq, peak, { ratio = 1, index = 0.9, d = 0.9, dest = musicBus, send = 0.35, pan = 0 } = {}) {
      const car = ctx.createOscillator(), mod = ctx.createOscillator(), mg = ctx.createGain(), g = ctx.createGain();
      car.frequency.value = freq;
      mod.frequency.value = freq * ratio;
      mg.gain.setValueAtTime(freq * index, t);
      mg.gain.exponentialRampToValueAtTime(freq * 0.02, t + d);
      mod.connect(mg); mg.connect(car.frequency);
      env(g, t, 0.004, d, peak);
      car.connect(g);
      if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); p.connect(dest); } else g.connect(dest);
      withSend(g, send);
      car.start(t); mod.start(t);
      car.stop(t + d + 0.1); mod.stop(t + d + 0.1);
    }

    // ── 발 딛는 곳: 얕은 물 · 눈 · 낙엽 · 풀 ──
    const SURFACE = ['grass', 'grass', 'leaves', 'snow'];
    function surface() {
      if (terrain.radiusAt(player.up) < terrain.waterRadius - 0.1) return 'water';
      const w = fx.weights;
      let b = 0;
      for (let i = 1; i < 4; i++) if (w[i] > w[b]) b = i;
      return SURFACE[b];
    }

    // ── 계속 흐르는 배경음: 산들바람 · 겨울바람 · 여름 매미 · 우주 ──
    function startAmbience() {
      const loop = () => { const s = ctx.createBufferSource(); s.buffer = noise; s.loop = true; s.start(0, Math.random() * 1.5); return s; };
      const lfo = (freq, depth, param) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = freq; g.gain.value = depth; o.connect(g); g.connect(param); o.start(); };
      const breeze = ctx.createGain(), breezeF = ctx.createBiquadFilter();
      breezeF.type = 'lowpass'; breezeF.frequency.value = 520;
      lfo(0.07, 160, breezeF.frequency);
      loop().connect(breezeF); breezeF.connect(breeze); breeze.gain.value = 0; breeze.connect(ambBus);
      const howl = ctx.createGain(), howlF = ctx.createBiquadFilter();
      howlF.type = 'bandpass'; howlF.frequency.value = 430; howlF.Q.value = 5;
      lfo(0.09, 190, howlF.frequency);
      loop().connect(howlF); howlF.connect(howl); howl.gain.value = 0; howl.connect(ambBus);
      const bug = ctx.createGain(), bugF = ctx.createBiquadFilter(), bugAM = ctx.createGain(), bugSwell = ctx.createGain();
      bugF.type = 'bandpass'; bugF.frequency.value = 5200; bugF.Q.value = 2.5;
      bugAM.gain.value = 0.5; lfo(38, 0.5, bugAM.gain);         // 빠른 떨림
      bugSwell.gain.value = 0.6; lfo(0.11, 0.4, bugSwell.gain); // 천천히 커졌다 작아졌다
      loop().connect(bugF); bugF.connect(bugAM); bugAM.connect(bugSwell); bugSwell.connect(bug); bug.gain.value = 0; bug.connect(ambBus);
      const drone = ctx.createGain(), droneF = ctx.createBiquadFilter();
      droneF.type = 'lowpass'; droneF.frequency.value = 900;
      for (const f of [110, 110.8, 164.8]) { const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f; o.connect(droneF); o.start(); }
      droneF.connect(drone); drone.gain.value = 0; drone.connect(ambBus);
      const rain = ctx.createGain(), rainF = ctx.createBiquadFilter(); // 빗소리: 높은 대역 소음
      rainF.type = 'bandpass'; rainF.frequency.value = 3400; rainF.Q.value = 0.5;
      loop().connect(rainF); rainF.connect(rain); rain.gain.value = 0; rain.connect(ambBus);
      amb = { breeze, howl, bug, drone, rain };
    }
    function mixAmbience(k) {
      const w = fx.weights, now = ctx.currentTime;
      const set = (g, v) => g.gain.setTargetAtTime(v, now, 0.6);
      set(amb.breeze, k * (0.05 * (w[0] + w[1]) + 0.035 * w[2] + 0.02 * w[3]));
      set(amb.howl, k * (0.06 * w[3] + 0.018 * w[2] + 0.07 * fx.weather.storm));
      set(amb.rain, k * 0.11 * fx.weather.rain);
      set(amb.bug, k * 0.02 * w[1]);
      set(amb.drone, (1 - k) * 0.035);
    }
    function chirp() { // 새소리: 짧게 휘어 오르는 음 두세 번
      const t = ctx.currentTime + 0.02, base = 2600 + rng() * 1400, pan = (rng() - 0.5) * 1.2, n = 2 + Math.floor(rng() * 3);
      for (let i = 0; i < n; i++) tone(t + i * (0.07 + rng() * 0.04), { freq: base, sweepTo: base * (rng() < 0.5 ? 1.35 : 0.75), a: 0.006, d: 0.05, peak: 0.02 + rng() * 0.015, pan });
    }
    function tinkle() { // 겨울 얼음 반짝임
      bell(ctx.currentTime + 0.02, midi(SCALES[3][Math.floor(rng() * 8)] + 24), 0.012, { ratio: 3.5, index: 1.4, d: 1.4, dest: ambBus, send: 0.6, pan: (rng() - 0.5) * 1.4 });
    }

    // ── 음악: 박자마다 음계 안에서 한두 칸씩 걸어 다니는 멜로디 + 두 마디마다 부드러운 화음 ──
    const music = { next: 0, beat: 0, deg: 3 };
    function mode() {
      if (rig.t < 0.5) return 4;
      const w = fx.weights;
      let b = 0;
      for (let i = 1; i < 4; i++) if (w[i] > w[b]) b = i;
      return b;
    }
    function pad(t, root, len, m) {
      const g = ctx.createGain(), f = ctx.createBiquadFilter();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.028, t + len * 0.3);
      g.gain.linearRampToValueAtTime(0.0001, t + len);
      f.type = 'lowpass';
      f.frequency.value = m === 3 ? 700 : 1100;
      g.connect(f); f.connect(musicBus);
      withSend(f, 0.4);
      for (const n of [root, root + 7, root + 12]) {
        const o = ctx.createOscillator();
        o.type = 'triangle';
        o.frequency.value = midi(n);
        o.detune.value = (rng() - 0.5) * 8;
        o.connect(g);
        o.start(t);
        o.stop(t + len + 0.05);
      }
    }
    function scheduleMusic() {
      const now = ctx.currentTime;
      if (music.next < now + 0.02) music.next = now + 0.06; // 밀렸으면 지금부터
      while (music.next < now + 0.3) {
        const m = mode(), spb = 60 / TEMPO[m], sc = SCALES[m];
        if (music.beat % 8 === 0) pad(music.next, ROOTS[m][(music.beat / 8) % ROOTS[m].length], spb * 8, m);
        if (rng() < DENSITY[m]) {
          music.deg = clamp(music.deg + Math.round((rng() - 0.5) * 4), 0, sc.length - 1);
          const icy = m >= 3;
          bell(music.next, midi(sc[music.deg]), icy ? 0.05 : 0.06, icy ? { ratio: 3.5, index: 1.6, d: 1.6 } : { ratio: 1, index: 0.9, d: 0.9 });
          if (rng() < 0.18) bell(music.next + spb / 2, midi(sc[clamp(music.deg + 1, 0, sc.length - 1)]), 0.04, { ratio: 1, index: 0.8, d: 0.7 });
        }
        music.next += spb;
        music.beat++;
      }
    }

    // ── 켜기 · 끄기 ──
    function unlock() {
      if (!ctx && !build()) return;
      if (enabled && ctx.state !== 'running') ctx.resume();
      else if (!enabled && ctx.state === 'running') ctx.suspend(); // 꺼 둔 상태면 배터리 아끼기
    }
    for (const type of ['pointerdown', 'touchend', 'keydown', 'click']) window.addEventListener(type, unlock, { capture: true, passive: true });
    function setEnabled(on) {
      enabled = on;
      syncButton();
      try { localStorage.setItem(KEY, on ? 'on' : 'off'); } catch (e) { /* 저장 못 해도 지금은 적용 */ }
      if (!ctx) { if (on) unlock(); return; }
      const now = ctx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setTargetAtTime(on ? 0.9 : 0, now, 0.05);
      if (on) ctx.resume();
      else setTimeout(() => { if (!enabled && ctx.state === 'running') ctx.suspend(); }, 350);
    }
    button.addEventListener('click', () => setEnabled(!enabled));
    document.addEventListener('visibilitychange', () => { // 다른 앱 · 탭으로 가면 멈춤
      if (!ctx) return;
      if (document.hidden) ctx.suspend();
      else if (enabled) ctx.resume();
    });

    const probe = new Float32Array(2048);
    let mixWait = 0;
    return {
      setEnabled,
      get ctx() { return ready() ? ctx : null; }, // 기타 · 노래 합성용
      get buses() { return ctx ? { sfx: sfxBus, music: musicBus, verb: verbSend } : null; },
      duck(v) { // 모닥불 연주가 들리면 배경 음악을 작게
        if (!ctx || !musicBus || Math.abs(v - duckLevel) < 0.02) return;
        duckLevel = v;
        musicBus.gain.setTargetAtTime(0.75 * v, ctx.currentTime, 0.5);
      },
      fx(kind, vol = 0.5) { // 낚시 · 농사 · 짓기 · 모닥불 · 먹기 소리
        if (!ready()) return;
        const t = ctx.currentTime + 0.01, v = vol, rnd = Math.random;
        if (kind === 'splash') { noiseHit(t, { type: 'bandpass', freq: 1300, sweepTo: 380, q: 0.8, a: 0.005, d: 0.35, peak: 0.3 * v }); noiseHit(t + 0.04, { type: 'lowpass', freq: 650, a: 0.01, d: 0.28, peak: 0.2 * v }); }
        else if (kind === 'cast') noiseHit(t, { type: 'bandpass', freq: 2600, sweepTo: 800, q: 1.2, a: 0.03, d: 0.3, peak: 0.14 * v });
        else if (kind === 'bite') { tone(t, { freq: 560, sweepTo: 240, d: 0.14, peak: 0.14 * v }); noiseHit(t, { type: 'bandpass', freq: 900, q: 1, a: 0.003, d: 0.16, peak: 0.24 * v }); }
        else if (kind === 'reel') { for (let i = 0; i < 7; i++) noiseHit(t + i * 0.045, { type: 'bandpass', freq: 3300, q: 3, a: 0.001, d: 0.02, peak: 0.16 * v }); }
        else if (kind === 'catch') { noiseHit(t, { type: 'bandpass', freq: 1100, sweepTo: 300, q: 0.7, a: 0.005, d: 0.4, peak: 0.3 * v }); [660, 880, 1320].forEach((f, i) => tone(t + 0.1 + i * 0.09, { freq: f, type: 'triangle', d: 0.28, peak: 0.08 * v, send: 0.3 })); }
        else if (kind === 'plant') { noiseHit(t, { type: 'lowpass', freq: 420, a: 0.004, d: 0.14, peak: 0.35 * v }); tone(t, { freq: 190, sweepTo: 120, d: 0.1, peak: 0.08 * v }); }
        else if (kind === 'water') { for (let i = 0; i < 12; i++) noiseHit(t + i * 0.035 + rnd() * 0.02, { type: 'bandpass', freq: 2400 + rnd() * 2600, q: 2, a: 0.002, d: 0.05, peak: 0.1 * v }); }
        else if (kind === 'pop') { tone(t, { freq: 420, sweepTo: 950, d: 0.1, peak: 0.14 * v }); tone(t + 0.08, { freq: 1050, type: 'triangle', d: 0.22, peak: 0.07 * v, send: 0.3 }); }
        else if (kind === 'build') { [0, 0.2, 0.4].forEach((dt) => { noiseHit(t + dt, { type: 'bandpass', freq: 750, q: 1.5, a: 0.002, d: 0.08, peak: 0.4 * v }); tone(t + dt, { freq: 190, sweepTo: 120, d: 0.09, peak: 0.12 * v }); }); }
        else if (kind === 'crackle') noiseHit(t, { type: 'bandpass', freq: 1800 + rnd() * 2600, q: 1.5, a: 0.001, d: 0.02 + rnd() * 0.04, peak: (0.06 + rnd() * 0.14) * v });
        else if (kind === 'sizzle') noiseHit(t, { type: 'bandpass', freq: 5200, q: 0.6, a: 0.05, d: 0.9, peak: 0.12 * v });
        else if (kind === 'chomp') noiseHit(t, { type: 'bandpass', freq: 1300 + rnd() * 700, q: 1.2, a: 0.004, d: 0.06, peak: 0.3 * v });
        else if (kind === 'flutter') { for (let i = 0; i < 9; i++) noiseHit(t + i * 0.04, { type: 'bandpass', freq: 1500, q: 0.8, a: 0.005, d: 0.03, peak: 0.12 * v }); }
        else if (kind === 'chop') { noiseHit(t, { type: 'bandpass', freq: 620, q: 2.2, a: 0.001, d: 0.07, peak: 0.45 * v }); tone(t, { freq: 210, sweepTo: 120, d: 0.08, peak: 0.16 * v }); }
        else if (kind === 'rock') { tone(t, { freq: 1900, type: 'triangle', d: 0.09, peak: 0.08 * v }); noiseHit(t, { type: 'highpass', freq: 2600, a: 0.001, d: 0.05, peak: 0.25 * v }); tone(t, { freq: 150, sweepTo: 90, d: 0.07, peak: 0.12 * v }); }
        else if (kind === 'pick') { noiseHit(t, { type: 'lowpass', freq: 1200, a: 0.004, d: 0.09, peak: 0.28 * v }); tone(t + 0.03, { freq: 700, sweepTo: 1150, d: 0.08, peak: 0.08 * v }); }
        else if (kind === 'honk') { [0, 0.24].forEach((dt) => tone(t + dt, { freq: 330 - dt * 60, sweepTo: 280, type: 'sawtooth', d: 0.17, peak: 0.035 * v })); }
        else if (kind === 'warp') { tone(t, { freq: 220, sweepTo: 1320, type: 'triangle', d: 1.0, peak: 0.07 * v }); noiseHit(t, { type: 'bandpass', freq: 2400, q: 0.7, a: 0.4, d: 0.6, peak: 0.12 * v }); }
        else if (kind === 'door') { tone(t, { freq: 240, sweepTo: 170, type: 'sawtooth', d: 0.3, peak: 0.025 * v }); noiseHit(t + 0.28, { type: 'lowpass', freq: 300, a: 0.003, d: 0.12, peak: 0.4 * v }); }
      },
      get enabled() { return enabled; },
      step(speed) {
        if (!ready()) return;
        const t = ctx.currentTime + 0.01, v = 0.35 + 0.65 * Math.min(1, speed), s = surface(), j = 0.85 + rng() * 0.3;
        if (s === 'water') {
          noiseHit(t, { type: 'bandpass', freq: 1400 * j, sweepTo: 420, q: 0.9, a: 0.01, d: 0.22, peak: 0.22 * v });
          tone(t + 0.02, { freq: 420 * j, sweepTo: 180, d: 0.08, peak: 0.03 * v });
        } else if (s === 'snow') {
          for (let k = 0; k < 4; k++) noiseHit(t + k * (0.012 + rng() * 0.014), { type: 'bandpass', freq: 2600 * j, q: 1.3, a: 0.002, d: 0.03, peak: 0.14 * v });
          noiseHit(t, { type: 'lowpass', freq: 500, a: 0.004, d: 0.08, peak: 0.1 * v });
        } else if (s === 'leaves') {
          for (let k = 0; k < 3; k++) noiseHit(t + k * (0.01 + rng() * 0.02), { type: 'highpass', freq: 2200 * j, q: 0.8, a: 0.002, d: 0.045, peak: 0.09 * v });
          noiseHit(t, { type: 'lowpass', freq: 650 * j, a: 0.004, d: 0.09, peak: 0.16 * v });
        } else {
          noiseHit(t, { type: 'lowpass', freq: 750 * j, a: 0.004, d: 0.1, peak: 0.2 * v });
          noiseHit(t, { type: 'bandpass', freq: 2400 * j, q: 0.6, a: 0.003, d: 0.05, peak: 0.035 * v });
        }
      },
      jump() {
        if (!ready()) return;
        const t = ctx.currentTime + 0.005;
        tone(t, { freq: 250, sweepTo: 560, type: 'triangle', a: 0.01, d: 0.16, peak: 0.07 });
        noiseHit(t, { type: 'bandpass', freq: 900, sweepTo: 2400, q: 0.7, a: 0.02, d: 0.14, peak: 0.06 });
      },
      land(k) {
        if (!ready()) return;
        const t = ctx.currentTime + 0.005, s = surface();
        noiseHit(t, { type: 'lowpass', freq: 380, a: 0.003, d: 0.14, peak: 0.22 * k });
        tone(t, { freq: 90, sweepTo: 50, a: 0.004, d: 0.16, peak: 0.12 * k });
        if (s === 'water') noiseHit(t, { type: 'bandpass', freq: 1600, sweepTo: 380, q: 0.8, a: 0.01, d: 0.35, peak: 0.25 * k });
        if (s === 'snow') for (let i = 0; i < 5; i++) noiseHit(t + i * 0.013, { type: 'bandpass', freq: 2400, q: 1.2, a: 0.002, d: 0.035, peak: 0.12 * k });
      },
      // 보석: 계절 음계로 오르는 종소리 (계절을 다 모으면 길게, 전부 모으면 네 계절을 한 바퀴)
      gem(season, kind) {
        if (!ready()) return;
        const t = ctx.currentTime + 0.01, sc = SCALES[season];
        const seq = kind === 'all' ? [SCALES[0][0], SCALES[1][2], SCALES[2][4], SCALES[3][5], SCALES[0][5] + 12, SCALES[0][7] + 12]
          : kind === 'season' ? [sc[0], sc[2], sc[4], sc[5], sc[7]] : [sc[3], sc[5], sc[7]];
        const gap = kind === 'gem' ? 0.07 : 0.11;
        seq.forEach((n, i) => bell(t + i * gap, midi(n + 12), 0.08, { ratio: 3.01, index: 1.3, d: 0.9, dest: sfxBus, send: 0.5 }));
        tone(t, { freq: 2637, a: 0.01, d: 0.45, peak: 0.018, send: 0.4 });
        if (kind !== 'gem') for (const n of [sc[0], sc[2], sc[4]]) bell(t + seq.length * gap, midi(n), 0.05, { ratio: 1, index: 0.6, d: 2.2, dest: sfxBus, send: 0.6 });
      },
      shutter() { // 찰칵
        if (!ready()) return;
        const t = ctx.currentTime + 0.005;
        noiseHit(t, { type: 'highpass', freq: 2500, a: 0.002, d: 0.05, peak: 0.12 });
        noiseHit(t + 0.07, { type: 'bandpass', freq: 1800, q: 1, a: 0.002, d: 0.06, peak: 0.08 });
      },
      tick() { // 카운트다운 삑
        if (!ready()) return;
        tone(ctx.currentTime + 0.005, { freq: 880, type: 'triangle', a: 0.004, d: 0.09, peak: 0.05 });
      },
      thunder(delay) { // 번쩍 → 잠시 뒤 우르르릉
        if (!ready()) return;
        const t = ctx.currentTime + delay;
        noiseHit(t, { type: 'bandpass', freq: 900, q: 0.8, a: 0.004, d: 0.18, peak: 0.12 });
        noiseHit(t + 0.05, { type: 'lowpass', freq: 320, sweepTo: 90, a: 0.08, d: 2.6, peak: 0.35 });
        tone(t + 0.05, { freq: 55, sweepTo: 38, a: 0.1, d: 2.2, peak: 0.12 });
      },
      emote(kind, gain = 1) { // 반응 소리 (친구 것은 거리만큼 작게)
        if (!ready() || gain <= 0.02) return;
        const t = ctx.currentTime + 0.01, g = gain;
        if (kind === 'wave') {
          tone(t, { freq: 660, type: 'triangle', a: 0.005, d: 0.08, peak: 0.06 * g });
          tone(t + 0.09, { freq: 990, type: 'triangle', a: 0.005, d: 0.12, peak: 0.055 * g });
        } else if (kind === 'cheer') {
          [523, 659, 784, 1047].forEach((f, i) => bell(t + i * 0.07, f, 0.07 * g, { d: 0.5, dest: sfxBus }));
        } else if (kind === 'heart') {
          bell(t, 1319, 0.06 * g, { d: 0.8, dest: sfxBus });
          bell(t + 0.16, 1047, 0.06 * g, { d: 1.0, dest: sfxBus });
        } else if (kind === 'dance') {
          [523, 659, 784, 659, 880, 784].forEach((f, i) => tone(t + i * 0.16, { freq: f, type: 'triangle', a: 0.006, d: 0.12, peak: 0.05 * g }));
        }
      },
      talk(season) { // 대화 한 줄마다 짧은 목소리 삐약
        if (!ready()) return;
        const t = ctx.currentTime + 0.01, base = [620, 540, 470, 700][season];
        tone(t, { freq: base, type: 'triangle', a: 0.005, d: 0.06, peak: 0.05 });
        tone(t + 0.07, { freq: base * 1.25, type: 'triangle', a: 0.005, d: 0.07, peak: 0.045 });
      },
      region(season) { // 새 계절에 들어서면 은은한 두 음
        if (!ready()) return;
        const t = ctx.currentTime + 0.05, sc = SCALES[season];
        bell(t, midi(sc[0]), 0.05, { ratio: 2, index: 0.8, d: 1.6, dest: sfxBus, send: 0.6 });
        bell(t + 0.18, midi(sc[4]), 0.045, { ratio: 2, index: 0.8, d: 1.6, dest: sfxBus, send: 0.6 });
      },
      update(dt) {
        if (!ready()) return;
        const k = rig.t, w = fx.weights;
        mixWait -= dt;
        if (mixWait <= 0) { mixWait = 0.2; mixAmbience(k); }
        if (rng() < (dt * 0.7 * k * w[0] + dt * 0.25 * k * w[1]) * (1 - Math.min(1, fx.weather.rain))) chirp(); // 비 오면 새가 조용
        if (rng() < dt * 0.35 * k * w[3]) tinkle();
        scheduleMusic();
      },
      debug() {
        if (!analyser) return { state: ctx ? ctx.state : 'idle', rms: 0, peak: 0 };
        analyser.getFloatTimeDomainData(probe);
        let s = 0, p = 0;
        for (let i = 0; i < probe.length; i++) { s += probe[i] * probe[i]; p = Math.max(p, Math.abs(probe[i])); }
        return { state: ctx.state, rms: Math.sqrt(s / probe.length), peak: p, surface: surface() };
      },
    };
  }

  // ═══════════════════════════════════════════════
  // 13. FRIENDS — 계절마다 주민 한 명. 그 계절 보석 8개를 다 모아 가면 선물을 줌
  //    다가가면 손을 흔들고, 이야기하는 동안에는 가장 가까운 남은 보석 쪽을 가리킴
  // ═══════════════════════════════════════════════
  const FRIENDS = PLANET.friends ? PLANET.friends : [
    { season: 0, name: '보미', title: '벚꽃 정원사', gift: '벚꽃 화관',
      look: { skin: 0xf5cfae, shirt: 0xfff1dc, pants: 0x7d8f5c, shoes: 0x8a5a3a, hair: 0x6b3e26, hat: 'straw', prop: 'can', front: 'apron' },
      lines: {
        first: ['안녕! 나는 벚꽃 정원사 보미야.', '이 봄 언덕 어딘가에 봄 보석 8개가 숨어 있어.', '전부 찾아 오면 내가 아끼는 선물을 줄게!'],

  const ALL_GIFTS_LINE = '네 계절 선물을 다 모았구나! 너 정말 멋진 탐험가야.';

  // 주민 모양: 부위별로 상자를 합쳐 둠 (몸 · 머리 · 팔 둘 → 한 명당 그리기 4번)
  function buildVillager(look, material) {
    const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
    const C = (rt, rb, h, n = 12) => new THREE.CylinderGeometry(rt, rb, h, n);
    const HATS = { // 머리 기준 좌표 (머리는 0 ~ 0.5)
