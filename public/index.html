      pendingBuild = null;
      const cost = WORLD_KINDS[e.it.k].cost;
      for (const [k, n] of Object.entries(cost)) takeItem(k, Math.min(n, bag[k] || 0));
      quests.track('build:' + e.it.k);
      toast(`${obj(WORLD_KINDS[e.it.k].name, ['을', '를'])} 지었어요 (${costText(cost)} 씀)`);
    };
    world.on.removed = (e) => { // 내 것을 치우면 재료 반을 돌려받음
      if (e.it.own !== myPid()) return;
      const back = {};
      for (const [k, n] of Object.entries(WORLD_KINDS[e.it.k].cost)) if (Math.floor(n / 2)) back[k] = Math.floor(n / 2);
      for (const [k, n] of Object.entries(back)) addItem(k, n);
      toast(`치웠어요. ${giveText(back)}를 돌려받았어요`);
    };
    buildBtn.addEventListener('click', openBuild);
    $('build-close').addEventListener('click', () => { buildMenu.hidden = true; });
    for (const b of buildMenu.querySelectorAll('[data-k]')) { b.dataset.note = b.querySelector('small').textContent; b.addEventListener('click', () => startBuild(b.dataset.k)); }
    $('build-remove').addEventListener('click', startRemove);
    buildOk.addEventListener('click', confirmBuild);
    buildRotate.addEventListener('click', () => { if (build) build.yaw += Math.PI / 2; });
    buildColor.addEventListener('click', () => { if (build && !build.remove) { build.c = (build.c + 1) % 6; ghost.geometry = world.previewGeo(build.k, build.c); } });
    $('build-cancel').addEventListener('click', endBuild);

    // ── 채집: 나무 · 돌 · 풀 · 꽃씨 · 산딸기 · 해바라기 씨 · 호박씨 · 버섯 (한 번 하면 잠시 쉼, 사람마다 따로) ──
    const GATHER = [
      { re: /^(cherry|broadleaf|maple|pine)$/, col: true, label: '나무하기', cool: 150, snd: 'chop', chip: 0x9c6b43, give: (r) => ({ mw: r < 0.4 ? 2 : 1 }) },
      { re: /^rock$/, col: true, label: '돌 캐기', cool: 150, snd: 'rock', chip: 0x9aa0a8, give: (r) => ({ ms: r < 0.4 ? 2 : 1 }) },
      { re: /^tuft$/, label: '풀 뜯기', reach: 1.3, cool: 90, snd: 'pick', chip: 0x79c25a, give: (r) => (r < 0.2 ? { mf: 1, s2: 1 } : { mf: r < 0.6 ? 2 : 1 }) },
      { re: /^flowers$/, label: '꽃씨 받기', reach: 1.5, cool: 120, snd: 'pick', chip: 0xf7a9c8, give: () => ({ s0: 1 }) },
      { re: /^bush$/, label: '산딸기 따기', reach: 1.7, cool: 120, snd: 'pick', chip: 0xe0445c, give: (r) => (r < 0.45 ? { fb: 1, s1: 1 } : { fb: 2 }) },
      { re: /^sunflower$/, label: '해바라기 씨 따기', reach: 1.5, cool: 120, snd: 'pick', chip: 0xf2cf3a, give: () => ({ fs: 2 }) },
      { re: /^pumpkin$/, label: '호박씨 받기', reach: 1.6, cool: 150, snd: 'pick', chip: 0xf08a24, give: () => ({ s3: 1 }) },
      { re: /^mushroom$/, label: '버섯 따기', reach: 1.3, cool: 120, snd: 'pick', chip: 0xd9573f, give: () => ({ fm: 1 }) },
    ];
    const gatherSpots = [];
    props.debug.colliders.forEach((c, i) => { const g = GATHER.findIndex((G) => G.col && G.re.test(c.key || '')); if (g >= 0) gatherSpots.push({ g, up: c.up, r: c.r, key: 'c' + i, pos: c.up.clone().multiplyScalar(c.ground) }); });
    for (const [key, list] of Object.entries(props.debug.placed)) {
      const g = GATHER.findIndex((G) => !G.col && G.re.test(key));
      if (g >= 0) list.forEach((it, i) => gatherSpots.push({ g, up: it.up, r: 0, key: key + i, pos: it.up.clone().multiplyScalar(terrain.radiusAt(it.up)) }));
    }
    const gatherCool = new Map(); // 자리 → 다시 할 수 있는 시각
    let working = null;
    function gatherNear(pp, up) {
      let best = null, bd = Infinity;
      const nowS = performance.now() / 1000;
      for (const sp of gatherSpots) {
        if (sp.up.dot(up) < 0.994) continue; // 대충 3m 밖은 건너뜀
        const G = GATHER[sp.g], d = sp.pos.distanceTo(pp) - sp.r, lim = G.col ? 1.35 : G.reach;
        if (d > lim || d >= bd || gatherCool.get(sp.key) > nowS) continue;
        bd = d; best = sp;
      }
      return best;
    }
    // 부스러기: 작은 조각이 튀었다 떨어짐
    const chipMats = new Map(), chips = [];
    for (let i = 0; i < 18; i++) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.09, 0.09)); m.visible = false; scene.add(m); chips.push({ m, v: new THREE.Vector3(), life: 0 }); }
    let chipNext = 0;
    function burst(pos, up, hex) {
      if (!chipMats.has(hex)) chipMats.set(hex, new THREE.MeshStandardMaterial({ color: hex, roughness: 0.8, flatShading: true }));
      const F = tangentFrame(up);
      for (let i = 0; i < 6; i++) {
        const c = chips[chipNext++ % chips.length], a = Math.random() * 6.28;
        c.m.material = chipMats.get(hex);
        c.m.position.copy(pos).addScaledVector(up, 0.6);
        c.v.copy(up).multiplyScalar(2.2 + Math.random() * 1.5).addScaledVector(F.e, Math.cos(a) * 1.6).addScaledVector(F.n, Math.sin(a) * 1.6);
        c.life = 0.7;
        c.m.visible = true;
      }
    }
    function gather(sp) {
      if (working || fishing || seated || eating) return;
      const G = GATHER[sp.g];
      gatherCool.set(sp.key, performance.now() / 1000 + G.cool);
      player.face(tmp.copy(sp.pos).sub(player.anchor.position));
      working = { t: 0, sp, got: false };
      player.setLocked(true);
      setAct({ k: 'work' });
      audio.fx(G.snd, 0.6);
    }
    function stepWork(dt) {
      working.t += dt;
      const sp = working.sp, G = GATHER[sp.g];
      if (!working.got && working.t > 0.45) {
        working.got = true;
        const got = G.give(Math.random());
        for (const [k, n] of Object.entries(got)) { addItem(k, n); quests.track('gather:' + k, n); }
        burst(sp.pos, sp.up, G.chip);
        audio.fx(G.snd, 0.5);
        toast(`${giveText(got)}를 얻었어요`);
      }
      if (working.t > 0.95) { working = null; setAct(null); player.setLocked(false); }
    }

    // ── 집 들어가기 (옷장에서 꾸미기) ──
    function houseNear(pp) {
      let best = null, bd = 1.9;
      for (const e of world.live.values()) if (e.it.k === 'house') { const d = world.doorOf(e).distanceTo(pp); if (d < bd) { bd = d; best = e; } }
      return best;
    }
    function enterHouse(e) {
      closeSheets();
      stopFishing(true);
      if (seated) stand();
      setAct({ k: 'home' });
      home.enter(e);
    }

    // ── 할 수 있는 일 버튼 (주민 대화가 먼저) ──
    let ctxNow = null, ctxWait = 0;
    function pickContext() {
      if (friends.open || rig.mode !== 'character' || build || !$('talk').hidden) return null;
      if (fishing) return fishing.phase === 'bite' ? { label: '당기기!', go: reel, hot: true } : { label: fishing.phase === 'cast' ? '던지는 중…' : '기다리는 중… (그만하기)', go: () => stopFishing() };
      if (isProne()) return { label: '일어나기', go: () => setProne(false) };
      if (seated || eating || working || home.house) return null;
      const pp = player.anchor.position;
      const house = houseNear(pp);
      if (house) return { label: `${world.ownerName(house)} 집에 들어가기`, go: () => enterHouse(house) };
      const slot = world.slotNear(pp, 1.6);
      if (slot) {
        const c = slot.crop, p = world.progressOf(c);
        if (c.s < 0) return { label: CROPS.some((x, i) => bag['s' + i]) ? '씨앗 심기' : '씨앗 심기 (씨앗이 없어요)', go: () => openSeeds(slot) };
        if (p >= 1) return { label: `${CROPS[c.s].name} 거두기`, go: () => harvest(slot), hot: true };
        if (!c.wt) return { label: `물 주기 (${Math.round(p * 100)}%)`, go: () => water(slot) };
        return { label: `${CROPS[c.s].name} 자라는 중 ${Math.round(p * 100)}%`, go: null };
      }
      const fire = world.nearest('fire', pp, 3.0);
      if (fire) return { label: '모닥불에 앉기', go: () => sitAt(fire) };
      const sp = gatherNear(pp, player.up);
      if (sp) return { label: GATHER[sp.g].label, go: () => gather(sp) };
      const w = waterAhead();
      if (w) return { label: '낚시하기', go: () => startFishing(w) };
      return null;
    }
    function doContext() { if (ctxNow && ctxNow.go) ctxNow.go(); }
    ctxBtn.addEventListener('click', doContext);
    window.addEventListener('keydown', (e) => {
      if (e.repeat || e.target instanceof HTMLInputElement) return;
      if (home.active) { if (e.code === 'Escape') home.exit(); return; }
      if (e.code === 'KeyC') setProne(!isProne());
      else if (e.code === 'Space' && isProne()) setProne(false);
      else if (e.code === 'KeyE' && $('talk').hidden && !friends.open) doContext();
      else if (e.code === 'KeyB') openBuild();
      else if (e.code === 'KeyR' && build && !build.remove) build.yaw += Math.PI / 2;
      else if (e.code === 'KeyI') openBag();
      else if (e.code === 'Escape') { if (build) endBuild(); closeSheets(); }
    });

    // ── 친구: 하는 일 · 선물 ──
    function onBuddy(b, pr, isNew) {
      const a = pr.ac && typeof pr.ac === 'object' && ACT_KINDS.includes(pr.ac.k) ? pr.ac : null;
      const sig = a ? JSON.stringify(a) : '';
      if (sig !== b.actSig) {
        b.actSig = sig;
        const same = b.act && a && b.act.k === a.k;
        const it = a && typeof a.it === 'string' && ITEMS[a.it] ? a.it : 'gv';
        b.act = a ? { k: a.k, t: same ? b.act.t : 0, cast: same ? b.act.cast : a.k === 'fish' && !isNew ? 0 : 1, bite: a.bite ? 1 : 0, seat: a.seat ? 1 : 0, s: clamp(a.s | 0, 0, SONGS.length - 1), it } : null;
        b.anchor.visible = !(a && a.k === 'home'); // 집 안에 있는 친구는 밖에서 안 보임
        if (!b.props) b.props = makeProps({ handArm: b.arms[1], torso: b.body });
        const bob = a && a.k === 'fish' ? vec3(a.b) : null;
        showProps(b.props, b.act, bob ? new THREE.Vector3(...bob).normalize() : null);
        const was = music.has(b.key) ? b.musicKind : null, now = a && (a.k === 'guitar' || a.k === 'sing') ? a.k + b.act.s : null;
        if (was !== now) { music.stop(b.key); b.musicKind = now; if (now) music.start(b.key, a.k, b.act.s, () => b.anchor.position); }
        if (a && a.k === 'eat' && !isNew && a.i !== b.eatSeen) { b.eatSeen = a.i; if (b.anchor.position.distanceTo(player.anchor.position) < 12) audio.fx('chomp', 0.4); }
      }
      const ot = cleanOutfit(pr.ot), osig = ot.join('');
      if (osig !== b.otSig) { b.otSig = osig; swapAvatar(b, ot); } // 처음 받을 때도 꼭 (내 화면에서 정한 색이 아니라 친구가 고른 모습으로)
      const list = Array.isArray(pr.gf) ? pr.gf.slice(-5) : [];
      const mine = together.myKey();
      let top = b.seenGift == null ? -1 : b.seenGift;
      for (const g of list) {
        if (!g || !Number.isFinite(g.i) || g.i <= (b.seenGift == null ? -1 : b.seenGift)) continue;
        top = Math.max(top, g.i);
        if (isNew || g.to !== mine || !ITEMS[g.it]) continue; // 들어올 때 이미 있던 건 지난 일
        addItem(g.it);
        toast(`${b.name}님이 ${obj(ITEMS[g.it].name, ['을', '를'])} 줬어요!`);
        audio.fx('pop', 0.6);
        emotes.fxFor('heart', player.anchor.position, player.up, player.height, 0);
      }
      b.seenGift = top;
    }
    function dropBuddy(b) {
      music.stop(b.key);
      dropProps(b);
    }
    function dropProps(b) { // 소품 메시를 팔 · 몸에서 떼어 냄 (모양은 모두가 같이 쓰니 버리지 않음)
      if (!b.props) return;
      const p = b.props;
      scene.remove(p.bobber, p.line);
      p.line.geometry.dispose();
      p.bobber.geometry.dispose();
      for (const k of ['rod', 'guitar', 'food']) if (p[k] && p[k].parent) p[k].parent.remove(p[k]);
      b.props = null;
    }
    function swapAvatar(b, ot) { // 친구가 옷을 바꿈 → 새 모습으로 갈아 끼움
      const had = !!b.props, bob = b.props ? b.props.bobDir : null;
      dropProps(b);
      const nb = buildAvatar(null, ot, b.mat); // 색 조합까지 친구 화면 그대로
      if (b.tag && b.tag.el) b.tag.el.style.setProperty('--tone', '#' + lookOf(ot).jacket.toString(16).padStart(6, '0'));
      b.anchor.remove(b.root);
      for (const g of b.geos || []) g.dispose();
      b.anchor.add(nb.root);
      Object.assign(b, { root: nb.root, body: nb.body, neck: nb.neck, arms: nb.arms, legs: nb.legs, wear: nb.wear, geos: nb.geos });
      b.wear.forEach((m, i) => { m.visible = !!(b.gifts & (1 << i)); });
      if (had || b.act) { b.props = makeProps({ handArm: b.arms[1], torso: b.body }); showProps(b.props, b.act, bob); }
    }

    return {
      bag, ITEMS, SONGS, music, onBuddy, dropBuddy, toast, addItem,
      get holdsPlayer() { return !!(seated || working || home.house); }, // 사진을 찍은 뒤에도 앉은 채로 (일어서지 않게)
      setProne, get prone() { return isProne(); },
      get presOutfit() { return outfits.ot; },
      get presAct() {
        if (!act) return null;
        if (act.k === 'fish') { const d = fishing ? fishing.bob : player.up; return { k: 'fish', b: [r4(d.x), r4(d.y), r4(d.z)], bite: act.bite ? 1 : 0 }; }
        if (act.k === 'guitar' || act.k === 'sing') return { k: act.k, s: act.s, seat: seated ? 1 : 0 };
        if (act.k === 'eat') return { k: 'eat', i: act.i, it: act.it, seat: act.seat };
        return { k: act.k };
      },
      get presGifts() { return gifts.length ? gifts : null; },
      get state() { return { act: act ? act.k : null, fishing: fishing ? fishing.phase : null, seated: !!seated, build: build ? build.k || 'remove' : null, boost: Math.round(boostLeft), ctx: ctxNow ? ctxNow.label : null, inside: home.active }; },
      debug: { startFishing: (d) => startFishing(d), reel, sitAt, stand, playGuitar, sing, eat, grill, give, startBuild, confirmBuild, startRemove, endBuild, waterAhead, openSeeds, openBuild, gather, gatherNear, gatherSpots, GATHER, houseNear, enterHouse, gatherCool,
        get build() { return build; }, get fishing() { return fishing; }, get pendingBuild() { return pendingBuild; }, get working() { return working; } },
      update(dt, time) {
        // 할 수 있는 일
        ctxWait -= dt;
        if (ctxWait <= 0 || (fishing && fishing.phase === 'bite')) {
          ctxWait = 0.12;
          ctxNow = pickContext();
          ctxBtn.hidden = !ctxNow;
          if (ctxNow) { ctxBtn.textContent = ctxNow.label; ctxBtn.disabled = !ctxNow.go; ctxBtn.classList.toggle('hot', !!ctxNow.hot); }
        }
        if (rig.mode !== 'character') { if (build) endBuild(); closeSheets(); } // 행성 보기로 가면 짓기 · 판을 정리
        campBar.hidden = !seated || rig.mode !== 'character';
        if (fishing) stepFishing(dt);
        if (build) stepBuild(dt);
        if (working) stepWork(dt);
        if (act && act.k === 'home' && !home.house) setAct(null); // 집에서 나옴
        for (const c of chips) if (c.life > 0) { // 부스러기
          c.life -= dt;
          c.v.addScaledVector(tmp.copy(c.m.position).normalize(), -9 * dt);
          c.m.position.addScaledVector(c.v, dt);
          c.m.rotation.x += dt * 9; c.m.rotation.y += dt * 7;
          c.m.visible = c.life > 0;
        }
        // 물고기가 모이는 찌: 나 + 낚시하는 친구
        const lures = [];
        if (fishing && fishing.phase !== 'cast') lures.push(fishing.bob);
        if (together) for (const b of together.buddies.values()) if (b.act && b.act.k === 'fish' && b.props && b.props.bobDir) lures.push(b.props.bobDir);
        animals.lures = lures;
        if (eating) { eating.t += dt; if (Math.random() < dt * 5) audio.fx('chomp', 0.35); if (eating.t > 1.4) { setAct(eating.back); eating = null; showProps(myProps, act, fishing ? fishing.bob : null); } }
        if (seated && player.moving > 0.2) stand();
        if (act && act.k === 'guitar') act.strum = music.strum('me');
        if (act && act.k === 'sing' && Math.random() < dt * 1.2) emotes.fxFor('dance', player.anchor.position, player.up, player.height, 0);
        placeBobber(myProps, act && act.bite, time);
        // 든든함: 더 빨리 · 더 높이
        if (boostLeft > 0) { boostLeft = Math.max(0, boostLeft - dt); if (!boostLeft) toast('든든함이 다 사라졌어요'); }
        boost.run = (boostLeft > 0 ? 1.3 : 1) * (isProne() ? 0.38 : 1); // 엎드리면 천천히 기어감
        boost.jump = isProne() ? 0 : boostLeft > 0 ? 1.15 : 1;
        // 친구 소품
        if (together) for (const b of together.buddies.values()) if (b.props) { if (b.act && b.act.k === 'guitar') b.act.strum = music.strum(b.key); placeBobber(b.props, b.act && b.act.bite, time); if (b.act && b.act.k === 'sing' && Math.random() < dt * 1.2) emotes.fxFor('dance', b.anchor.position, b.up, b.height, 0); }
        music.update();
        // 화면
        const total = ORDER.reduce((n, k) => n + bag[k], 0);
        bagCount.hidden = !total;
        bagCount.textContent = String(total);
        if (!bagPanel.hidden) { bagDirty = bagDirty || Math.random() < dt * 2; renderBag(); }
        if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.classList.remove('show'); }
      },
    };
  }
  // ═══════════════════════════════════════════════
  // 16-9. FINDER — 친구 찾기: 화면 밖 · 멀리 있는 친구 쪽을 화살표로, 이름과 거리(m)도
  //    구 위에서: 거리 = 반지름 × 사이각, 방향 = 내 발밑 평면에 눕힌 친구 쪽 → 카메라 오른쪽 · 앞쪽으로 화면에 그림
  //    표시를 누르면 캐릭터가 그 친구 쪽을 바라봄 (앞으로 걸으면 만남)
  // ═══════════════════════════════════════════════
  function createFinder() {
    const btn = $('finder-btn'), layer = $('finder');
    const R = CONFIG.planet.radius;
    let on = false;
    const pins = new Map(); // 친구 key → { el, arrow, text }
    const V = () => new THREE.Vector3();
    const camRight = V(), camFwd = V(), dir = V(), head = V(), proj = V(), seg = V(), mid = V();
    const SHOW_TAG_WITHIN = 34; // 이보다 가까이 보이면 이름표가 있으니 표시는 숨김
    function setOn(v) {
      on = v;
      btn.setAttribute('aria-pressed', String(on));
      if (!on) for (const p of pins.values()) p.el.hidden = true;
    }
    btn.addEventListener('click', () => {
      setOn(!on);
      audio.fx('pop', 0.4);
      if (on) life.toast('화면 가장자리 화살표가 친구 쪽이에요. 누르면 그쪽을 바라봐요');
    });
    function pinFor(b) {
      let p = pins.get(b.key);
      if (p) return p;
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'finder-pin press';
      el.innerHTML = '<span class="finder-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M5 12h11M12 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="finder-text"></span>';
      el.addEventListener('click', () => lookAt(b));
      layer.appendChild(el);
      p = { el, arrow: el.firstChild, text: el.lastChild };
      pins.set(b.key, p);
      return p;
    }
    function towards(b, out) { // 내 발밑에서 친구 쪽 (땅에 눕힌 방향)
      const up = player.up, bu = b.up;
      out.copy(bu).addScaledVector(up, -up.dot(bu));
      if (out.lengthSq() < 1e-10) out.copy(player.heading);
      return out.normalize();
    }
    function lookAt(b) { // 그 친구 쪽을 바라보고 카메라는 등 뒤로 → 앞으로 걸으면 만남
      const d = towards(b, V());
      player.face(d);
      followView.turnTo(d.clone().negate());
      audio.fx('pop', 0.5);
      life.toast(`${b.name} 쪽을 바라봐요. 앞으로 걸어가 보세요`);
    }
    const behindPlanet = (a, b) => { seg.subVectors(b, a); const t = clamp(-a.dot(seg) / seg.lengthSq(), 0, 1); return mid.copy(a).addScaledVector(seg, t).length() < R - 0.5; };
    return {
      get on() { return on; },
      setOn,
      lookAt,

      { key: 'shop', seasons: [0, 1, 2, 3], big: true, attempts: 2600, max: 26, base: shopBase, tinted: shopTint, tints: [0xf28c8c, 0x8cc8f2, 0xf2d28c, 0x9fe0a8, 0xc8a8f0, 0xf0b0d0],
        density: () => 0.7, scale: [0.95, 1.05], footprint: 3.4, sink: 0.08, slopeMin: 0.9, where: (d) => clearOf(d, 2.9) && L.roadDist(d) < 6, collide: (s) => ({ r: 3.1 * s, h: 4 * s }) },
      { key: 'house', seasons: [1, 2], big: true, attempts: 2600, max: 30, base: houseBase, tinted: houseTint, tints: [0xf5e6c8, 0xe8f0f5, 0xf5dfe2, 0xe0efe0, 0xd9534f, 0x4f7fd9, 0x5aa86a],
        density: (f, s) => (s === 2 ? 0.8 : 0.6), scale: [0.9, 1.1], footprint: 2.6, sink: 0.08, slopeMin: 0.88, where: (d) => clearOf(d, 3.0), collide: (s) => ({ r: 2.5 * s, h: 4.6 * s }), shadow: 0 },
      { key: 'citytree', seasons: [0, 1, 2, 3], big: true, attempts: 4200, max: 130, sway: 'leaf', base: treeBase, tinted: treeTint, tints: [0x6fbf5a, 0x5aa84a, 0x86c26b, 0x4f9a48],
        density: (f, s) => (s === 2 ? 0.9 * f.tree + 0.1 : s === 1 ? 0.35 : 0.12), scale: [0.85, 1.25], footprint: 0.9, sink: 0.1, slopeMin: 0.8, where: (d) => clearOf(d, 2.4),

      { key: 'bench', seasons: [0, 2], attempts: 1500, max: 24, base: benchBase, density: (f, s) => (s === 2 ? 1 : 0.5), scale: [1, 1], footprint: 0.9, sink: 0.02, slopeMin: 0.9, where: (d) => clearOf(d, 2.3), collide: () => ({ r: 0.7, h: 0.9 }) },
      { key: 'container', seasons: [3], big: true, attempts: 3000, max: 34, cluster: 2, clusterDist: 3.2, base: null, tinted: contTint, tints: [0xd9472b, 0x2f6fb5, 0x3a9a5b, 0xe8a33a, 0xc2c9d1, 0x8e5bd6],

        collide: () => ({ r: 2.2, h: 2.6 }) },
      { key: 'crane', seasons: [3], big: true, attempts: 3000, max: 3, base: craneBase, density: () => 1, scale: [1, 1], footprint: 3, sink: 0.1, slopeMin: 0.85,
        where: (d) => L.bayDist(d) > 12.2 && L.bayDist(d) < 15 && L.roadDist(d) > 2.4, collide: () => ({ r: 2.3, h: 10 }) },
      { key: 'startower', seasons: [0, 1, 2, 3], base: starTower, fixed: [{ dir: L.towerDir, yaw: 0.3 }], footprint: 4, sink: 0.05, collide: () => ({ r: 3.9, h: 33 }), block: () => ({ y: 14, r: 4 }) },
      ...(light ? [{ key: 'lighthouse', seasons: [3], base: lighthouse, fixed: [{ dir: light, yaw: 0 }], footprint: 1.4, sink: 0.05, collide: () => ({ r: 1.3, h: 11 }) }] : []),
      ...bridgeTypes,
    ];
  }

  // ═══════════════════════════════════════════════
  // 18-2. TRAVEL — 행성 보기에서 다른 행성이 보이고, 누르면 소개 카드 → 그 행성으로 이동 (같은 방 그대로)
  // ═══════════════════════════════════════════════
  const ELSEWHERE = new Map(); // 같은 방인데 다른 행성에 있는 친구: key → { name, pl }
  function createTravel() {
    const others = Object.values(PLANETS).filter((P) => P.id !== PLANET.id);
    const labels = $('planet-labels'), sheet = $('travel'), warp = $('warp'), here = $('planet-here');
    const mat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.9, metalness: 0 });
    const tmpC = new THREE.Color();
    function globe(colorOf, extras) { // 작은 행성 모형
      const g = new THREE.IcosahedronGeometry(1, 3).toNonIndexed();
      const pos = g.attributes.position, cols = new Float32Array(pos.count * 3), v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i += 3) { // 삼각형마다 한 색 (낮은 다각형 느낌)
        v.set((pos.getX(i) + pos.getX(i + 1) + pos.getX(i + 2)) / 3, (pos.getY(i) + pos.getY(i + 1) + pos.getY(i + 2)) / 3, (pos.getZ(i) + pos.getZ(i + 1) + pos.getZ(i + 2)) / 3).normalize();
        colorOf(v, tmpC);
        for (let k = 0; k < 3; k++) { cols[(i + k) * 3] = tmpC.r; cols[(i + k) * 3 + 1] = tmpC.g; cols[(i + k) * 3 + 2] = tmpC.b; }
      }
      g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
      const grp = new THREE.Group();
      grp.add(new THREE.Mesh(g, mat));
      if (extras) grp.add(new THREE.Mesh(extras, mat));
      return grp;
    }
    const centers = [[0, 1, 0], [0.942809, -0.333333, 0], [-0.471405, -0.333333, 0.816497], [-0.471405, -0.333333, -0.816497]].map((c) => new THREE.Vector3(...c));
    const nearest = (v) => { let b = 0; for (let i = 1; i < 4; i++) if (v.dot(centers[i]) > v.dot(centers[b])) b = i; return b; };
    const LOOK = {
      seasons: (v, c) => c.setHex([0xf6b8cf, 0x7fcf6a, 0xe8873a, 0xf2f6fb][nearest(v)]),
      city: (v, c) => { const r = Math.abs(v.dot(new THREE.Vector3(0.288, 0.816, -0.5))); c.setHex(r < 0.08 ? 0x3d8cc4 : nearest(v) === 2 ? 0x6fbf5a : (Math.round(v.x * 9) + Math.round(v.z * 9)) % 2 ? 0x9aa3b0 : 0xc9c3b6); },
      dino: (v, c) => c.setHex(v.y < -0.55 ? 0x5a4a44 : Math.sin(v.x * 7) * Math.cos(v.z * 6) > 0.3 ? 0x2f7d3a : 0x6fae4a),
    };
    const EXTRA = {
      city: () => { // 북쪽 반구에 꽂힌 작은 빌딩들
        const parts = [], Y = new THREE.Vector3(0, 1, 0), e = new THREE.Euler();
        for (let i = 0; i < 26; i++) {
          const d = new THREE.Vector3(Math.sin(i * 2.4) * Math.cos(i * 1.3), Math.abs(Math.cos(i * 0.9)) * 0.9 + 0.1, Math.cos(i * 2.4) * Math.cos(i * 1.3)).normalize(), h = 0.12 + (i % 4) * 0.05;
          e.setFromQuaternion(new THREE.Quaternion().setFromUnitVectors(Y, d));
          parts.push(P(new THREE.BoxGeometry(0.07, h, 0.07), [0xdfe6ee, 0x7fb4e0, 0xc9d3de][i % 3], d.clone().multiplyScalar(1 + h / 2).toArray(), [e.x, e.y, e.z]));
        }
        return mergeParts(parts);
      },
      dino: () => mergeParts([P(new THREE.ConeGeometry(0.28, 0.4, 7), 0x5a4a44, [0, -1.08, 0], [Math.PI, 0, 0]), P(new THREE.ConeGeometry(0.1, 0.1, 7), 0xe34b2b, [0, -1.3, 0], [Math.PI, 0, 0])]),
    };
    const items = others.map((P) => {
      const grp = globe(LOOK[P.id], EXTRA[P.id] ? EXTRA[P.id]() : null);
      grp.visible = false;
      scene.add(grp);
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'press planet-label' + (P.ready ? '' : ' soon');
      el.innerHTML = `<b>${P.name}</b><small>${P.ready ? '눌러서 여행' : P.soon || '준비 중'}</small>`;
      el.addEventListener('click', () => open(P.id));
      labels.appendChild(el);
      return { P, grp, el, spin: Math.random() * 6 };
    });
    // 행성 보기에서 화면을 톡 누르면 (끌지 않고) 그 행성을 고름
    const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
    let down = null;
    const onUi = (e) => e.target instanceof Element && !!e.target.closest('button, input, .sheet, .chip, .planet-label');
    window.addEventListener('pointerdown', (e) => { down = onUi(e) ? null : { x: e.clientX, y: e.clientY, t: performance.now() }; }, true); // 행성 보기 조작이 포인터를 붙잡아도 받게
    window.addEventListener('pointerup', (e) => {
      if (!down || rig.mode !== 'planet') return;
      const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), quick = performance.now() - down.t < 450;
      down = null;
      if (moved > 8 || !quick) return;
      ndc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      for (const it of items) if (it.grp.visible && ray.intersectObject(it.grp, true).length) { open(it.P.id); return; }
    }, true);
    // 소개 카드
    let showing = null, traveling = false;
    const friendsOn = (id) => [...ELSEWHERE.values()].filter((f) => f.pl === id).map((f) => f.name);
    function open(id) {
      const P = PLANETS[id];
      showing = id;
      $('travel-title').textContent = P.name;
      $('travel-status').textContent = id === PLANET.id ? '지금 여기' : P.ready ? '갈 수 있어요' : P.soon || '준비 중';
      $('travel-desc').textContent = P.tagline;
      $('travel-goal').textContent = P.goal;
      const fr = friendsOn(id);
      $('travel-friends').textContent = fr.length ? `여기 있는 친구: ${fr.join(', ')}` : '';
      const go = $('travel-go');
      go.disabled = !P.ready || id === PLANET.id;
      go.textContent = id === PLANET.id ? '지금 이 행성에 있어요' : P.ready ? `${P.name}으로 가기` : '아직 갈 수 없어요';
      sheet.hidden = false;
      audio.fx('pop', 0.5);
    }
    $('travel-close').addEventListener('click', () => { sheet.hidden = true; showing = null; });
    $('travel-go').addEventListener('click', () => { if (showing) go(showing); });
    function go(id) { // 별빛 터널 → 그 행성 주소로 (방 · 닉네임은 이어서)
      const P = PLANETS[id];
      if (!P || !P.ready || id === PLANET.id || traveling) return;
      traveling = true;
      sheet.hidden = true;
      try { sessionStorage.setItem('starlight-travel', JSON.stringify({ to: id, room: net.status === 'room' ? net.code : null, nick: myNick(), at: Date.now() })); } catch (e) { /* 그냥 감 */ }
      $('warp-text').textContent = `별빛을 타고 ${P.name}으로…`;
      warp.classList.add('on');
      audio.fx('warp', 0.8);
      setTimeout(() => {
        const url = `${location.pathname}${id === 'seasons' ? '' : `?planet=${id}`}${net.status === 'room' && net.code ? `#room=${net.code}` : ''}`;
        location.assign(url);
      }, 1100);
    }
    // 도착: 여행으로 왔으면 같은 방에 저절로 다시 들어감
    let arrived = null;
    try { arrived = JSON.parse(sessionStorage.getItem('starlight-travel') || 'null'); sessionStorage.removeItem('starlight-travel'); } catch (e) { /* 처음 */ }
    if (arrived && arrived.to === PLANET.id && Date.now() - arrived.at < 120000) {
      warp.classList.add('on', 'arrive');
      setTimeout(() => warp.classList.remove('on'), 400);
      setTimeout(() => warp.classList.remove('arrive'), 1400);
      setTimeout(() => life.toast(`${PLANET.name}에 도착했어요!`), 900);
      if (arrived.room && arrived.nick) setTimeout(() => { if (net.status !== 'room') net.join(arrived.room, arrived.nick); }, 600);
    }
    // 멀티 창: 다른 행성에 있는 친구 + 같이 가기
    const elsewhereEl = $('elsewhere');
    let listWait = 0, lastSig = '';
    function renderElsewhere() {
      const list = [...ELSEWHERE.values()];
      const sig = list.map((f) => f.name + f.pl).join('|');
      if (sig === lastSig) return;
      lastSig = sig;
      elsewhereEl.hidden = !list.length;
      elsewhereEl.replaceChildren(...list.map((f) => {
        const row = document.createElement('div');
        row.className = 'elsewhere-row';
        const P = PLANETS[f.pl];
        row.append(Object.assign(document.createElement('span'), { textContent: `${f.name} · ${P ? P.name : '다른 행성'}에 있어요` }));
        if (P && P.ready) { const b = document.createElement('button'); b.type = 'button'; b.className = 'press act'; b.textContent = '같이 가기'; b.addEventListener('click', () => go(f.pl)); row.append(b); }
        return row;
      }));
    }
    const fwd = new THREE.Vector3(), right = new THREE.Vector3(), upv = new THREE.Vector3(), pv = new THREE.Vector3();
    here.textContent = `지금 여기: ${PLANET.name}`;
    return {
      open, go, items,
      elsewhere: () => [...ELSEWHERE.values()], // 같은 방 · 다른 행성 친구 (확인용)
      get traveling() { return traveling; },
      update(dt) {
        listWait -= dt;
        if (listWait <= 0) { listWait = 0.5; renderElsewhere(); }
        const show = rig.t < 0.35 && !traveling && !(home && home.active);
        here.hidden = !show;
        labels.hidden = !show;
        if (!show) { for (const it of items) it.grp.visible = false; return; }
        camera.getWorldDirection(fwd);
        right.crossVectors(fwd, camera.up).normalize();
        upv.crossVectors(right, fwd).normalize();
        const D = 150, tanY = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), tanX = tanY * camera.aspect;
        items.forEach((it, i) => {
          const sx = items.length === 1 ? 0 : i === 0 ? -1 : 1;
          it.grp.visible = true;
          it.grp.position.copy(camera.position).addScaledVector(fwd, D).addScaledVector(right, sx * 0.6 * D * tanX).addScaledVector(upv, 0.56 * D * tanY);
          const s = 0.15 * D * tanY;
          it.grp.scale.setScalar(s);
          it.spin += dt * 0.25;
          it.grp.rotation.set(0.35, it.spin, 0);
          pv.copy(it.grp.position).addScaledVector(upv, -s * 1.35).project(camera);
          it.el.style.transform = `translate(${(((pv.x + 1) / 2) * window.innerWidth).toFixed(1)}px, ${(((1 - pv.y) / 2) * window.innerHeight).toFixed(1)}px) translate(-50%, 0)`;
        });
      },
    };
  }

  // ═══════════════════════════════════════════════
  // 17. HUD — 계절 표시 · 점프 버튼 · 시점 전환 · 안내 문구
  // ═══════════════════════════════════════════════
  function createHud() {
    const touch = !!(window.matchMedia && window.matchMedia('(any-pointer: coarse)').matches);
    document.documentElement.classList.toggle('touch', touch);
    hintEl.textContent = touch ? '왼쪽 아래를 밀어 걷고, 오른쪽을 밀어 둘러봐요' : 'WASD로 걷고 스페이스로 점프, 드래그로 둘러봐요';
    onUpdate(() => { if (player.moving > 0.05) hintEl.classList.add('faded'); });

    // 계절 칩: 캐릭터 보기에선 캐릭터가 선 곳, 행성 보기에선 화면 가운데
    const chip = $('season');
    const label = $('season-name');
    const dir = new THREE.Vector3();
    let current = -1;
    let wait = 0;
    onUpdate((dt) => {
      wait -= dt;
      if (wait > 0) return;
      wait = 0.15;
      if (rig.mode === 'character') dir.copy(player.up);
      else dir.copy(camera.position).normalize();
      const idx = terrain.seasonAt(dir);
      if (idx === current) return;
      current = idx;
      chip.dataset.season = SEASONS[idx].key;
      label.textContent = `${SEASONS[idx].name} 구역`;
    });

    // 점프: 누르는 순간 바로 (키보드로 버튼을 누른 경우는 click으로)
    const jumpButton = $('jump');
    jumpButton.addEventListener('pointerdown', (e) => { e.preventDefault(); player.requestJump(); });
    jumpButton.addEventListener('click', (e) => { if (e.detail === 0) player.requestJump(); });

    // 시점 전환
    const controls = $('controls');
    const toggle = $('view-toggle');
    let introPending = true;
    function sync() {
      const near = rig.mode === 'character';
      toggle.textContent = near ? '행성 보기' : '캐릭터 보기';
      controls.classList.toggle('away', !near);
      player.setEnabled(near);
    }
    function show(mode, seconds) {
      if (mode === 'planet') planetView.lookAtDir(player.up); // 캐릭터가 선 자리를 가운데 두고 멀어짐
      rig.setMode(mode, seconds);
      sync();
    }
    toggle.addEventListener('click', () => {
      introPending = false;
      show(rig.mode === 'character' ? 'planet' : 'character', 2.2);
    });
    sync();

    return {
      // 첫 화면 연출: 사용자가 먼저 시점을 바꾸지 않았다면 캐릭터 곁으로 내려앉음
      intro(seconds) {
        if (!introPending) return;
        introPending = false;
        show('character', seconds);
      },
    };
  }

  // ═══════════════════════════════════════════════
  // 18. LOOP & BOOT
  // ═══════════════════════════════════════════════
  let fpsTime = 0;
  let fpsFrames = 0;

  function advance(dt, skipRender) {
    const t = clock.elapsedTime;
    for (let i = 0; i < updaters.length; i++) updaters[i](dt, t);
    space.position.copy(camera.position);
    if (!skipRender) { if (home && home.active) home.render(renderer); else renderer.render(scene, camera); }
  }

  // 기기가 버거워하면(평균 45fps 미만) 해상도를 한 단계씩 낮추고, 여유가 생기면 되돌림
  // 한 번 버거웠던 해상도로는 다시 올리지 않아 오르락내리락하지 않음
  const perf = { time: 0, frames: 0, cool: 4, failed: Infinity };
  function adapt(raw) {
    if (raw > 0.5) { perf.time = 0; perf.frames = 0; return; } // 탭을 다녀온 직후 등은 무시
    perf.time += raw;
    perf.frames++;
    perf.cool -= raw;
    if (perf.time < 2) return;
    const fps = perf.frames / perf.time;
    perf.time = 0;
    perf.frames = 0;
    if (perf.cool > 0) return;
    let next = pixelRatio;
    if (fps < 45 && pixelRatio > 1) { perf.failed = pixelRatio; next = Math.max(1, pixelRatio - 0.25); }
    else if (fps > 57 && pixelRatio + 0.25 < perf.failed) next = Math.min(maxPixelRatio(), pixelRatio + 0.25);
    if (next !== pixelRatio) {
      pixelRatio = next;
      applyResolution();
      perf.cool = 4;
    }
  }
  function applyResolution() {
    renderer.setPixelRatio(pixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    stars.material.uniforms.uPixelRatio.value = pixelRatio;
    if (fx) fx.particles.resize();
  }

  function tick() {
    const raw = clock.getDelta();
    advance(Math.min(raw, 0.05));
    adapt(raw);
    fpsTime += raw;
    fpsFrames++;
    if (fpsTime >= 0.5) {
      fpsEl.textContent = `${Math.round(fpsFrames / fpsTime)} fps`;
      fpsTime = 0;
      fpsFrames = 0;
    }
  }

  function onResize() {
    pixelRatio = Math.min(pixelRatio, maxPixelRatio());
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    applyResolution();
    planetView.onResize();
  }

  function boot() {
    try {
      createCore();
    } catch (err) {
      console.error(err);
      showError('이 브라우저에서는 WebGL을 켤 수 없어요. 최신 Chrome이나 Safari로 열어 주세요.');
      return;
    }
    try {
      createSpace();
      createLights();
      terrain = createPlanet();
      props = createProps();
      scene.add(...props.meshes);

      character = createCharacter();
      scene.add(character.anchor);
      stick = createStick();
      keys = createKeys();
      player = createPlayer(character, stick, keys);
      onUpdate((dt) => player.update(dt));

      planetView = createPlanetView();
      followView = createFollowView(player);
      rig = createCameraRig(planetView, followView);
      planetView.lookAtDir(player.up); // 처음엔 시작 지점 위에서 행성을 내려다봄
      onUpdate((dt) => rig.update(dt));
      onUpdate(() => aimSun(camera, player.up, player.sunRef, rig.t));
      createGestures(renderer.domElement, () => rig.active(), stick);
      hud = createHud();
      fx = createSeasonFx();
      gems = createGems();
      onUpdate((dt, t) => gems.update(dt, t));
      audio = createAudio();
      character.onStep = (speed) => audio.step(speed);
      player.on.jump = () => audio.jump();
      player.on.land = (k) => audio.land(k);
      gems.on.collect = (season, kind) => audio.gem(season, kind);
      fx.on.region = (season) => audio.region(season);
      fx.on.thunder = (delay) => audio.thunder(delay);
      onUpdate((dt) => audio.update(dt));
      friends = createFriends();
      onUpdate((dt, t) => friends.update(dt, t));
      emotes = createEmotes();
      onUpdate((dt) => emotes.update(dt));
      together = createTogether();
      onUpdate((dt, t) => together.update(dt, t));
      journal = createJournal(); // 친구 모듈(레이스)까지 만든 다음
      onUpdate((dt) => journal.update(dt));
      createLobby();
      animals = createAnimals();
      onUpdate((dt, t) => animals.update(dt, t));
      world = createWorld();
      onUpdate((dt, t) => world.update(dt, t));
      outfits = createOutfits();
      quests = createQuests();
      home = createHome();
      onUpdate((dt) => home.update(dt));
      life = createLife();
      onUpdate((dt, t) => life.update(dt, t));
      animals.setClock(() => world.now() / 1000); // 방에선 서버 시각 → 모두 같은 동물
      fx.setClock(() => world.now() / 1000); // 날씨도 같은 시각으로 → 모두 같은 날씨
      finder = createFinder(); // 친구 찾기 (방에 친구가 있을 때)
      onUpdate(() => finder.update());
      travel = createTravel(); // 행성 여행 (행성 보기에서 다른 행성)
      onUpdate((dt) => travel.update(dt));
      animals.onSend = (a, f) => { if (world.mode === 'room') net.scare(a, f); else animals.scare(a, f, Date.now()); };
      onUpdate((dt, t) => { windTime.value = t; });

      window.addEventListener('resize', onResize);
      onResize();
      tick();
      renderer.setAnimationLoop(tick);
      window.__season = { scene, camera, renderer, CONFIG, SEASONS, terrain, props, character, player, stick, planetView, followView, rig, fx, gems, audio, friends, together, emotes, journal, net, animals, world, life, outfits, quests, home, finder, travel, PLANET, PLANETS, advance, adapt, get pixelRatio() { return pixelRatio; } };
      requestAnimationFrame(() => loadingEl.classList.add('hidden'));
      setTimeout(() => hud.intro(2.6), REDUCED_MOTION ? 0 : 1300); // 행성을 잠깐 보여 준 뒤 캐릭터 곁으로
    } catch (err) {
      console.error(err);
      showError(`장면을 만들다 멈췄어요: ${err.message}`);
    }
  }

  document.addEventListener('gesturestart', (e) => e.preventDefault());
  requestAnimationFrame(() => setTimeout(boot, 30)); // 로딩 화면을 먼저 그린 뒤 무거운 생성 작업 시작
})();
</script>
</body>
</html>
