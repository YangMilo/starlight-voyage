      cap: [P(B(0.54, 0.14, 0.54), 0x7a4a2a, [0, 0.54, 0]), P(B(0.46, 0.03, 0.22), 0x6a3f24, [0, 0.475, 0.33]), P(B(0.06, 0.04, 0.06), 0x6a3f24, [0, 0.63, 0])],
      knit: [P(B(0.55, 0.09, 0.55), 0xf4f7ff, [0, 0.47, 0]), P(B(0.53, 0.2, 0.53), 0xd94f5c, [0, 0.6, 0]), P(B(0.18, 0.18, 0.18), 0xf4f7ff, [0, 0.78, 0])],
    };
    const PROPS = { // 오른팔(어깨) 기준 좌표, 손은 y -0.49
      can: [P(B(0.22, 0.18, 0.15), 0x5fb7c9, [0, -0.66, 0.12]), P(C(0.02, 0.025, 0.3, 6), 0x4a9fb0, [0, -0.62, 0.32], [1.0, 0, 0]), P(B(0.04, 0.12, 0.12), 0x4a9fb0, [0, -0.54, 0.06])],
      rod: [P(C(0.018, 0.025, 2.0, 6), 0x8b5a2b, [0, 0.335, 0.565], [0.6, 0, 0]), P(B(0.012, 1.2, 0.012), 0xe8f4ff, [0, 0.56, 1.13])],
      basket: [P(B(0.3, 0.18, 0.22), 0xb58a4a, [0, -0.68, 0.1]), P(B(0.04, 0.2, 0.04), 0x9a7040, [0, -0.52, 0.1]),
        P(B(0.08, 0.08, 0.08), 0xd64541, [0.07, -0.56, 0.12]), P(B(0.08, 0.08, 0.08), 0xe8a33a, [-0.06, -0.56, 0.07]), P(B(0.08, 0.08, 0.08), 0xd64541, [0, -0.55, 0.16])],
      lantern: [P(B(0.03, 0.12, 0.03), 0x3a3a48, [0, -0.6, 0.06]), P(B(0.17, 0.04, 0.17), 0x3a3a48, [0, -0.67, 0.06]),
        P(B(0.14, 0.16, 0.14), 0xffe08a, [0, -0.77, 0.06]), P(B(0.17, 0.04, 0.17), 0x3a3a48, [0, -0.87, 0.06])],
    };
    const FRONTS = { // 몸통(0.76 ~ 1.52) 앞면 장식
      apron: [P(B(0.6, 0.64, 0.02), 0xf2a7c3, [0, 1.08, 0.2]), P(B(0.22, 0.12, 0.02), 0xf7c3d6, [0, 0.94, 0.212]), P(B(0.78, 0.05, 0.4), 0xf2a7c3, [0, 1.22, 0])],
      stripes: [P(B(0.78, 0.08, 0.4), 0xffffff, [0, 1.3, 0]), P(B(0.78, 0.08, 0.4), 0xffffff, [0, 1.06, 0]), P(B(0.78, 0.08, 0.4), 0xffffff, [0, 0.84, 0])],
      overalls: [P(B(0.5, 0.42, 0.02), 0x3f5f8f, [0, 1.0, 0.2]), P(B(0.08, 0.42, 0.02), 0x3f5f8f, [0.2, 1.32, 0.2]), P(B(0.08, 0.42, 0.02), 0x3f5f8f, [-0.2, 1.32, 0.2]),
        P(B(0.06, 0.06, 0.02), 0xe8c86a, [0.2, 1.16, 0.212]), P(B(0.06, 0.06, 0.02), 0xe8c86a, [-0.2, 1.16, 0.212])],
      parka: [P(B(0.82, 0.12, 0.44), 0xf4f7ff, [0, 1.5, 0]), P(B(0.05, 0.64, 0.02), 0x3b5aa8, [0, 1.12, 0.2]), P(B(0.8, 0.1, 0.42), 0xf4f7ff, [0, 0.8, 0])],
    };
    const legs = [];
    for (const x of [0.19, -0.19]) {
      if (look.shorts) legs.push(P(B(0.35, 0.28, 0.35), look.pants, [x, 0.62, 0]), P(B(0.32, 0.34, 0.32), look.skin, [x, 0.32, 0]));
      else legs.push(P(B(0.35, 0.6, 0.35), look.pants, [x, 0.46, 0]));
      legs.push(P(B(0.38, 0.16, 0.48), look.shoes, [x, 0.08, 0.05]));
    }
    const anchor = new THREE.Group(), hop = new THREE.Group();
    anchor.add(hop);
    hop.add(new THREE.Mesh(mergeParts([...legs, P(B(0.76, 0.76, 0.38), look.shirt, [0, 1.14, 0]), ...FRONTS[look.front]]), material));
    const headPivot = new THREE.Group();
    headPivot.position.y = 1.54;
    headPivot.add(new THREE.Mesh(mergeParts([
      P(B(0.5, 0.5, 0.5), look.skin, [0, 0.25, 0]),
      P(B(0.52, 0.24, 0.06), look.hair, [0, 0.35, -0.25]),
      P(B(0.06, 0.2, 0.44), look.hair, [0.25, 0.37, -0.03]), P(B(0.06, 0.2, 0.44), look.hair, [-0.25, 0.37, -0.03]),
      P(B(0.07, 0.11, 0.02), 0x2a2238, [0.1, 0.27, 0.255]), P(B(0.07, 0.11, 0.02), 0x2a2238, [-0.1, 0.27, 0.255]),
      P(B(0.09, 0.04, 0.012), 0xff9aa6, [0.17, 0.18, 0.252]), P(B(0.09, 0.04, 0.012), 0xff9aa6, [-0.17, 0.18, 0.252]),
      P(B(0.1, 0.026, 0.012), 0x7a3b3b, [0, 0.14, 0.252]),
      ...HATS[look.hat],
    ]), material));
    hop.add(headPivot);
    const arm = (side, extra) => {
      const pivot = new THREE.Group();
      pivot.position.set(side * 0.575, 1.34, 0);
      pivot.add(new THREE.Mesh(mergeParts([P(B(0.36, 0.58, 0.36), look.shirt, [0, -0.11, 0]), P(B(0.32, 0.18, 0.32), look.skin, [0, -0.49, 0]), ...(extra || [])]), material));
      hop.add(pivot);
      return pivot;
    };
    const armL = arm(1), armR = arm(-1, PROPS[look.prop]); // +x가 왼손, -x가 오른손
    return { anchor, hop, headPivot, armL, armR };
  }

  function createFriends() {
    const KEY = 'season-planet-friends-v1' + PLANET.suffix; // 주민은 행성마다
    const R = CONFIG.planet.radius;
    const rng = makeRng(CONFIG.seed + 1401);
    const material = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.8, metalness: 0 });
    let saved = { met: [false, false, false, false], gifts: [false, false, false, false] };
    try {
      const d = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (d && Array.isArray(d.met) && Array.isArray(d.gifts)) saved = { met: [0, 1, 2, 3].map((i) => !!d.met[i]), gifts: [0, 1, 2, 3].map((i) => !!d.gifts[i]) };
    } catch (e) { /* 기록 없음 → 처음 만남 */ }
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) { /* 저장 못 해도 계속 */ } };

    // ── 자리: 계절 한가운데 쪽 평평한 곳 (봄 친구는 시작 지점 가까이, 여름 친구는 물가를 좋아함) ──
    const spawn = new THREE.Vector3().fromArray(CONFIG.character.spawn).normalize();
    const nrm = new THREE.Vector3(), cand = new THREE.Vector3(), axis = new THREE.Vector3();
    function findSpot(F) {
      const center = F.season === 0
        ? spawn.clone().applyAxisAngle(new THREE.Vector3(-0.92, 0, 0.4).normalize(), 0.165) // 첫 화면에서 캐릭터 뒤쪽에 보이게
        : new THREE.Vector3().fromArray(SEASONS[F.season].center).normalize();
      let best = null, bestScore = Infinity;
      for (let k = 0; k < 5000; k++) {
        axis.set(rng() - 0.5, rng() - 0.5, rng() - 0.5).projectOnPlane(center).normalize();
        cand.copy(center).applyAxisAngle(axis, 0.45 * Math.sqrt(rng()) * (F.season === 0 ? 0.35 : 1));
        if (terrain.seasonAt(cand) !== F.season) continue;
        const ground = terrain.radiusAt(cand, nrm);
        const above = ground - terrain.waterRadius;
        if (nrm.dot(cand) < 0.93 || above < 0.2) continue;
        if (props.debug.colliders.some((c) => c.up.distanceTo(cand) * R < c.r + 1.8)) continue;
        if (gems.list.some((g) => g.up.distanceTo(cand) * R < 3)) continue;
        if (F.season !== 0 && cand.angleTo(spawn) < 0.3) continue;
        const score = cand.angleTo(center) + (F.season === 1 && above < 0.9 ? -0.25 : 0);
        if (score < bestScore) { bestScore = score; best = cand.clone(); }
      }
      return best || center.clone();
    }

    const labelsEl = $('npc-labels');
    const npcs = FRIENDS.map((F) => {
      const up = findSpot(F);
      const v = buildVillager(F.look, material);
      v.anchor.position.copy(up).multiplyScalar(terrain.radiusAt(up));
      scene.add(v.anchor);
      props.addCollider(up, 0.55, 2.4);
      const heading = spawn.clone().sub(up).projectOnPlane(up); // 처음엔 시작 지점 쪽을 봄
      if (heading.lengthSq() < 1e-8) heading.set(1, 0, 0).projectOnPlane(up);
      heading.normalize();
      const label = document.createElement('div');
      label.className = 'npc-label';
      label.style.setProperty('--tone', `var(--${SEASONS[F.season].key})`);
      label.innerHTML = '<span class="npc-mark">!</span><span class="npc-name"></span>';
      label.querySelector('.npc-name').textContent = F.name;
      labelsEl.appendChild(label);
      return { F, up, heading, pos: v.anchor.position, ...v, label, wave: 0, point: 0, hopT: 0, greeted: false, phase: rng() * Math.PI * 2 };
    });
    // 발밑 그림자 (넷을 한 번에)
    const Y = new THREE.Vector3(0, 1, 0), qa = new THREE.Quaternion(), mm = new THREE.Matrix4(), pp = new THREE.Vector3(), one = new THREE.Vector3(1, 1, 1);
    const shadows = new THREE.InstancedMesh(new THREE.PlaneGeometry(1.4, 1.4).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({
      map: createGlowTexture([[0, 'rgba(0,0,0,0.5)'], [0.6, 'rgba(0,0,0,0.22)'], [1, 'rgba(0,0,0,0)']]),
      transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
    }), npcs.length);
    npcs.forEach((n, i) => {
      const r = terrain.radiusAt(n.up, nrm);
      shadows.setMatrixAt(i, mm.compose(pp.copy(n.up).multiplyScalar(r + 0.04), qa.setFromUnitVectors(Y, nrm), one));
    });
    shadows.computeBoundingSphere();
    scene.add(shadows);

    // ── 선물: 받으면 캐릭터에게 입혀 줌 (봄 화관 · 여름 선글라스 · 가을 배지 · 겨울 귀마개) ──
    const wear = (() => {
      const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
      const { head, upper } = character.parts;
      const flowers = [];
      [[0.3, -0.17], [0.3, 0], [0.3, 0.17], [-0.3, -0.17], [-0.3, 0], [-0.3, 0.17], [-0.17, 0.3], [0, 0.3], [0.17, 0.3], [-0.17, -0.3], [0, -0.3], [0.17, -0.3]].forEach(([x, z], i) => {
        flowers.push(P(B(0.1, 0.05, 0.1), i % 2 ? 0xffffff : 0xf7a9c8, [x, 0.14, z], [0, i * 0.5, 0]));
        flowers.push(P(B(0.04, 0.02, 0.04), 0xffd35a, [x, 0.175, z]));
      });
      const crown = new THREE.Mesh(mergeParts(flowers), material);
      const shades = new THREE.Mesh(mergeParts([
        P(B(0.46, 0.035, 0.03), 0x15151f, [0, 0.03, 0.262]),
        P(B(0.15, 0.1, 0.02), 0x1b1b2b, [0.11, -0.015, 0.266]), P(B(0.15, 0.1, 0.02), 0x1b1b2b, [-0.11, -0.015, 0.266]),
        P(B(0.02, 0.03, 0.24), 0x15151f, [0.255, 0.03, 0.14]), P(B(0.02, 0.03, 0.24), 0x15151f, [-0.255, 0.03, 0.14]),
      ]), material);
      const badge = new THREE.Mesh(mergeParts([
        P(new THREE.OctahedronGeometry(0.085, 0), 0xd9472b, [0.2, 0.56, 0.205], [0, 0, 0.4], [1, 1, 0.3]),
        P(B(0.015, 0.07, 0.01), 0x6b3f1f, [0.22, 0.48, 0.2]),
      ]), material);
      const muffs = new THREE.Mesh(mergeParts([
        P(B(0.1, 0.2, 0.2), 0xf4f7ff, [0.29, -0.03, 0]), P(B(0.1, 0.2, 0.2), 0xf4f7ff, [-0.29, -0.03, 0]),
        P(B(0.045, 0.42, 0.07), 0x9fd0ff, [0.305, 0.18, -0.1]), P(B(0.045, 0.42, 0.07), 0x9fd0ff, [-0.305, 0.18, -0.1]),
        P(B(0.655, 0.045, 0.07), 0x9fd0ff, [0, 0.39, -0.1]),
      ]), material);
      head.add(crown, shades, muffs);
      upper.add(badge);
      return [crown, shades, badge, muffs];
    })();
    wear.forEach((m, i) => { m.visible = saved.gifts[i]; });

    // ── 대화 ──
    const talkBtn = $('talk'), dialog = $('dialog'), dName = $('dialog-name'), dText = $('dialog-text'), dNext = $('dialog-next');
    let open = null, nearest = null;
    function talkTo(n) {
      const s = n.F.season, t = gems.perSeason();
      const got = t.per[s], all = t.tot[s], complete = all > 0 && got >= all;
      let lines, gift = false, after = null;
      const Q = quests && !(complete && !saved.gifts[s]) ? quests.talk(s) : null; // 주민 부탁 (보석 선물이 먼저)
      if (saved.gifts[s]) lines = saved.gifts.every(Boolean) ? [n.F.lines.after[0], ALL_GIFTS_LINE] : n.F.lines.after;
      else if (complete) { lines = n.F.lines.ready; gift = true; }
      else lines = saved.met[s] ? n.F.lines.progress : n.F.lines.first;
      if (Q) { lines = saved.met[s] ? Q.lines : [...n.F.lines.first, ...Q.lines]; after = Q.end; }
      saved.met[s] = true;
      save();
      open = { n, lines: lines.map((l) => l.replace('{n}', got).replace('{r}', all - got)), i: 0, gift, after };
      if (!complete) n.point = 4; // 이야기하는 동안 + 끝난 뒤 4초 동안 가장 가까운 보석을 가리킴
      n.wave = 0;
      player.setLocked(true);
      // 캐릭터는 주민 쪽으로 돌아서고, 카메라는 비스듬히 돌아가 둘 다 보이게
      const toNpc = tmp.copy(n.pos).sub(player.anchor.position).projectOnPlane(player.up);
      if (toNpc.lengthSq() > 1e-6) {
        toNpc.normalize();
        player.face(toNpc);
        followView.turnTo(toNpc.negate().applyAxisAngle(player.up, 0.45));
        followView.setFocus(tmp.copy(n.pos).addScaledVector(n.up, 1.3));
      }
      dialog.style.setProperty('--tone', `var(--${SEASONS[s].key})`);
      dName.textContent = `${n.F.title} ${n.F.name}`;
      dialog.hidden = false;
      talkBtn.hidden = true;
      showLine();
    }
    function showLine() {
      dText.textContent = open.lines[open.i];
      const last = open.i === open.lines.length - 1;
      dNext.textContent = last ? '닫기' : '다음';
      audio.talk(open.n.F.season);
      if (last && open.gift) giveGift(open.n);
      if (last && open.after) { const f = open.after; open.after = null; f(); } // 부탁 받기 · 보상
    }
    function next() {
      if (!open) return;
      if (open.i < open.lines.length - 1) { open.i++; showLine(); } else close();
    }
    function close() {
      open = null;
      dialog.hidden = true;
      player.setLocked(false);
      followView.setFocus(null);
    }
    function giveGift(n) {
      const s = n.F.season;
      open.gift = false;
      if (saved.gifts[s]) return;
      saved.gifts[s] = true;
      save();
      wear[s].visible = true;
      if (outfits) outfits.giftReceived(s);
      n.hopT = 0.9;
      showBanner('선물을 받았어요', n.F.gift, SEASONS[s].key);
      audio.gem(s, 'season');
    }
    talkBtn.addEventListener('click', () => { if (nearest && !open) talkTo(nearest); });
    dialog.addEventListener('click', next);
    window.addEventListener('keydown', (e) => {
      if (e.repeat || e.target instanceof HTMLInputElement) return;
      if (open && (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyE')) { e.preventDefault(); next(); }
      else if (!open && !talkBtn.hidden && (e.code === 'KeyE' || e.code === 'Enter') && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); talkTo(nearest); }
    });

    // ── 매 프레임: 바라보기 · 손 흔들기 · 가리키기 · 이름표 ──
    const tmp = new THREE.Vector3(), side = new THREE.Vector3(), aim = new THREE.Vector3(), head = new THREE.Vector3(), proj = new THREE.Vector3(), seg = new THREE.Vector3(), mid = new THREE.Vector3(), basis = new THREE.Matrix4();
    function behindPlanet(a, b) { // 시선이 행성 속을 지나면 가려진 것
      seg.subVectors(b, a);
      const t = clamp(-a.dot(seg) / seg.lengthSq(), 0, 1);
      return mid.copy(a).addScaledVector(seg, t).length() < R - 0.5;
    }
    function update(dt, time) {
      if (open && rig.mode !== 'character') close();
      const live = rig.mode === 'character' && rig.t > 0.9;
      const me = player.anchor.position, tally = gems.perSeason();
      nearest = null;
      let nd = Infinity;
      for (const n of npcs) {
        const d = n.pos.distanceTo(me);
        if (live && d < nd) { nd = d; nearest = n; }
        if (live && d < 7 && !n.greeted) { n.greeted = true; n.wave = 1.6; }
        if (d > 12) n.greeted = false;
        let look = null;
        if (n.point > 0) {
          const g = gems.nearestOpen(n.F.season, n.up);
          if (g) look = aim.copy(g.up).multiplyScalar(g.floor + g.lift); else n.point = 0;
        }
        if (!look && d < 10) look = me;
        if (look) {
          tmp.copy(look).sub(n.pos).projectOnPlane(n.up);
          if (tmp.lengthSq() > 1e-6) n.heading.lerp(tmp.normalize(), 1 - Math.exp(-5 * dt)).projectOnPlane(n.up).normalize();
        }
        side.crossVectors(n.up, n.heading);
        n.anchor.quaternion.setFromRotationMatrix(basis.makeBasis(side, n.up, n.heading));
        const t = time + n.phase, breathe = Math.sin(t * 2.1);
        n.armL.rotation.set(0, 0, 0.06 + 0.02 * breathe);
        n.armR.rotation.set(0, 0, -0.06 - 0.02 * breathe);
        if (n.replyIn > 0) { // 내 반응에 답하기: 손 흔들기 · 하트 → 손 흔들기, 만세 · 춤 → 깡충
          n.replyIn -= dt;
          if (n.replyIn <= 0) {
            if (n.replyKind === 'cheer' || n.replyKind === 'dance') n.hopT = 0.9; else n.wave = 1.6;
            if (n.replyKind === 'heart' && emotes) emotes.burstAt('heart', n.pos, n.up, 0.15);
            audio.talk(n.F.season);
          }
        }
        if (n.wave > 0) { n.wave -= dt; n.armR.rotation.set(0.1, 0, -2.5 - 0.35 * Math.sin(t * 11)); }
        else if (n.point > 0) { if (!open || open.n !== n) n.point -= dt; n.armR.rotation.set(-1.45, 0, -0.08); }
        n.headPivot.rotation.y = 0.18 * Math.sin(t * 0.5);
        if (n.hopT > 0) { n.hopT = Math.max(0, n.hopT - dt); n.hop.position.y = 0.4 * Math.abs(Math.sin((1 - n.hopT / 0.9) * Math.PI * 2)); }
        else n.hop.position.y = 0.01 + 0.01 * breathe;
        // 이름표: 머리 위에 떠 있음. 멀거나 행성 뒤면 숨김, 처음 만나거나 선물을 줄 수 있으면 '!'
        const L = n.label;
        head.copy(n.up).multiplyScalar(n.pos.length() + 2.75 + n.hop.position.y);
        let show = rig.t > 0.6 && camera.position.distanceTo(head) < 28 && !behindPlanet(camera.position, head);
        if (show) {
          proj.copy(head).project(camera);
          show = proj.z < 1 && Math.abs(proj.x) < 1.15 && Math.abs(proj.y) < 1.15;
          if (show) L.style.transform = `translate(${((proj.x + 1) / 2) * window.innerWidth}px, ${((1 - proj.y) / 2) * window.innerHeight}px) translate(-50%, -100%)`;
        }
        L.classList.toggle('show', show);
        const s = n.F.season, ready = tally.tot[s] > 0 && tally.per[s] >= tally.tot[s] && !saved.gifts[s];
        L.classList.toggle('ask', !saved.met[s] || ready || !!(quests && quests.news(s)));
      }
      talkBtn.hidden = !(live && !open && nearest && nd < 3.6);
    }
    function closest(r) {
      let best = null, bd = r;
      for (const n of npcs) { const d = n.pos.distanceTo(player.anchor.position); if (d < bd) { bd = d; best = n; } }
      return best;
    }
    return {
      npcs, update, talkTo, next, get open() { return !!open; }, get saved() { return saved; }, wear,
      nearby(r) { const n = closest(r); return n ? n.pos : null; }, // 반응할 때 바라볼 주민
      react(kind) { if (open) return; const n = closest(7); if (n) { n.replyIn = 0.45; n.replyKind = kind; } },
    };
  }

  // ═══════════════════════════════════════════════
  // 14. EMOTES — 반응: 손 흔들기 · 만세 · 하트 · 춤
  //    가까운 주민이 손을 흔들거나 깡충 뛰며 답하고, 같이 노는 친구 화면에도 똑같이 보임
  // ═══════════════════════════════════════════════
  function createEmotes() {
    const btn = $('emote'), menu = $('emote-menu');

    // 하트 · 음표: 머리 위로 떠올랐다 사라지는 작은 그림
    function iconTexture(draw) {
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      draw(c.getContext('2d'));
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    const heartTex = iconTexture((g) => {
      g.translate(32, 32);
      g.shadowColor = 'rgba(255, 80, 140, 0.85)';
      g.shadowBlur = 8;
      const fill = g.createLinearGradient(0, -22, 0, 20);
      fill.addColorStop(0, '#ffa8cb');
      fill.addColorStop(1, '#ff4d88');
      g.fillStyle = fill;
      g.beginPath();
      g.moveTo(0, 19);
      g.bezierCurveTo(-30, 0, -20, -25, 0, -10);
      g.bezierCurveTo(20, -25, 30, 0, 0, 19);
      g.fill();
      g.shadowBlur = 0;
      g.fillStyle = 'rgba(255, 255, 255, 0.8)';
      g.beginPath();
      g.ellipse(-10, -9, 5, 3, -0.6, 0, Math.PI * 2);
      g.fill();
    });
    const noteTex = iconTexture((g) => {
      g.fillStyle = g.strokeStyle = '#fff1a8';
      g.shadowColor = 'rgba(255, 200, 80, 0.9)';
      g.shadowBlur = 7;
      g.lineCap = 'round';
      g.beginPath(); g.ellipse(22, 46, 9, 7, -0.4, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(46, 40, 9, 7, -0.4, 0, Math.PI * 2); g.fill();
      g.lineWidth = 4;
      g.beginPath(); g.moveTo(30, 44); g.lineTo(30, 14); g.moveTo(54, 38); g.lineTo(54, 8); g.stroke();
      g.lineWidth = 7;
      g.beginPath(); g.moveTo(30, 15); g.lineTo(54, 9); g.stroke();
    });
    const pool = [];
    for (let i = 0; i < 32; i++) {
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: heartTex, transparent: true, depthWrite: false, opacity: 0 }));
      sp.visible = false;
      sp.renderOrder = 4;
      scene.add(sp);
      pool.push({ s: sp, t: 99, delay: 0, life: 1, base: new THREE.Vector3(), up: new THREE.Vector3(), side: new THREE.Vector3(), rise: 1, phase: 0, size: 0.34 });
    }
    let cursor = 0;
    const head = new THREE.Vector3();
    function burstAt(kind, pos, up, height) { // kind: 'heart' | 'note', pos = 발밑
      head.copy(pos).addScaledVector(up, 2.35 + height);
      const n = kind === 'note' ? 6 : 7, gap = kind === 'note' ? 0.45 : 0.07;
      for (let k = 0; k < n; k++) {
        const p = pool[cursor];
        cursor = (cursor + 1) % pool.length;
        p.s.material.map = kind === 'note' ? noteTex : heartTex;
        p.t = 0;
        p.delay = k * gap + Math.random() * 0.08;
        p.life = 1.3 + Math.random() * 0.4;
        p.up.copy(up);
        p.side.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).projectOnPlane(up).normalize();
        p.base.copy(head).addScaledVector(p.side, 0.12 + Math.random() * 0.38);
        p.rise = 0.9 + Math.random() * 0.5;
        p.phase = Math.random() * Math.PI * 2;
        p.size = kind === 'note' ? 0.42 : 0.3 + Math.random() * 0.12;
      }
    }
    function stepSprites(dt) {
      for (const p of pool) {
        if (p.t > p.delay + p.life) { p.s.visible = false; continue; }
        p.t += dt;
        const a = p.t - p.delay;
        if (a < 0 || a > p.life) { p.s.visible = false; continue; }
        const grow = Math.min(1, a / 0.18);
        p.s.visible = true;
        p.s.position.copy(p.base).addScaledVector(p.up, p.rise * a).addScaledVector(p.side, 0.14 * Math.sin(a * 5 + p.phase));
        p.s.scale.setScalar(p.size * (0.5 + 0.5 * grow));
        p.s.material.opacity = grow * (1 - smoothstep(0.55, 1, a / p.life));
      }
    }
    // 한 번의 반응에 딸린 모양 · 소리 (내 것 · 친구 것 같이 씀, gain = 소리 크기)
    function fxFor(kind, pos, up, height, gain) {
      if (kind === 'heart') burstAt('heart', pos, up, height);
      else if (kind === 'dance') burstAt('note', pos, up, height);
      else if (kind === 'cheer') gems.sparkle(head.copy(pos).addScaledVector(up, 2.2 + height), up, terrain.seasonAt(up));
      if (gain > 0) audio.emote(kind, gain);
    }

    let seq = 0, last = null;
    const toward = new THREE.Vector3();
    function play(kind) {
      setMenu(false);
      if (!EMOTE_KINDS.includes(kind) || friends.open || rig.mode !== 'character') return false;
      character.emote = { kind, t: 0 };
      last = { k: kind, i: ++seq }; // 같이 노는 친구에게 알림
      if (player.moving < 0.05) { // 서 있으면 가까운 주민 → 친구 → 카메라(나) 쪽을 보고 함
        const who = friends.nearby(7) || (together ? together.nearestBuddy(9) : null);
        toward.copy(who || camera.position).sub(player.anchor.position);
        player.face(toward);
      }
      fxFor(kind, player.anchor.position, player.up, player.height, 1);
      friends.react(kind);
      return true;
    }

    // 메뉴: 버튼을 누르면 네 가지가 펼쳐짐. 밖을 누르거나 Esc면 닫힘, 키보드 1~4는 바로
    function setMenu(open) {
      menu.hidden = !open;
      btn.setAttribute('aria-expanded', String(open));
    }
    btn.addEventListener('click', () => setMenu(menu.hidden));
    menu.addEventListener('click', (e) => {
      const b = e.target.closest('[data-emote]');
      if (b) play(b.dataset.emote);
    });
    window.addEventListener('pointerdown', (e) => {
      if (!menu.hidden && !menu.contains(e.target) && !btn.contains(e.target)) setMenu(false);
    }, true);
    window.addEventListener('keydown', (e) => {
      if (e.repeat || e.target instanceof HTMLInputElement) return;
      if (e.code === 'Escape') { if (!menu.hidden) setMenu(false); return; }
      const i = ['Digit1', 'Digit2', 'Digit3', 'Digit4'].indexOf(e.code);
      if (i >= 0) play(EMOTE_KINDS[i]);
    });

    return {
      play, fxFor, burstAt,
      get last() { return last; },
      update(dt) {
        stepSprites(dt);
        if (!menu.hidden && rig.mode !== 'character') setMenu(false);
      },
    };
  }

  // ═══════════════════════════════════════════════
  // 14-2. NET — 직접 올린 서버와 WebSocket으로 방 만들기 · 코드로 들어가기 · 끊기면 다시 잇기
  //    Claude의 room · user · downloads와 같은 모양이라 같이 놀기 모듈은 그대로 씀. 로그인 없이 닉네임만
  // ═══════════════════════════════════════════════
  const net = (() => {
    const L = { peers: [], conn: [], status: [] };
    const others = new Map(); // id → { nick, peer }
    let ws = null, want = null, retry = 0, timer = 0, beat = 0, connected = false, status = 'idle', code = null, you = null, nick = '';
    let myPres = Object.freeze({}), selfPeer = null, snapshot = Object.freeze([]);
    const cid = (() => { // 이 탭의 이름표 (다시 이어도 같은 사람으로 보이게)
      const make = () => Array.from({ length: 10 }, () => 'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random() * 36)]).join('');
      try {
        let c = sessionStorage.getItem('season-planet-cid');
        if (!/^[a-z0-9]{10}$/.test(c || '')) { c = make(); sessionStorage.setItem('season-planet-cid', c); }
        return c;
      } catch (e) { return make(); }
    })();
    const peerOf = (id, p, isMe) => Object.freeze({ peer: id, by: id, isMe, sameTab: isMe, kind: 'viewer', guest: false, presence: p, updatedAt: Date.now() });
    const freezeP = (p) => Object.freeze(p && typeof p === 'object' && !Array.isArray(p) ? p : {});
    const call = (list, ...a) => { for (const h of list.slice()) { try { h(...a); } catch (e) { console.error(e); } } };
    function rebuild() { snapshot = Object.freeze([...(selfPeer ? [selfPeer] : []), ...[...others.values()].map((o) => o.peer)]); }
    function changed(ch) { rebuild(); call(L.peers, Object.freeze({ peers: snapshot, joined: ch.joined || [], left: ch.left || [], updated: ch.updated || [] })); }
    function setConnected(v) { if (v !== connected) { connected = v; call(L.conn, v); } }
    function setStatus(s, info) {
      status = s;
      if ((s === 'idle' || s === 'error') && world) world.useLocal(); // 방을 나오면 내 세계로
      call(L.status, s, info);
    }
    const send = (m) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); };
    function drop() { // 연결 정리: 다른 사람 목록은 조용히 비움 (나간다는 인사 없이)
      clearTimeout(timer);
      clearInterval(beat);
      if (ws) { ws.onopen = ws.onmessage = ws.onclose = null; try { ws.close(); } catch (e) { /* 이미 닫힘 */ } ws = null; }
      others.clear();
      selfPeer = null;
      changed({});
      setConnected(false);
    }
    function fail(reason) { want = null; drop(); setStatus('error', reason); }
    function open() {
      drop();
      let sock;
      try { sock = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`); } catch (e) { fail('offline'); return; }
      ws = sock;
      let opened = false;
      sock.onopen = () => { opened = true; retry = 0; if (want) send({ ...want, cid }); };
      sock.onmessage = (ev) => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } if (m && typeof m === 'object') onMessage(m); };
      sock.onclose = () => {
        if (sock !== ws) return;
        ws = null;
        if (want && !(!opened && status === 'connecting')) setStatus('lost'); // 끊김을 먼저 알린 뒤 정리
        others.clear();
        selfPeer = null;
        changed({});
        setConnected(false);
        if (!want) return;
        if (!opened && status === 'connecting') { fail('offline'); return; } // 처음부터 못 이으면 알려 줌
        timer = setTimeout(open, Math.min(10000, 1000 * 2 ** retry++)); // 끊기면 1 · 2 · 4 · 8 · 10초 간격으로 다시
      };
    }
    function onMessage(m) {
      if (m.t === 'joined') {
        const made = want && want.t === 'create';
        code = String(m.room);
        you = String(m.you);
        nick = String(m.nick || nick);
        want = { t: 'join', room: code, nick, recreate: true, pid: myPid(), planet: PLANET.id }; // 이제부터 끊기면 이 방으로 (서버가 새로 켜졌으면 같은 코드로 다시 만듦)
        others.clear();
        for (const q of Array.isArray(m.peers) ? m.peers : []) if (q && typeof q.id === 'string') others.set(q.id, { nick: String(q.nick || ''), peer: peerOf(q.id, freezeP(q.p), false) });
        selfPeer = peerOf(you, myPres, true);
        rebuild();
        call(L.peers, Object.freeze({ peers: snapshot, joined: snapshot.slice(), left: [], updated: [] }));
        setStatus('room');
        setConnected(true);
        clearInterval(beat);
        beat = setInterval(() => send({ t: 'hb' }), 50000); // 다들 가만히 있어도 무료 서버가 잠들지 않게
        if (Object.keys(myPres).length) send({ t: 'presence', p: myPres });
        if (world) { if (made) world.remember(code); world.useRoom(Array.isArray(m.world) ? m.world : [], Number(m.now), !!m.fresh, code); }
        if (animals) animals.resetScares(m.scares);
      } else if (m.t === 'world' && m.op && world && world.mode === 'room') {
        world.applyOp(m.op);
      } else if (m.t === 'scare' && animals) {
        animals.scare(m.a | 0, m.f, Number(m.at)); // 누가 동물을 놀라게 함 → 모두 같은 시각부터 달아남
      } else if (m.t === 'peer' && typeof m.id === 'string') {
        const peer = peerOf(m.id, freezeP(m.p), false);
        others.set(m.id, { nick: String(m.nick || ''), peer });
        changed({ joined: [peer] });
      } else if (m.t === 'presence' && others.has(m.id)) {
        const o = others.get(m.id);
        o.peer = peerOf(m.id, freezeP(m.p), false);
        changed({ updated: [o.peer] });
      } else if (m.t === 'left' && others.has(m.id)) {
        const o = others.get(m.id);
        others.delete(m.id);
        changed({ left: [o.peer] });
      } else if (m.t === 'error') {
        fail(String(m.code || 'offline'));
      }
    }
    const room = Object.freeze({
      peers: () => snapshot,
      presence(patch) {
        const merged = { ...myPres };
        for (const k of Object.keys(patch || {})) { if (patch[k] === null) delete merged[k]; else merged[k] = patch[k]; }
        const json = JSON.stringify(merged);
        if (new TextEncoder().encode(json).length > 4096) return Promise.reject({ code: 'invalid_argument', message: '상태가 4KB를 넘어요' });
        myPres = Object.freeze(JSON.parse(json));
        if (selfPeer) { selfPeer = peerOf(you, myPres, true); rebuild(); }
        send({ t: 'presence', p: myPres });
        return Promise.resolve();
      },
      onPeers(h) { L.peers.push(h); return () => { const i = L.peers.indexOf(h); if (i >= 0) L.peers.splice(i, 1); }; },
      onConnection(h) { L.conn.push(h); queueMicrotask(() => h(connected)); return () => { const i = L.conn.indexOf(h); if (i >= 0) L.conn.splice(i, 1); }; },
      connected: () => connected,
      emit: () => Promise.resolve(),
      on: () => () => {},
    });
    const user = Object.freeze({ // 이름 = 각자 적은 닉네임
      me: async () => ({ id: you || cid, name: nick, email: null, isOwner: false, canEdit: false }),
      id: async () => you || cid,
      profiles: async (ids) => Object.fromEntries([].concat(ids).map((id) => [id, { id, name: id === you ? nick : (others.get(id) || { nick: '' }).nick, isMe: id === you }])),
      isOwner: async () => false, canEdit: async () => false, can: async () => null,
    });
    const downloads = Object.freeze({ // 보통 웹 페이지라서 바로 내려받기
      async save({ filename, data }) {
        const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        return { status: 'saved' };
      },
    });
    return {
      room, user, downloads,
      get status() { return status; }, get code() { return code; }, get nick() { return nick; },
      create(n) { nick = n; want = { t: 'create', nick: n, pid: myPid(), planet: PLANET.id, world: world ? world.localItems() : [] }; retry = 0; setStatus('connecting'); open(); },
      act(op) { send({ ...op, t: 'act' }); }, // 짓기 · 심기 · 물 주기 · 거두기 · 치우기
      scare(a, f) { send({ t: 'scare', a, f }); }, // 동물을 놀라게 함
      seed(items) { send({ t: 'seed', items }); },
      join(c, n) { nick = n; want = { t: 'join', room: c, nick: n, pid: myPid(), planet: PLANET.id }; retry = 0; setStatus('connecting'); open(); },
      leave() { send({ t: 'leave' }); want = null; code = null; you = null; setStatus('idle'); drop(); },
      onStatus(h) { L.status.push(h); },
    };
  })();
  // 같이 놀기 모듈은 window.claude.use(...)로 연결을 받으므로 같은 모양으로 넘겨 줌
  window.claude = Object.freeze({ use: (name) => Promise.resolve({ room: net.room, user: net.user, downloads: net.downloads }[name] || null) });

  // 멀티 로비: 닉네임 · 방 만들기 · 코드로 들어가기 · 초대 링크 · 나가기
  function createLobby() {
    const KEY = 'season-planet-nick';
    const lobby = $('lobby'), bar = $('roombar'), nickIn = $('nick'), codeIn = $('room-code'), msg = $('lobby-msg'), label = $('room-label');
    const ERR = {
      no_room: '그 코드의 방이 없어요. 코드를 다시 확인해 주세요',
      full: '방이 가득 찼어요 (최대 8명)',
      busy: '서버가 바빠요. 잠시 뒤 다시 해 보세요',
      offline: '서버에 연결할 수 없어요. 잠시 뒤 다시 해 보세요',
    };
    try { nickIn.value = localStorage.getItem(KEY) || ''; } catch (e) { /* 저장된 닉네임 없음 */ }
    const say = (text, bad) => { msg.textContent = text; msg.classList.toggle('bad', !!bad); };
    const cleanCode = (v) => v.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
    function nickname() {
      const n = nickIn.value.replace(/[\u0000-\u001f\u007f-\u009f\u00ad\u200b-\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g, '').replace(/\s+/g, ' ').trim().slice(0, 12);
      if (!n) { say('닉네임을 먼저 적어 주세요', true); nickIn.focus(); return null; }
      nickIn.value = n;
      try { localStorage.setItem(KEY, n); } catch (e) { /* 저장이 안 돼도 괜찮음 */ }
      return n;
    }
    function create() { const n = nickname(); if (n) { say('방을 만드는 중…'); net.create(n); } }
    function join() {
      const n = nickname();
      if (!n) return;
      const c = cleanCode(codeIn.value);
      if (c.length !== 4) { say('방 코드 4글자를 적어 주세요', true); codeIn.focus(); return; }
      say('들어가는 중…');
      net.join(c, n);
    }
    $('room-create').addEventListener('click', create);
    $('room-join').addEventListener('click', join);
    codeIn.addEventListener('input', () => { const v = cleanCode(codeIn.value); if (v !== codeIn.value) codeIn.value = v; });
    codeIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); });
    nickIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') { if (cleanCode(codeIn.value).length === 4) join(); else create(); } });
    $('room-invite').addEventListener('click', async () => {
      const url = `${location.origin}${location.pathname}${location.search}#room=${net.code}`, text = `${GAME_NAME} ${PLANET.name}에서 같이 놀자! 방 코드 ${net.code}`;
      if (navigator.share) { // 휴대폰: 공유 창 (카톡 등)
        try { await navigator.share({ title: GAME_NAME, text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
      }
      try { await navigator.clipboard.writeText(url); say('초대 링크를 복사했어요. 친구에게 보내 주세요'); }
      catch (e) { say(`이 주소를 친구에게 보내 주세요: ${url}`); }
    });
    $('room-leave').addEventListener('click', () => {
      net.leave();
      history.replaceState(null, '', location.pathname + location.search);
      say('방에서 나왔어요');
    });
    net.onStatus((st, info) => {
      const inRoom = st === 'room' || st === 'lost';
      lobby.hidden = inRoom;
      bar.hidden = !inRoom;
      if (st === 'room') { label.textContent = net.code; history.replaceState(null, '', `#room=${net.code}`); say(''); }
      else if (st === 'error') say(ERR[info] || ERR.offline, true);
    });
    // 초대 링크(#room=코드)로 들어오면: 코드를 채워 두고, 닉네임만 적고 들어가기를 누르면 되게
    const m = location.hash.match(/room=([A-Za-z0-9]{4})/);
    if (m) {
      codeIn.value = cleanCode(m[1]);
      $('room-join').classList.add('lobby-main'); // 초대받았으면 '들어가기'가 먼저
      $('room-create').classList.remove('lobby-main');
      if ($('together-panel').hidden) $('together').click();
      say(`${codeIn.value} 방에 초대받았어요. 닉네임을 적고 들어가기를 눌러 주세요`);
    }
  }

  //    서버에 남는 건 없고, 혼자일 때도 사진과 레이스(혼자 연습)는 그대로 됨
  // ═══════════════════════════════════════════════
  const BUDDY_LOOKS = [
    { jacket: 0xe8703a, beanie: 0x3a78c9, band: 0x2d5fa3, scarf: 0xf4d35e, pack: 0x7fb069, flap: 0x5f9150 },
    { jacket: 0x2f9e6e, beanie: 0xe94f64, band: 0xc23b50, scarf: 0xfff3e2, pack: 0xd9a24e, flap: 0xb9812f },
    { jacket: 0x8e5bd6, beanie: 0xf2b134, band: 0xd9962a, scarf: 0x4ec3e0, pack: 0xe07a5f, flap: 0xc4604a },
    { jacket: 0xd94f7a, beanie: 0x2e3a59, band: 0x222c46, scarf: 0x9be07a, pack: 0xf2cc8f, flap: 0xd9ad6c },
    { jacket: 0x3aa6b9, beanie: 0xf07a3a, band: 0xd26128, scarf: 0xf2e9dc, pack: 0xb56576, flap: 0x96505f },
    { jacket: 0xc9a227, beanie: 0x6a4bc4, band: 0x5539a6, scarf: 0xe8584a, pack: 0x4d908e, flap: 0x3c7573 },
  ];
  const TAG_COLORS = ['#e8703a', '#2f9e6e', '#8e5bd6', '#d94f7a', '#3aa6b9', '#c9a227'];

  // 친구 캐릭터: 내 캐릭터와 같은 모양, 색만 다름. 관절별로 합쳐 둠 (몸 · 머리 · 팔 둘 · 다리 둘)
  function buildBuddy(look, material) {
    const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
    const SKIN = 0xf2c49b;
    const anchor = new THREE.Group(), root = new THREE.Group(), body = new THREE.Group();
    anchor.add(root); root.add(body);
    body.position.y = 0.76;
    body.add(new THREE.Mesh(mergeParts([
      P(B(0.76, 0.76, 0.38), look.jacket, [0, 0.38, 0]), P(B(0.05, 0.64, 0.02), 0x222a44, [0, 0.34, 0.195]),
      P(B(0.56, 0.56, 0.2), look.pack, [0, 0.3, -0.29]), P(B(0.6, 0.16, 0.24), look.flap, [0, 0.52, -0.3]),
      P(B(0.84, 0.14, 0.48), look.scarf, [0, 0.79, 0]),
    ]), material));
    const neck = new THREE.Group();
    neck.position.y = 0.8;
    body.add(neck);
    neck.add(new THREE.Mesh(mergeParts([
      P(B(0.5, 0.5, 0.5), SKIN, [0, 0.25, 0]),
      P(B(0.07, 0.11, 0.02), 0x2a2238, [0.1, 0.24, 0.255]), P(B(0.07, 0.11, 0.02), 0x2a2238, [-0.1, 0.24, 0.255]),
      P(B(0.09, 0.04, 0.012), 0xff9aa6, [0.17, 0.15, 0.252]), P(B(0.09, 0.04, 0.012), 0xff9aa6, [-0.17, 0.15, 0.252]),
      P(B(0.1, 0.026, 0.012), 0x7a3b3b, [0, 0.11, 0.252]),
      P(B(0.56, 0.1, 0.56), look.band, [0, 0.38, 0]), P(B(0.53, 0.2, 0.53), look.beanie, [0, 0.52, 0]),
      P(B(0.15, 0.15, 0.15), 0xfff3e2, [0, 0.69, 0]), P(B(0.52, 0.2, 0.05), 0x4a2f24, [0, 0.24, -0.265]),
    ]), material));
    // 선물(보미 화관 · 해솔 선글라스 · 도토 배지 · 설이 귀마개): 친구가 받은 것만 보임
    const flowers = [];
    [[0.3, -0.17], [0.3, 0], [0.3, 0.17], [-0.3, -0.17], [-0.3, 0], [-0.3, 0.17], [-0.17, 0.3], [0, 0.3], [0.17, 0.3], [-0.17, -0.3], [0, -0.3], [0.17, -0.3]].forEach(([x, z], i) => {
      flowers.push(P(B(0.1, 0.05, 0.1), i % 2 ? 0xffffff : 0xf7a9c8, [x, 0.39, z], [0, i * 0.5, 0]), P(B(0.04, 0.02, 0.04), 0xffd35a, [x, 0.425, z]));
    });
    const wear = [
      new THREE.Mesh(mergeParts(flowers), material),
      new THREE.Mesh(mergeParts([P(B(0.46, 0.035, 0.03), 0x15151f, [0, 0.28, 0.262]), P(B(0.15, 0.1, 0.02), 0x1b1b2b, [0.11, 0.235, 0.266]), P(B(0.15, 0.1, 0.02), 0x1b1b2b, [-0.11, 0.235, 0.266])]), material),
      new THREE.Mesh(mergeParts([P(new THREE.OctahedronGeometry(0.085, 0), 0xd9472b, [0.2, 0.56, 0.205], [0, 0, 0.4], [1, 1, 0.3])]), material),
      new THREE.Mesh(mergeParts([P(B(0.1, 0.2, 0.2), 0xf4f7ff, [0.29, 0.22, 0]), P(B(0.1, 0.2, 0.2), 0xf4f7ff, [-0.29, 0.22, 0]), P(B(0.655, 0.045, 0.07), 0x9fd0ff, [0, 0.64, -0.1])]), material),
    ];
    neck.add(wear[0], wear[1], wear[3]);
    body.add(wear[2]);
    wear.forEach((m) => { m.visible = false; });
    const limb = (x, y, parts, parent) => {
      const pivot = new THREE.Group();
      pivot.position.set(x, y, 0);
      pivot.add(new THREE.Mesh(mergeParts(parts), material));
      parent.add(pivot);
      return pivot;
    };
    const arms = [1, -1].map((s) => limb(s * 0.575, 0.58, [P(B(0.36, 0.58, 0.36), look.jacket, [0, -0.11, 0]), P(B(0.32, 0.18, 0.32), SKIN, [0, -0.49, 0])], body));
    const legs = [1, -1].map((s) => limb(s * 0.19, 0, [P(B(0.35, 0.6, 0.35), 0x2f3441, [0, -0.3, 0]), P(B(0.38, 0.16, 0.48), 0x7b4a2d, [0, -0.68, 0.05])], body));
    return { anchor, root, body, neck, arms, legs, wear };
  }

  function createTogether() {
    const R = CONFIG.planet.radius;
    const RACE_LEAD = 5;   // 레이스 출발 전 준비 시간(초)
    const material = addNearFade(new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.8, metalness: 0 })); // 카메라 바로 앞 친구는 나무처럼 흐려짐 (사진을 가리지 않게)
    const shadowMap = createGlowTexture([[0, 'rgba(0,0,0,0.5)'], [0.6, 'rgba(0,0,0,0.22)'], [1, 'rgba(0,0,0,0)']]);
    const labelsEl = $('npc-labels'), panel = $('together-panel'), openBtn = $('together'), badge = $('together-badge'), who = $('together-who');
    const logEl = $('chat-log'), form = $('chat-form'), input = $('chat-input'), raceBtn = $('act-race');
    const countEl = $('countdown'), flashEl = $('flash'), photoEl = $('photo'), photoImg = $('photo-img'), photoSave = $('photo-save'), boardEl = $('raceboard');
    let room = null, user = null, downloads = null, connected = false, joinedAt = 0, meId = null, myName = '';
    const names = new Map(), asking = new Set(), buddies = new Map();
    let dirty = true;

    // ── 이름: id를 이 화면에서 보이는 이름으로 (저장하지 않고 그때그때 물어봄) ──
    const idOf = (peer) => peer.by || (peer.presence && typeof peer.presence.id === 'string' ? peer.presence.id : null);
    function withName(id, fn) { // 이름을 알게 되면 부름 (모르면 '친구')
      if (!id || !user || names.has(id)) { fn(nameOfId(id)); return; }
      user.profiles([id]).then((ps) => { names.set(id, (ps && ps[id] && ps[id].name) || ''); fn(nameOfId(id)); });
    }
    function nameOfId(id) {
      if (!id) return '친구';
      if (names.has(id)) return names.get(id) || '친구';
      if (user && !asking.has(id)) {
        asking.add(id);
        user.profiles([id]).then((ps) => {
          names.set(id, (ps && ps[id] && ps[id].name) || '');
          for (const b of buddies.values()) if (b.userId === id) { b.name = names.get(id) || '친구'; b.tag.name.textContent = b.name; }
        });
      }
      return '친구';
    }

    // ── 채팅 기록 ──
    const clean = (t) => String(t || '').replace(/[\u0000-\u001f\u007f-\u009f\u00ad\u200b-\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g, '').replace(/\s+/g, ' ').trim().slice(0, 120);
    function addLine(whoText, text, kind) {
      const row = document.createElement('div');
      row.className = 'msg' + (kind ? ` ${kind}` : '');
      if (whoText) { const b = document.createElement('b'); b.textContent = whoText; row.appendChild(b); }
      const span = document.createElement('span');
      span.textContent = text;
      row.appendChild(span);
      logEl.appendChild(row);
      while (logEl.children.length > 60) logEl.removeChild(logEl.firstChild);
      logEl.scrollTop = logEl.scrollHeight;
      if (panel.hidden && kind !== 'mine') openBtn.classList.add('unread');
    }
    const sys = (text) => addLine('', text, 'sys');

    // ── 머리 위 이름표 · 말풍선 ──
    function makeTag(color) {
      const el = document.createElement('div');
      el.className = 'buddy-tag';
      el.style.setProperty('--tone', color);
      el.innerHTML = '<div class="buddy-bubble"></div><div class="buddy-name"></div>';
      labelsEl.appendChild(el);
      return { el, bubble: el.firstChild, name: el.lastChild, until: 0 };
    }
    const meTag = makeTag('var(--scarf)');
    meTag.name.hidden = true;
    const say = (tag, text) => { tag.bubble.textContent = text; tag.until = performance.now() + 6000; };

    // ── 패널 ──
    function setPanel(open) {
      panel.hidden = !open;
      openBtn.setAttribute('aria-expanded', String(open));
      if (open) { openBtn.classList.remove('unread'); logEl.scrollTop = logEl.scrollHeight; } else input.blur();
    }
    openBtn.addEventListener('click', () => setPanel(panel.hidden));
    $('together-close').addEventListener('click', () => setPanel(false));
    window.addEventListener('keydown', (e) => {
      if (e.code !== 'Escape') return;
      if (!photoEl.hidden) photoEl.hidden = true; else if (!panel.hidden) setPanel(false);
    });
    function updateWho(others) {
      const st = net.status, inRoom = st === 'room' && connected;
      if (st === 'connecting') who.textContent = '연결하는 중…';
      else if (st === 'lost') who.textContent = '연결이 끊겼어요. 다시 잇는 중…';
      else if (!inRoom) who.textContent = '방을 만들거나 방 코드로 들어가 친구와 같이 놀아요';
      else who.textContent = others > 0 ? `나까지 ${others + 1}명이 함께 있어요` : '지금은 나 혼자예요. 초대 링크를 보내 친구를 불러 보세요';
      input.disabled = !inRoom;
      badge.classList.toggle('label', !inRoom); // 방 밖에선 '멀티' 딱지, 방 안에선 친구 수
      badge.textContent = inRoom ? String(others) : '멀티';
      badge.hidden = inRoom && !(others > 0);
    }

    // ── 채팅 보내기: 내 상태(presence)에 최근 세 마디를 실어 둠 ──
    let chatSeq = 0;
    const myChat = [];
    function sendChat(text) {
      const t = clean(text);
      if (!t) return;
      chatSeq++;
      myChat.push({ i: chatSeq, t });
      while (myChat.length > 3) myChat.shift();
      addLine(myName || '나', t, 'mine');
      say(meTag, t);
      dirty = true;
    }
    form.addEventListener('submit', (e) => { e.preventDefault(); sendChat(input.value); input.value = ''; });

    // ── 카운트다운 (사진 · 레이스 출발) ──
    const cd = { active: false, end: 0, shown: -1, done: null };
    function startCountdown(seconds, done) {
      if (cd.active) return false;
      Object.assign(cd, { active: true, end: performance.now() + seconds * 1000, shown: -1, done });
      return true;
    }
    function tickCountdown() {
      if (!cd.active) return;
      const left = (cd.end - performance.now()) / 1000;
      if (left <= 0) { cd.active = false; countEl.classList.remove('show'); cd.done(); return; }
      const n = Math.ceil(left);
      if (n !== cd.shown) {
        cd.shown = n;
        countEl.textContent = String(n);
        countEl.classList.remove('show');
        void countEl.offsetWidth;
        countEl.classList.add('show');
        audio.tick();
      }
    }

    // ── 같이 사진: 누군가 누르면 모두 3초 뒤 포즈 → 각자 화면을 찍음 ──
    let photoSeq = 0, myPhoto = null, localPose = null, lastPhoto = null, selfie = null;
    function startPhoto(fromName) {
      if (!startCountdown(3, shoot)) return;
      setPanel(false);
      if (fromName) sys(`${fromName}님이 같이 사진을 찍재요`);
      if (rig.mode === 'character' && !friends.open && !(home && home.active)) { // 셀카 구도: 캐릭터 앞에서 조금 멀리 (주민과 대화 · 집 안이면 그대로)
        selfie = { back: player.camBack.clone(), dist: followView.targetDist };
        player.setLocked(true);
        followView.turnTo(player.heading.clone());
        followView.zoomTo(Math.max(8, followView.targetDist));
      }
    }
    function shoot() {
      localPose = 'cheese';
      character.pose = 'cheese';
      dirty = true;
      for (const b of buddies.values()) b.cheer = 1.6;
      setTimeout(() => {
        flashEl.classList.remove('go');
        void flashEl.offsetWidth;
        flashEl.classList.add('go');
        audio.shutter();
        capture();
        setTimeout(() => {
          localPose = null;
          character.pose = null;
          dirty = true;
          if (selfie) { followView.turnTo(selfie.back); followView.zoomTo(selfie.dist); player.setLocked(friends.open || !!(life && life.holdsPlayer)); selfie = null; } // 앉아 있었으면 계속 앉은 채로
        }, 1100);
      }, 350);
    }
    function capture() {
      if (home && home.active) home.render(renderer, true); else renderer.render(scene, camera);
      const src = renderer.domElement, W = src.width, H = src.height;
      const pad = Math.round(Math.min(W, H) * 0.04), bar = Math.round(Math.min(W, H) * 0.17);
      const out = document.createElement('canvas');
      out.width = W + pad * 2;
      out.height = H + pad * 2 + bar;
      const g = out.getContext('2d');
      g.fillStyle = '#fbf7f0';
      g.fillRect(0, 0, out.width, out.height);
      g.drawImage(src, pad, pad);
      const season = SEASONS[terrain.seasonAt(player.up)];
      g.fillStyle = '#2a2238';
      g.font = `${Math.round(bar * 0.36)}px Jua, "Apple SD Gothic Neo", sans-serif`;
      g.fillText(`${GAME_NAME} · ${PLANET.name}`, pad, H + pad + bar * 0.5);
      g.fillStyle = '#6b6478';
      g.font = `${Math.round(bar * 0.2)}px "Gowun Dodum", "Apple SD Gothic Neo", sans-serif`;
      g.fillText(`${season.name} 구역에서, ${new Date().toLocaleDateString('ko-KR')}`, pad, H + pad + bar * 0.82);
      ['#ffb3cf', '#86dd6f', '#ff9d4d', '#c6e9ff'].forEach((c, i) => {
        g.fillStyle = c;
        g.beginPath();
        g.arc(out.width - pad - bar * 0.12 - (3 - i) * bar * 0.24, H + pad + bar * 0.5, bar * 0.08, 0, Math.PI * 2);
        g.fill();
      });
      photoImg.src = out.toDataURL('image/png');
      lastPhoto = new Promise((res) => out.toBlob(res, 'image/png')); // 저장 버튼이 먼저 눌려도 기다림
      photoSave.hidden = !downloads;
      photoEl.hidden = false;
    }
    $('act-photo').addEventListener('click', () => {
      photoSeq++;
      myPhoto = { i: photoSeq, at: Date.now() };
      dirty = true;
      startPhoto(null);
    });
    photoSave.addEventListener('click', async () => {
      if (!downloads || !lastPhoto || photoSave.disabled) return;
      photoSave.disabled = true;
      const d = new Date(), z = (n) => String(n).padStart(2, '0');
      try {
        const blob = await lastPhoto;

        proj.copy(head).project(camera);
        show = proj.z < 1 && Math.abs(proj.x) < 1.15 && Math.abs(proj.y) < 1.15;
        if (show) tag.el.style.transform = `translate(${((proj.x + 1) / 2) * window.innerWidth}px, ${((1 - proj.y) / 2) * window.innerHeight}px) translate(-50%, -100%)`;
      }
      tag.el.classList.toggle('show', show);
      tag.el.classList.toggle('talking', tag.until > performance.now());
    }
    function placeTags() {
      const view = rig.t > 0.6;
      head.copy(player.anchor.position).addScaledVector(player.up, 2.6 + player.height);
      placeTag(meTag, view && meTag.until > performance.now());
      for (const b of buddies.values()) {
        head.copy(b.anchor.position).addScaledVector(b.up, 2.6 + b.height);
        placeTag(b.tag, view && b.anchor.visible && camera.position.distanceTo(head) < 34 && !behindPlanet(camera.position, head));
      }
    }

    // ── 내 상태 알리기 (초당 10번쯤, 바뀐 게 있을 때만) ──
    let sendWait = 0, lastJson = '';
    const r2 = (v) => Math.round(v * 100) / 100, r3 = (v) => Math.round(v * 1000) / 1000;
    function publish(dt) {
      if (!room) return;
      sendWait -= dt;
      if (sendWait > 0 && !dirty) return;
      sendWait = 0.1;
      dirty = false;
      const a = player.anchor.position, h = player.heading, d = player.debug();
      const pres = {
        v: 1, id: meId,
        p: [r2(a.x), r2(a.y), r2(a.z)], h: [r3(h.x), r3(h.y), r3(h.z)],
        hh: r2(player.height), sp: r2(clamp(player.moving, 0, 1)), g: d.grounded ? 1 : 0, vy: Math.round(d.vy * 10) / 10,
        o: outfits ? outfits.wornGifts : friends.saved.gifts.reduce((m, g, i) => m | (g ? 1 << i : 0), 0), // 쓰고 있는 선물
        pose: localPose, chat: myChat.length ? myChat : null, photo: myPhoto, race: raceHost, em: emotes ? emotes.last : null,
        ac: life ? life.presAct : null, gf: life ? life.presGifts : null, ot: life ? life.presOutfit : null, pl: PLANET.id,
        rt: race.id && race.mine.length ? { i: race.id, got: race.mine } : null,
      };
      const json = JSON.stringify(pres);
      if (json === lastJson) return;
      lastJson = json;
      room.presence(pres).catch(() => {});
    }

    // ── 연결 (나중에 켜짐: 없으면 혼자 노는 그대로) ──
    updateWho(0);
    (async () => {
      const C = window.claude;
      if (!C || typeof C.use !== 'function') return;
      const [r, u, dl] = await Promise.all([C.use('room'), C.use('user'), C.use('downloads')]).catch(() => [null, null, null]);
      user = u;
      downloads = dl;
      if (user) { const me = await user.me(); meId = me.id; myName = me.name; }
      if (!r) { updateWho(0); return; }
      room = r;
      room.onConnection((ok) => {
        connected = ok;
        if (ok) joinedAt = performance.now(); // (다시) 들어올 때마다: 처음 한꺼번에 오는 목록엔 인사 생략
        dirty = true;
        updateWho(buddies.size);
      }, () => { room = null; for (const key of [...buddies.keys()]) removeBuddy(key); updateWho(0); });
      room.onPeers((ch) => {
        const settled = joinedAt && performance.now() - joinedAt > 2500; // 처음 한꺼번에 오는 목록엔 인사 생략
        if (settled) for (const p of ch.joined) if (!p.isMe && p.kind === 'viewer') withName(idOf(p), (nm) => sys(`${nm}님이 들어왔어요`));
        for (const p of ch.left) if (!p.isMe && p.kind === 'viewer' && buddies.has(p.peer)) sys(`${buddies.get(p.peer).name}님이 나갔어요`);
      }, () => { room = null; for (const key of [...buddies.keys()]) removeBuddy(key); updateWho(0); });
      dirty = true;
      updateWho(0);
    })();

    let whoWait = 0, lastOthers = -1;
    function update(dt, time) {
      publish(dt);
      const others = syncPeers();
      whoWait -= dt;
      if (whoWait <= 0 || others !== lastOthers) { whoWait = 0.5; lastOthers = others; updateWho(others); }
      moveBuddies(dt, time);
      raceStep(dt, time);
      tickCountdown();
      placeTags();
    }
    return {
      update, sendChat, on: hooks, myKey,
      nearestBuddy(r) { let best = null, bd = r; for (const b of buddies.values()) { const d = b.anchor.position.distanceTo(player.anchor.position); if (d < bd) { bd = d; best = b.anchor.position; } } return best; },
      get buddies() { return buddies; }, get race() { return race; }, get connected() { return connected && !!room; },
      debug() { return { room: !!room, connected, buddies: [...buddies.values()].map((b) => ({ name: b.name, pos: b.anchor.position.toArray().map((v) => +v.toFixed(2)) })), race: { id: race.id, active: race.active, over: race.over, n: race.gems.length, owner: race.owner.map((o) => (o ? o.name : null)) } }; },
    };
  }

  // ═══════════════════════════════════════════════
  // 16. JOURNAL — 기록장: 계절 보석 · 주민 선물 · 만난 날씨 · 레이스 기록
  //    위쪽 보석 칩을 누르면 열림 (J 키도). 날씨와 레이스 기록은 이 기기에 남음
  // ═══════════════════════════════════════════════
  function createJournal() {
    const KEY = 'season-planet-journal-v1';
    const TONES = ['spring', 'summer', 'autumn', 'winter'];
    const WX_HINTS = ['봄 구역에 가끔 내려요', '여름 구역에 가끔 지나가요', '가을 구역에 가끔 껴요', '겨울 구역에 가끔 몰아쳐요'];
    const panel = $('journal'), body = $('journal-body'), sub = $('journal-sub'), chip = $('gems');
    const data = { weather: [false, false, false, false], solo: null, races: 0, wins: 0, opened: false };
    try {
      const d = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (d && typeof d === 'object') {
        if (Array.isArray(d.weather)) data.weather = [0, 1, 2, 3].map((i) => !!d.weather[i]);
        if (d.solo && Number.isFinite(d.solo.n) && Number.isFinite(d.solo.ms)) data.solo = { n: clamp(d.solo.n | 0, 1, 99), ms: Math.max(0, d.solo.ms) };
        data.races = Math.max(0, d.races | 0);
        data.wins = clamp(d.wins | 0, 0, data.races);
        data.opened = !!d.opened;
      }
    } catch (e) { /* 기록이 없거나 읽을 수 없음 → 새 기록장 */ }
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* 저장이 안 돼도 게임은 계속 */ } };
    const fmt = (ms) => { const t = ms / 1000; return t < 60 ? `${t.toFixed(1)}초` : `${Math.floor(t / 60)}분 ${(t % 60).toFixed(1)}초`; };
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const tone = (e, s) => { e.style.setProperty('--c', `var(--${TONES[s]})`); return e; };
    const section = (title, ...kids) => { const sec = el('section', 'jr-sec'); sec.append(el('h3', null, title), ...kids); return sec; };
    if (!data.opened) chip.classList.add('fresh'); // 처음엔 칩에 점: 눌러 볼 수 있다는 표시

    function render() {
      const t = gems.perSeason(), fs = friends.saved;
      const got = t.per.reduce((a, b) => a + b, 0), total = t.tot.reduce((a, b) => a + b, 0);
      sub.textContent = `보석 ${got}/${total}, 선물 ${fs.gifts.filter(Boolean).length}/4, 날씨 ${data.weather.filter(Boolean).length}/4`;
      const gemRows = [0, 1, 2, 3].map((s) => {
        const row = tone(el('div', 'jr-row'), s), bar = el('div', 'jr-bar'), fill = el('i');
        fill.style.setProperty('--p', t.tot[s] ? t.per[s] / t.tot[s] : 0);
        bar.append(fill);
        row.append(el('span', 'jr-dot'), el('span', null, SEASONS[s].name), bar, el('span', 'jr-num', `${t.per[s]}/${t.tot[s]}`));
        return row;
      });
      const people = el('div', 'jr-grid');
      FRIENDS.forEach((F, s) => {
        const left = t.tot[s] - t.per[s];
        const status = fs.gifts[s] ? `선물: ${F.gift}` : !fs.met[s] ? '아직 못 만났어요' : left > 0 ? `${SEASONS[s].name} 보석 ${left}개 더 모으면 선물을 줘요` : `보석을 다 모았어요. ${F.name}에게 가 보세요`;
        const card = tone(el('div', 'jr-card' + (fs.gifts[s] ? ' got' : fs.met[s] ? '' : ' dim')), s);
        card.append(el('b', null, F.name), el('span', null, F.title), el('small', null, status));
        people.append(card);
      });
      const skies = el('div', 'jr-grid');
      fx.weatherNames.forEach((name, s) => {
        const seen = data.weather[s], card = tone(el('div', 'jr-card' + (seen ? ' got' : ' dim')), s);
        card.append(el('b', null, name), el('small', null, seen ? '만났어요' : WX_HINTS[s]));
        skies.append(card);
      });
      const race = el('div', 'jr-race');
      race.append(
        el('p', null, data.solo ? `혼자 연습 최고: ${data.solo.n}개, ${fmt(data.solo.ms)}` : '혼자 연습 기록은 아직 없어요'),
        el('p', null, data.races ? `친구와 레이스 ${data.races}번, 1등 ${data.wins}번` : '친구와 한 레이스는 아직 없어요'),
      );
      if (!data.solo && !data.races) race.append(el('p', 'jr-tip', '같이 놀기 버튼에서 보석 레이스를 열 수 있어요'));
      body.replaceChildren(section('보석', ...gemRows), section('주민', people), section('날씨', skies), section('레이스', race));
    }

    let sig = '', wait = 0;
    const signature = () => JSON.stringify([gems.perSeason().per, friends.saved, data]);
    function setOpen(v) {
      panel.hidden = !v;
      chip.setAttribute('aria-expanded', String(v));
      if (!v) return;
      if (!$('together-panel').hidden) $('together-close').click(); // 아래 판은 하나만
      chip.classList.remove('fresh');
      if (!data.opened) { data.opened = true; save(); }
      render();
      sig = signature();
      body.scrollTop = 0;
    }
    chip.addEventListener('click', () => setOpen(panel.hidden));
    $('journal-close').addEventListener('click', () => setOpen(false));
    $('together').addEventListener('click', () => { if (!panel.hidden) setOpen(false); });
    window.addEventListener('keydown', (e) => {
      if (e.repeat || e.target instanceof HTMLInputElement) return;
      if (e.code === 'Escape' && !panel.hidden) setOpen(false);
      else if (e.code === 'KeyJ') setOpen(panel.hidden);
    });

    // 처음 만난 날씨 → 기록 + 알림
    fx.on.weather = (s) => {
      if (data.weather[s]) return;
      data.weather[s] = true;
      save();
      chip.classList.add('fresh');
      showBanner(`새 날씨, ${fx.weatherNames[s]}`, '기록장에 적어 두었어요', TONES[s]);
    };
    // 레이스가 끝나면: 혼자 연습은 최고 기록과 비교 (많이 모은 게 먼저, 같으면 빠른 쪽), 친구와 한 건 횟수 · 1등
    together.on.raceEnd = ({ solo, n, ms, won }) => {
      if (solo) {
        if (n <= 0) return null;
        const prev = data.solo, best = !prev || n > prev.n || (n === prev.n && ms < prev.ms);
        if (best) { data.solo = { n, ms }; chip.classList.add('fresh'); }
        save();
        return { best, time: fmt(ms), bestText: `${data.solo.n}개, ${fmt(data.solo.ms)}` };
      }
      data.races++;
      if (won) data.wins++;
      save();
      return null;
    };

    return {
      update(dt) { // 열려 있는 동안 바뀐 게 있으면 다시 그림
        if (panel.hidden) return;
        wait -= dt;
        if (wait > 0) return;
        wait = 0.5;
        const now = signature();
        if (now !== sig) { sig = now; render(); }
      },
      open: () => setOpen(true), close: () => setOpen(false),
      get data() { return data; },
    };
  }

  // ═══════════════════════════════════════════════
  // 16-2. LIFE HELPERS — 활동 자세(앉기 · 낚시 · 기타 · 노래 · 먹기 · 일하기 · 엎드리기), 구 위에 물건 세우기
  // ═══════════════════════════════════════════════
  // P: { arms: [왼팔, 오른팔], legs, torso, neck, body }  body.position.y = 엉덩이 높이
  function applyActivity(a, P, dt) {
    a.t = (a.t || 0) + dt;
    const t = a.t, k = Math.min(1, t / 0.25); // 처음 0.25초 동안 자세로 옮겨 감
    const [armL, armR] = P.arms;
    const rot = (o, x, y, z) => { o.rotation.x = mix(o.rotation.x, x, k); o.rotation.y = mix(o.rotation.y, y, k); o.rotation.z = mix(o.rotation.z, z, k); };
    if (a.k === 'sit' || a.k === 'guitar' || ((a.k === 'sing' || a.k === 'eat') && a.seat)) seatPose(P, k);
    if (a.k === 'sit') {
      rot(armL, -0.6, 0, 0.2); rot(armR, -0.6, 0, -0.2);
      P.neck.rotation.x = 0.06 * Math.sin(t * 0.9);
    } else if (a.k === 'fish') {
      const tug = a.bite ? 0.22 * Math.sin(t * 34) : 0.035 * Math.sin(t * 2.2);
      rot(armR, -1.1 + tug, 0, -0.08); rot(armL, -0.95 + tug, -0.3, 0.2);
      if (a.cast < 0.55) { const c = Math.sin(Math.PI * Math.min(1, a.cast / 0.55)); armR.rotation.x -= 1.5 * c; armL.rotation.x -= 1.2 * c; a.cast += dt; } // 던지기: 뒤로 들었다가 휙
    } else if (a.k === 'guitar') {
      const s = a.strum || 0; // 줄을 칠 때 1 → 0
      rot(armL, -1.05, 0.35, 0.62); // 줄 누르는 손: 기타 목 쪽 (왼쪽)
      armR.rotation.x = mix(armR.rotation.x, -0.62 - 0.32 * s, k);
      armR.rotation.y = mix(armR.rotation.y, -0.3, k);
      armR.rotation.z = mix(armR.rotation.z, -0.28, k);
      P.neck.rotation.x = 0.16 + 0.05 * Math.sin(t * 5.2); // 박자에 고개 끄덕
      P.neck.rotation.z = 0.07 * Math.sin(t * 2.6);
    } else if (a.k === 'sing') {
      const sw = Math.sin(t * 2.4);
      rot(armL, -0.45, 0, 0.38 + 0.12 * sw); rot(armR, -0.45, 0, -0.38 + 0.12 * sw);
      P.neck.rotation.x = -0.2 + 0.05 * Math.sin(t * 4.8); // 고개 들고 흔들흔들
      P.neck.rotation.z = 0.13 * sw;
      P.torso.rotation.z = 0.05 * sw;
    } else if (a.k === 'eat') {
      const chew = Math.max(0, Math.sin(t * 15));
      rot(armR, -2.15 + 0.12 * chew, 0.2, -0.5); rot(armL, -0.35, 0, 0.18);
      P.neck.rotation.x = 0.07 * chew;
    } else if (a.k === 'prone') { // 엎드리기: 배를 땅에 대고 고개를 들어 앞을 봄, 움직이면 팔다리를 번갈아 끌며 기어감
      const m = Math.min(1, (a.move || 0) * 2.5), sw = m * Math.sin(t * 9);
      P.body.rotation.x = mix(P.body.rotation.x, 1.45, k); // 엉덩이를 축으로 몸 전체를 앞으로 눕힘 (다리는 뒤로)
      P.body.position.y = mix(P.body.position.y, 0.24, k);
      if (P.torso !== P.body) P.torso.rotation.x = mix(P.torso.rotation.x, 0, k); // 친구 모습은 몸통 = 엉덩이 묶음
      P.neck.rotation.x = mix(P.neck.rotation.x, -1.1 + 0.08 * Math.sin(t * 1.3), k);
      rot(armL, -2.55 + 0.45 * sw, 0, 0.38); rot(armR, -2.55 - 0.45 * sw, 0, -0.38);
      P.legs.forEach((l, i) => { l.rotation.x = mix(l.rotation.x, (i ? 1 : -1) * 0.3 * sw, k); l.rotation.z = mix(l.rotation.z, (i ? -1 : 1) * 0.1, k); });
    } else if (a.k === 'work') { // 나무하기 · 돌 캐기 · 줍기: 두 손을 들었다 내려침
      const s = Math.sin(((t % 0.45) / 0.45) * Math.PI);
      rot(armR, -2.5 + 2.1 * s, 0, -0.12); rot(armL, -2.4 + 2.0 * s, 0, 0.12);
      P.torso.rotation.x = mix(P.torso.rotation.x, 0.28 * s, k);
    }
  }
  function seatPose(P, k) { // 다리를 앞으로 뻗고 땅에 앉음 (사진 찍을 때도 앉은 채로)
    P.legs.forEach((l, i) => { l.rotation.x = mix(l.rotation.x, -1.42, k); l.rotation.z = mix(l.rotation.z, (i ? -1 : 1) * 0.1, k); });
    P.body.position.y = mix(P.body.position.y, 0.22, k);
    P.torso.rotation.x = mix(P.torso.rotation.x, -0.04, k);
  }

  // 구 위의 한 점 d(단위 벡터)에서 yaw만큼 돌린 방향: y = 위, z = 앞 (모두가 같은 기준이라 친구 화면에서도 같은 방향)
  const _fr = { r: new THREE.Vector3(), e: new THREE.Vector3(), n: new THREE.Vector3(), f: new THREE.Vector3(), s: new THREE.Vector3(), m: new THREE.Matrix4() };
  function tangentFrame(d) { // 동쪽 · 북쪽 (극 근처는 다른 기준)
    const ref = Math.abs(d.y) < 0.95 ? _fr.r.set(0, 1, 0) : _fr.r.set(1, 0, 0);
    _fr.e.crossVectors(ref, d).normalize();
    _fr.n.crossVectors(d, _fr.e).normalize();
    return _fr;
  }
  function frameQuat(d, yaw, out) {
    const F = tangentFrame(d);
    F.f.copy(F.n).multiplyScalar(Math.cos(yaw)).addScaledVector(F.e, Math.sin(yaw));
    F.s.crossVectors(d, F.f).normalize();
    return out.setFromRotationMatrix(F.m.makeBasis(F.s, d, F.f));
  }
  function yawOf(d, forward) { const F = tangentFrame(d); return Math.atan2(forward.dot(F.e), forward.dot(F.n)); }
  function prismGeo(w, h, d) { // 삼각 지붕 기둥: 밑면 w × d, 높이 h, 용마루는 x축 방향
    const x = w / 2, z = d / 2;
    const v = [[-x, 0, -z], [x, 0, -z], [x, 0, z], [-x, 0, z], [-x, h, 0], [x, h, 0]];
    const tris = [[0, 4, 5], [0, 5, 1], [3, 2, 5], [3, 5, 4], [0, 3, 4], [1, 5, 2]];
    const pos = [];
    for (const tr of tris) for (const i of tr) pos.push(...v[i]);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    return g;
  }
  const isLand = (d, margin = 0.06) => terrain.radiusAt(d) > terrain.waterRadius + margin;
  const tmpQ = new THREE.Quaternion();
  // 정수 두 개 → 섞인 32비트 수 (모든 기기에서 같은 값: 동물이 어디로 갈지 정하는 주사위)
  function hash2(a, b) {
    let h = Math.imul((a | 0) ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul((b | 0) + 0x632be5ab, 0xc2b2ae35);
    h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; h = Math.imul(h, 0x297a2d39); h ^= h >>> 15;
    return h >>> 0;
  }

  // ═══════════════════════════════════════════════
  // 16-3. ANIMALS — 계절마다 다른 동물 (같은 방이면 모두에게 똑같이)
  //    봄: 토끼 · 오리 가족 · 파랑새   여름: 개구리 · 거북이 · 제비   가을: 다람쥐 · 고슴도치 · 기러기   겨울: 펭귄 · 북극여우 · 흰멧새
  //    움직임은 모두 '같은 시각'에서 계산: 방에선 서버 시각, 누가 다가가면 '놀람'을 서버가 모두에게 알림
  // ═══════════════════════════════════════════════
  function createAnimals() {
    const rng = makeRng(CONFIG.seed + 2201); // 모든 기기에서 같은 자리 · 같은 길
    const R = CONFIG.planet.radius, WR = terrain.waterRadius;
    const material = addNearFade(new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.85, metalness: 0 }));

    const FLOCK_BASE = walkers.length; // 놀람 번호: 땅 동물 0..N-1, 새 무리 N + fi

    const sentAt = new Map();

    // ── 저장 · 검사 ──

    const rid = () => Math.random().toString(36).slice(2, 10);
    let local = [];
    try { const d = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(d)) local = d.map(clean).filter(Boolean).slice(0, TOTAL); } catch (e) { /* 새 세계 */ }
    for (const it of local) if (!it.own) it.own = myPid(); // 15단계에 지은 것은 내 것
    let mode = 'local', offset = 0, ownRoom = false;
    const now = () => Date.now() + offset;

    const on = { change: null, harvest: null, placed: null, removed: null, crop: null };

    // ── 바뀜 적용 (혼자든 방이든 같은 길) ──

    const mineOf = (k) => [...live.values()].find((e) => e.it.k === k && e.it.own === myPid()) || null;

          if (e.it.k !== 'field' || e.group.position.distanceTo(pos) > 4) continue;
          e.slots.forEach((sl, i) => { const w = e.group.localToWorld(lp.set(sl.x, 0.1, sl.z)); const d = w.distanceTo(pos); if (d < bd) { bd = d; best = { e, slot: i, crop: e.it.crops[i], at: w.clone() }; } });

      },
      update(dt, time) {
        const pp = player.anchor.position;
        let nearFire = null, nf = 9;
        for (const e of live.values()) {
          if (e.grow > 0 && e.grow < 1) { e.grow = Math.min(1, e.grow + dt * 2.2); const s = 1 - Math.pow(1 - e.grow, 3); e.group.scale.set(1, 0.05 + 0.95 * s, 1); }

    const legs = [1, -1].map((s) => limb(s * 0.19, 0, [P(B(0.35, 0.6, 0.35), 0x2f3441, [0, -0.3, 0]), ...feet], body));
    return { anchor, root, body, neck, arms, legs, wear, geos };
  }

  // 내 캐릭터: 원래 부품은 색만 바꾸거나 숨기고, 새 부품은 덧붙임
  function createOutfits() {
    const KEY = 'season-planet-outfit-v1';
    let ot = DEFAULT_OUTFIT.slice(), gw = 15, saved = false; // gw = 선물 중 쓰고 있는 것 (비트)
    try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d) { ot = cleanOutfit(d.ot); gw = (d.gw | 0) & 15; saved = true; } } catch (e) { /* 처음 */ }
    if (!saved) ot[8] = hash2(parseInt(myPid().slice(0, 6), 36) | 0, 7) % OUTFIT.looks.length; // 처음 온 사람: 저마다 다른 색 조합 (내 화면 · 친구 화면 모두 같게)
    const { head, upper, arms, legs } = character.parts;
    const neck = head.parent;
    const base = { torso: upper.children[0], zip: upper.children[1], pack: [upper.children[2], upper.children[3]], scarf: [upper.children[4], upper.children[5].children[0]],
      band: head.children[0], beanie: head.children[1], pompom: head.children[2], hair: head.children[3], sleeves: arms.map((a) => a.children[0]), boots: legs.map((l) => l.children[1]) };
    const mats = new Map();
    const matOf = (hex) => { if (!mats.has(hex)) mats.set(hex, new THREE.MeshStandardMaterial({ color: hex, roughness: 0.8, metalness: 0 })); return mats.get(hex); };
    const extraMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.8, metalness: 0 });
    let extras = [];
    function apply() {
      for (const m of extras) { m.parent.remove(m); m.geometry.dispose(); }
      extras = [];
      const look = lookOf(ot), jacket = ot[2] === 0 ? look.jacket : OUTFIT.colors[ot[2]];
      base.torso.material = matOf(jacket);
      for (const s of base.sleeves) s.material = matOf(jacket);
      base.zip.material = matOf(new THREE.Color(jacket).multiplyScalar(0.6).getHex());
      base.band.material = matOf(look.band); base.beanie.material = matOf(look.beanie); // 색 조합: 비니 · 목도리 · 배낭
      base.pack[0].material = matOf(look.pack); base.pack[1].material = matOf(look.flap);
      for (const m of base.scarf) m.material = matOf(look.scarf);
      for (const m of [base.band, base.beanie, base.pompom]) m.visible = ot[0] === 0;
      base.hair.visible = false; // 원래 뒷머리 한 줄 → 머리 모양이 뒤통수를 다 덮음
      for (const m of base.pack) m.visible = ot[4] === 0;
      for (const m of base.boots) m.visible = !OUTFIT.shoes[ot[3]].parts;
      const O = outfitParts(ot);
      const add = (parent, parts) => { if (!parts || !parts.length) return; const m = new THREE.Mesh(mergeParts(parts), extraMat); parent.add(m); extras.push(m); };
      add(neck, O.head);
      add(upper, O.body);
      if (O.feet) for (const l of legs) add(l, O.feet);
      const owned = friends.saved.gifts;
      friends.wear.forEach((m, i) => { m.visible = !!owned[i] && !!(gw & (1 << i)); });
    }
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ ot, gw })); } catch (e) { /* 이번만 */ } };
    apply();
    return {
      get ot() { return ot.slice(); },
      get gw() { return gw; },
      get wornGifts() { return friends.saved.gifts.reduce((m, g, i) => m | (g && gw & (1 << i) ? 1 << i : 0), 0); },
      set(i, v) { ot[i] = v; ot = cleanOutfit(ot); save(); apply(); },
      toggleGift(i) { gw ^= 1 << i; save(); apply(); },
      giftReceived(i) { gw |= 1 << i; save(); apply(); },
      apply,
    };
  }

  // ═══════════════════════════════════════════════
  // 16-7. HOME — 집 안: 아늑한 방 + 옷장 (다른 장면을 그림)
  // ═══════════════════════════════════════════════
  function createHome() {
    const panel = $('wardrobe'), grid = $('wd-grid'), tabs = [...panel.querySelectorAll('[data-tab]')], title = $('wd-title'), fade = $('fade');
    let built = null, active = false, tab = 'hat', house = null, spinT = 0;
    const HOUSE_WALL = [0xf6ead8, 0xdcecf5, 0xf7dfe6, 0xe3f2e1, 0xfff1c9, 0xe9e3f7];
    function build() {
      const sc = new THREE.Scene();
      sc.background = new THREE.Color(0x2b2033);
      sc.add(new THREE.HemisphereLight(0xfff4e0, 0x6b4f3a, 1.1));
      const sun = new THREE.DirectionalLight(0xfff1d6, 1.3);
      sun.position.set(-2, 4, 3);
      sc.add(sun);
      const lamp = new THREE.PointLight(0xffc27a, 1.2, 8, 1.5);
      lamp.position.set(2.2, 2.2, -0.6);
      sc.add(lamp);
      const mat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.85, metalness: 0 });
      const wallMat = new THREE.MeshStandardMaterial({ color: 0xf6ead8, flatShading: true, roughness: 0.95 });
      const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
      const planks = [];
      for (let i = 0; i < 8; i++) planks.push(P(B(0.74, 0.1, 8.5), i % 2 ? 0xb07a4f : 0xa06c43, [-2.6 + i * 0.75, -0.05, 1.75])); // 앞쪽까지 (사진에 빈 곳 없게)
      sc.add(new THREE.Mesh(mergeParts(planks), mat));
      const walls = new THREE.Mesh(mergeParts([P(B(6.2, 4.8, 0.12), 0xffffff, [0, 2.4, -2.5]), P(B(0.12, 4.8, 5), 0xffffff, [-3.05, 2.4, 0]), P(B(0.12, 4.8, 5), 0xffffff, [3.05, 2.4, 0])]), wallMat);
      sc.add(walls);
      sc.add(new THREE.Mesh(mergeParts([
        // 창문 (바깥 하늘)
        P(B(1.5, 1.1, 0.05), 0x9fd6ff, [-1.2, 2.0, -2.42]), P(B(1.62, 0.08, 0.1), 0xffffff, [-1.2, 2.58, -2.4]), P(B(1.62, 0.08, 0.1), 0xffffff, [-1.2, 1.42, -2.4]), P(B(0.08, 1.2, 0.1), 0xffffff, [-1.2, 2.0, -2.4]), P(B(1.62, 0.06, 0.1), 0xffffff, [-1.2, 2.0, -2.4]),
        P(B(0.4, 0.3, 0.12), 0xd9667a, [-1.7, 1.55, -2.3]), P(B(0.12, 0.2, 0.12), 0x6cc04a, [-1.7, 1.78, -2.3]),
        // 옷장
        P(B(1.3, 2.4, 0.6), 0x8a5a35, [2.1, 1.2, -2.1]), P(B(0.6, 2.2, 0.04), 0x9c6b43, [1.78, 1.2, -1.79]), P(B(0.6, 2.2, 0.04), 0x9c6b43, [2.42, 1.2, -1.79]), P(B(0.05, 0.3, 0.05), 0xf2c94c, [2.05, 1.2, -1.76]), P(B(0.05, 0.3, 0.05), 0xf2c94c, [2.15, 1.2, -1.76]),
        // 거울
        P(B(0.8, 1.9, 0.1), 0xc9a36a, [-2.4, 1.05, -1.8], [0, 0.5, 0]), P(B(0.64, 1.72, 0.02), 0xcfe6f2, [-2.37, 1.05, -1.74], [0, 0.5, 0]),
        // 동그란 깔개 · 화분 · 스탠드
        P(new THREE.CylinderGeometry(1.5, 1.5, 0.03, 20), 0xf2b8c6, [0, 0.015, 0.4]), P(new THREE.CylinderGeometry(1.1, 1.1, 0.035, 20), 0xfbe3e8, [0, 0.02, 0.4]),
        P(B(0.4, 0.4, 0.4), 0xc9803e, [-2.5, 0.2, 1.2]), P(new THREE.DodecahedronGeometry(0.4, 0), 0x5fae78, [-2.5, 0.75, 1.2]),
        P(new THREE.CylinderGeometry(0.05, 0.05, 1.8, 6), 0x3a3a3a, [2.5, 0.9, 0.6]), P(new THREE.CylinderGeometry(0.2, 0.35, 0.35, 8), 0xffe0a3, [2.5, 1.9, 0.6]),
        // 액자
        P(B(0.9, 0.7, 0.06), 0x9c6b43, [1.0, 2.3, -2.42]), P(B(0.74, 0.54, 0.02), 0x86dd6f, [1.0, 2.3, -2.38]), P(B(0.3, 0.2, 0.02), 0xffb3cf, [0.9, 2.35, -2.36]),
      ]), mat));
      const cam = new THREE.PerspectiveCamera(34, 1, 0.1, 60); // 온몸이 화면 높이의 40%쯤 되게 떨어져서
      cam.position.set(0, 1.25, 9.4);
      cam.lookAt(0, 1.15, 0.4);
      const figure = new THREE.Group(); // 옷장 인형 (내 모습)
      figure.position.set(0, 0.04, 0.4);
      sc.add(figure);
      built = { sc, cam, figure, wallMat, doll: null, mat: new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.8, metalness: 0 }) };
    }
    const size = new THREE.Vector2();
    function refreshDoll() {
      if (!built) return;
      if (built.doll) { built.figure.remove(built.doll.anchor); for (const g of built.doll.geos) g.dispose(); }
      const a = buildAvatar(null, outfits.ot, built.mat); // 색 조합도 옷 정보에서 → 친구 화면과 같은 모습
      a.wear.forEach((m, i) => { m.visible = !!(outfits.wornGifts & (1 << i)); });
      built.doll = a;
      built.figure.add(a.anchor);
    }
    function locked(key) { // 잠긴 옷: 주민 부탁으로 얻음
      if (!key) return false;
      if (key === 'gifts') return !friends.saved.gifts.every(Boolean);
      return !quests.unlocked(key);
    }
    const lockText = (it) => (it.hint || `${it.from}의 부탁`); // 잠긴 옷 아래 작은 글씨
    function option(label, sub, on, isLocked, pick, swatch) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'press wd-opt';
      b.setAttribute('aria-pressed', String(on));
      if (swatch) { b.classList.add('swatch'); b.style.setProperty('--c', swatch); }
      b.append(Object.assign(document.createElement('b'), { textContent: label }));
      if (sub) b.append(Object.assign(document.createElement('small'), { textContent: sub }));
      b.disabled = isLocked;
      b.addEventListener('click', () => { pick(); render(); refreshDoll(); audio.fx('pop', 0.4); quests.track('dress'); });
      return b;
    }
    function render() {
      tabs.forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === tab)));
      const ot = outfits.ot, list = [];
      const simple = (key, idx) => OUTFIT[key].forEach((it, i) => list.push(option(it.name, locked(it.lock) ? lockText(it) : '', ot[idx] === i, locked(it.lock), () => outfits.set(idx, i))));
      if (tab === 'hat') simple('hat', 0);
      else if (tab === 'hair') { // 머리 모양 + 머리 색
        OUTFIT.hair.forEach((it, i) => list.push(option(it.name, '모양', ot[6] === i, false, () => outfits.set(6, i))));
        OUTFIT.hairColors.forEach((c, i) => list.push(option(OUTFIT.hairColorNames[i], '', ot[7] === i, false, () => outfits.set(7, i), '#' + c.toString(16).padStart(6, '0'))));
      }
      else if (tab === 'shoes') simple('shoes', 3);
      else if (tab === 'bag') simple('bag', 4);
      else if (tab === 'acc') {
        simple('acc', 5);
        OUTFIT.gifts.forEach((name, i) => { if (friends.saved.gifts[i]) list.push(option(name, (outfits.gw & (1 << i)) ? '쓰는 중' : '벗음', !!(outfits.gw & (1 << i)), false, () => outfits.toggleGift(i))); });
      } else { // 옷: 모양 + 색
        OUTFIT.styles.forEach((it, i) => list.push(option(it.name, locked(it.lock) ? lockText(it) : '모양', ot[1] === i, locked(it.lock), () => outfits.set(1, i))));
        const look = lookOf(ot);
        OUTFIT.colors.forEach((c, i) => list.push(option(OUTFIT.colorNames[i], '', ot[2] === i, false, () => outfits.set(2, i), '#' + (i ? c : look.jacket).toString(16).padStart(6, '0'))));
        PALETTES().forEach((pl, i) => list.push(option(OUTFIT.looks[i], '비니 · 목도리 · 배낭', ot[8] === i, false, () => outfits.set(8, i), '#' + pl.scarf.toString(16).padStart(6, '0'))));
      }
      grid.replaceChildren(...list);
    }
    tabs.forEach((t) => t.addEventListener('click', () => { tab = t.dataset.tab; render(); }));
    $('wd-exit').addEventListener('click', () => exit());
    function enter(e) {
      if (active) return;
      if (!built) build();
      house = e;
      built.wallMat.color.setHex(HOUSE_WALL[e.it.c % HOUSE_WALL.length]);
      title.textContent = `${world.ownerName(e)} 집`;
      fade.classList.add('on');
      setTimeout(() => {
        active = true;
        document.body.classList.add('inside');
        player.setLocked(true);
        refreshDoll();
        render();
        panel.hidden = false;
        fade.classList.remove('on');
      }, 260);
      audio.fx('door', 0.6);
    }
    function exit() {
      if (!active) return;
      fade.classList.add('on');
      setTimeout(() => {
        active = false;
        document.body.classList.remove('inside');
        panel.hidden = true;
        if (house && world.live.has(house.it.id)) { // 문 앞에 나와서 집을 등지고 섬
          const door = world.doorOf(house).normalize(), away = door.clone().sub(house.v).projectOnPlane(door).normalize();
          player.teleport(door, away);
          followView.turnTo(away.clone()); // 카메라는 문 밖에서 얼굴 쪽 (집 안에 파묻히지 않게)
        }
        player.setLocked(false);
        house = null;
        fade.classList.remove('on');
      }, 260);
      audio.fx('door', 0.5);
    }
    return {
      enter, exit,
      get active() { return active; },
      get house() { return house; },
      render(r, photo) { // 방 장면 (photo: 사진은 가운데 구도로)
        r.getSize(size);
        const key = size.x + 'x' + size.y + (photo ? 'p' : '');
        if (built.key !== key) {
          built.key = key;
          const tall = size.x < size.y, cam = built.cam;
          if (photo) {
            cam.position.set(0, 1.4, tall ? 9.2 : 8.6);
            cam.lookAt(0, 1.1, 0.4);
            cam.aspect = size.x / size.y;
            cam.clearViewOffset();
          } else { // 옷장 판이 아래쪽을 가리니 화면을 밀어 올려 인형이 위쪽 가운데에 오게 (세로 화면은 조금 더 떨어져서)
            cam.position.set(0, 1.25, tall ? 11.4 : 9.4);
            cam.lookAt(0, 1.15, 0.4);
            cam.setViewOffset(size.x, size.y, 0, size.y * (tall ? 0.17 : 0.2), size.x, size.y);
          }
        }
        r.render(built.sc, built.cam);
      },
      update(dt) {
        if (!active || !built || !built.doll) return;
        if (house && !world.live.has(house.it.id)) exit(); // 누가 집을 치웠으면 밖으로
        spinT += dt;
        built.doll.anchor.rotation.y = spinT * 0.5; // 천천히 한 바퀴씩: 등에 멘 가방 · 리본도 보이게
        built.doll.body.position.y = 0.76 + 0.01 * Math.sin(spinT * 2.1);
        const cheese = character.pose === 'cheese'; // 같이 사진: 집 안 인형도 만세
        built.doll.arms[0].rotation.z = cheese ? 2.4 : 0.08 + 0.03 * Math.sin(spinT * 2.1);
        built.doll.arms[1].rotation.z = cheese ? -2.4 : -0.08 - 0.03 * Math.sin(spinT * 2.1);
        if (cheese) built.doll.anchor.rotation.y = 0; // 사진은 앞모습으로
        built.doll.neck.rotation.y = 0.2 * Math.sin(spinT * 0.45);
      },
    };
  }
